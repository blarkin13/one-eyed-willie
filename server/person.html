<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cast · Yarr Media</title>
<link rel="icon" type="image/png" sizes="128x128" href="/assets/favicon.png?v=5">
<link rel="stylesheet" href="/assets/ui.css?v=wordmark-1">
<script defer src="/assets/shell.js?v=profiles-1"></script>
<style>
.person-content{max-width:1220px}
.person-back{display:inline-flex;margin:12px 0 30px;color:#adcce9}
.person-hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:clamp(22px,4vw,58px);align-items:start}
.person-hero > *{min-width:0}
.person-photo-frame{position:relative;width:100%;min-width:0;min-height:0;aspect-ratio:3/4;background:#162334;border-radius:9px;overflow:hidden}
.person-photo-fallback{position:absolute;inset:0;display:grid;place-items:center;color:#8ba1b8;font-size:4rem;font-weight:700}
.person-photo-fallback[hidden]{display:none}
.person-portrait{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover;background:#162334;border-radius:9px}
.person-portrait[hidden]{display:none}
.person-hero h1{font-size:clamp(2.1rem,4vw,3.8rem);line-height:1.1;margin:0 0 20px}
.person-hero p{line-height:1.75;color:#cad5e1;max-width:800px}
.person-sources{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px}
.person-sources a{color:#b7d9f6;text-decoration:underline;text-underline-offset:3px}
.person-filmography{margin-top:44px}
.person-filmography h2{margin-bottom:22px}
.person-credits{list-style:none;margin:0;padding:0}
.person-credits li{padding:13px 0;border-bottom:1px solid #243346;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.person-credits strong{color:#e3edf8}.person-credits span{color:#94aac1;font-size:.86rem;text-align:right}
@media(min-width:701px) and (max-width:900px){
 .person-hero{grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:25px}
}
@media(max-width:700px){
 /* A 200px minimum portrait height previously forced its width across the
    biography column. On phones the portrait and biography must not share a row. */
 .person-content{min-width:0;box-sizing:border-box}
 .person-hero{grid-template-columns:minmax(0,1fr);gap:18px}
 .person-photo-frame{width:clamp(120px,39vw,170px);max-width:100%;min-height:0}
 .person-hero h1{font-size:clamp(1.85rem,7vw,2.5rem);margin:0 0 13px;overflow-wrap:anywhere}
 .person-hero p{font-size:.94rem;line-height:1.65;overflow-wrap:anywhere}
 .person-sources{gap:12px 20px;margin-top:15px}
 .person-filmography{margin-top:30px}
 .person-credits{grid-template-columns:repeat(2,minmax(0,1fr));gap:19px 12px!important}
 .person-credit-link{min-width:0}
}

/* One selectable title-card per credit; focus the image, never an entire row. */
.person-credits{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(min(100%,145px),1fr));
  gap:22px 17px!important;list-style:none;margin:0;padding:0}
.person-credits li{display:block!important;padding:0!important;border:0!important;min-width:0}
.person-credit-link{display:flex;flex-direction:column;gap:5px;min-width:0;color:#e8f2fb}
.person-credit-poster{position:relative;aspect-ratio:2/3;border-radius:9px;overflow:hidden;
  background:linear-gradient(145deg,#2b4058,#0d1724);border:1px solid #384c62}
.person-credit-poster img{display:block;width:100%;height:100%;object-fit:cover}
.person-credit-placeholder{height:100%;display:grid;place-items:center;color:#9db3c9}
.person-credit-link strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.88rem}
.person-credit-link small{display:block;color:#94abc4;font-size:.76rem;line-height:1.3;max-height:2.6em;overflow:hidden}
/* Only the artwork receives focus chrome, never the title/role beneath it.
   Use !important to override shared TV and library link-focus rules. */
body[data-page="movies"] .person-credits .person-credit-link:is(:focus,:focus-visible,:hover){
  outline:0!important;outline-offset:0!important;box-shadow:none!important;
  border-color:transparent!important;text-decoration:none!important;
  background:transparent!important
}
body[data-page="movies"] .person-credit-link:is(:focus,:focus-visible) .person-credit-poster,
body[data-page="movies"] .person-credit-link:hover .person-credit-poster{
  outline:2px solid #d5eafd!important;outline-offset:3px!important;
  box-shadow:0 8px 22px #0007!important
}
body[data-page="movies"] .person-credit-link:is(:focus,:focus-visible) strong,
body[data-page="movies"] .person-credit-link:is(:focus,:focus-visible) small{
  outline:0!important;box-shadow:none!important;text-decoration:none!important
}
</style><script defer src="/assets/ambient.js?v=1"></script>
</head>
<body data-page="movies"><div class="app-shell"><aside id="app-nav" class="sidebar" aria-label="Sidebar"></aside>
<div class="workspace"><main class="content person-content">
<p id="person-status" role="status">Loading cast profile…</p>
<section class="person-hero" id="person-hero" hidden>
<div class="person-photo-frame"><img id="person-photo" class="person-portrait" alt="" hidden><div id="person-photo-fallback" class="person-photo-fallback" aria-hidden="true"></div></div>
<div><p class="eyebrow">CAST PROFILE</p><h1 id="person-name"></h1>
<p id="person-bio"></p><div class="person-sources" id="person-sources"></div></div>
</section>
<section class="person-filmography" id="person-filmography" hidden><h2>Film and television credits</h2><ul class="person-credits" id="person-credits"></ul>
<p id="person-credit-attribution" class="muted"></p></section>
</main></div></div>
<script>
const params=new URLSearchParams(location.search);
const name=params.get('name')||'';
const status=document.getElementById('person-status');
const byId=id=>document.getElementById(id);
function sourceLink(label,url){
 if(typeof url!=='string'||!url.startsWith('https://'))return;
 const link=document.createElement('a');link.href=url;link.textContent=label;link.target='_blank';link.rel='noopener noreferrer';
 byId('person-sources').append(link);
}
async function load(){
 if(name.length<2||name.length>120){status.textContent='Choose a cast member from a movie or TV show.';return}
 const q=new URLSearchParams({name});
 for(const id of ['tmdb_id','tvmaze_id'])if(/^\d+$/.test(params.get(id)||''))q.set(id,params.get(id));
 try{
  const response=await fetch('/api/people/profile?'+q,{cache:'no-store'});
  if(!response.ok)throw Error('Unable to load this cast profile');
  const data=await response.json();
  byId('person-name').textContent=data.name;
  document.title=data.name+' · Yarr Media';
  byId('person-bio').textContent=data.biography||'A verified biography is not currently available for this cast member.';
  const photo=byId('person-photo');
  const fallback=byId('person-photo-fallback');
  fallback.textContent=data.name.split(/\s+/).slice(0,2).map(part=>part[0]||'').join('').toUpperCase();
  photo.onerror=()=>{photo.hidden=true;fallback.hidden=false};
  photo.onload=()=>{fallback.hidden=true;photo.hidden=false};
  if(data.photo?.startsWith('https://')){photo.src=data.photo;photo.hidden=false}
  else{photo.hidden=true;fallback.hidden=false}
  sourceLink('Wikipedia',data.wikipedia_url);
  sourceLink(data.credit_source||'Screen credits',data.source_url);
  if(data.biography_source && data.biography_source!=='Wikipedia' && data.biography_source!==data.credit_source)
    sourceLink('TMDB biography',data.source_url);
  byId('person-hero').hidden=false;
  const credits=Array.isArray(data.credits)?data.credits:[];
  byId('person-filmography').hidden=false;
  for(const credit of credits){
   const row=document.createElement('li');
   const kind=credit.type==='TV'?'tv':'movie';
   const query=new URLSearchParams({kind,title:credit.title});
   if(credit.year)query.set('year',credit.year);
   if(Number.isInteger(credit.tmdb_id)&&credit.tmdb_id>0)query.set('tmdb_id',String(credit.tmdb_id));
   if(Number.isInteger(credit.tvmaze_id)&&credit.tvmaze_id>0)query.set('tvmaze_id',String(credit.tvmaze_id));
   const link=document.createElement('a');link.className='person-credit-link';
   link.href='/credit?'+query;
   link.setAttribute('aria-label','View '+credit.title+' details');
   const poster=document.createElement('div');poster.className='person-credit-poster';
   if(credit.poster_url?.startsWith('/api/artwork/')){
     const img=document.createElement('img');img.src=credit.poster_url;img.alt='';
     img.loading='lazy';poster.append(img);
   }else{
     const initial=document.createElement('span');initial.className='person-credit-placeholder';
     initial.textContent=credit.title?.slice(0,1)||'W';poster.append(initial);
   }
   const title=document.createElement('strong');title.textContent=credit.title;
   const meta=document.createElement('small');
   meta.textContent=[credit.year,credit.type,credit.character].filter(Boolean).join(' · ');
   link.append(poster,title,meta);row.append(link);byId('person-credits').append(row);
  }
  if(!credits.length){
   const row=document.createElement('li');row.textContent='Film and television credits are unavailable from the connected metadata provider.';
   byId('person-credits').append(row);
  }
  byId('person-credit-attribution').textContent=data.credit_source?'Credits supplied by '+data.credit_source+'.':'';
  status.textContent='';
 }catch(error){status.textContent=error.message}
}
load();
</script></body></html>
