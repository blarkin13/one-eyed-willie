<style>
.library-toolbar{margin:26px 0 20px}
.count-label{color:#98a7ba;font-size:.88rem}
.load-more-wrap{text-align:center;margin:34px 0}
#more{min-width:178px}
.detail-top{display:flex;gap:22px;align-items:flex-start}.detail-art{width:128px;aspect-ratio:2/3;border-radius:12px;background:linear-gradient(160deg,#354b61,#18202d);display:flex;align-items:center;justify-content:center;font-size:3.5rem;color:#b1c2d6;flex:none}.detail-metadata{flex:1;min-width:0}.detail-metadata p{color:var(--muted);margin:7px 0}
@media(max-width:530px){.detail-art{width:90px;font-size:2.6rem}.detail-top{gap:13px}}
.alpha-nav{position:fixed;top:50%;right:9px;transform:translateY(-50%);z-index:12;
 display:flex;flex-direction:column;align-items:center;gap:0;background:#0a1421e8;
 backdrop-filter:blur(12px);padding:5px 3px;border-radius:14px}
.alpha-nav[hidden]{display:none}
.alpha-nav button{background:none;border:0;color:#c3d3e4;min-width:25px;min-height:20px;
 font-size:11px;font-weight:700;padding:0 2px}
.alpha-nav button:disabled{color:#4c6074;cursor:default}
.alpha-nav button:not(:disabled):hover,.alpha-nav button:not(:disabled):focus-visible{color:#fff;background:#2a435e;border-radius:5px}
.tile{scroll-margin-top:12px}
@media(max-height:650px){.alpha-nav button{min-height:15px;font-size:10px}}
@media(max-width:700px){.alpha-nav{right:2px;padding:4px 0}
.alpha-nav button{min-width:18px;min-height:19px;font-size:10px}
#items{padding-right:15px}}
.explore-icon-link{display:grid;place-items:center;width:44px;height:44px;border:1px solid #40536b;border-radius:11px;color:#cde4fa;background:#172536;flex:none;transition:background .15s,color .15s}.explore-icon-link:hover,.explore-icon-link:focus-visible{background:#29415b;color:#fff}.explore-icon-link svg{width:23px;height:23px}

body[data-page=movies] :is(a,button,input,select):focus-visible,body[data-page=tv] :is(a,button,input,select):focus-visible{
 outline:3px solid #d7edff!important;outline-offset:4px;box-shadow:0 0 0 7px #5898d24a!important
}
.tile-button:focus-visible .cover{outline:3px solid #d7edff;outline-offset:3px}

/* Keep the title and all catalog controls together in the FIRST row.
   The trivia is a separate second row; no flex-wrap or bottom-aligned toolbar
   should push Search/Sort/Filter below it on a TV or desktop. */
.library-head{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
 gap:10px;margin-bottom:14px;position:relative;isolation:isolate;min-height:0;
 flex-wrap:nowrap;overflow:visible;padding:14px 8px 10px}
.library-head-top{display:flex;align-items:center;justify-content:space-between;
 gap:20px;width:100%;min-width:0;position:relative;z-index:10}
.library-header-art-frame{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.library-header-art{position:absolute;pointer-events:none;
 left:var(--masthead-x,75%);top:var(--masthead-y,50%);width:min(77%,790px);
 max-width:none;height:auto;transform:translate(-50%,-50%) scale(var(--masthead-scale,1));
 opacity:var(--masthead-opacity,.6);user-select:none;object-fit:contain}
.library-heading{min-width:0;flex:0 1 auto}
.library-header-title{display:flex;align-items:center;gap:16px}
.library-header-title .library-header-icon{color:#beddf7;flex:none;display:inline-grid;place-items:center}
.library-header-title .library-header-icon svg{width:clamp(31px,3.2vw,43px);height:clamp(31px,3.2vw,43px)}
#page-title[class*="library-font--"]{font-family:var(--lib-font,system-ui,sans-serif)!important;
 font-weight:var(--lib-weight,700)!important;letter-spacing:var(--lib-spacing,normal)!important;
 text-transform:var(--lib-transform,none);line-height:1.15;overflow-wrap:anywhere}
.library-head-actions{display:flex;align-items:center;justify-content:flex-end;
 gap:10px;flex:0 0 auto;min-width:0;position:relative;z-index:11;white-space:nowrap}
.library-head-actions .search-box input{width:clamp(185px,19vw,270px)}

/* Compact icon tools: selected options live in small, remote-friendly popovers. */
#sort[hidden],#genre[hidden]{display:none!important}
.catalog-menu-anchor{position:relative;flex:none}
.catalog-tool-icon{display:grid;place-items:center;position:relative;width:44px;height:44px;
 border:1px solid #40536b;border-radius:11px;background:#172536;color:#cde4fa;
 padding:10px;cursor:pointer}
.catalog-tool-icon svg{width:22px;height:22px}
.catalog-tool-icon:hover,.catalog-tool-icon:focus-visible,
.catalog-tool-icon[aria-expanded=true]{background:#29415b;color:#fff;border-color:#7fa3c5}
.catalog-tool-icon.is-active{color:#b5deff;border-color:#6b96b9}
.catalog-tool-dot{display:none;position:absolute;width:6px;height:6px;border-radius:50%;
 right:6px;top:6px;background:#8dd5ff}
.catalog-tool-icon.is-active .catalog-tool-dot{display:block}
.catalog-tool-menu{position:absolute;z-index:45;right:0;top:calc(100% + 9px);
 width:min(258px,calc(100vw - 30px));max-height:min(350px,65vh);overflow-y:auto;
 padding:7px;background:#121e2d;border:1px solid #405875;border-radius:14px;
 box-shadow:0 18px 45px #000b;overscroll-behavior:contain}
.catalog-tool-menu[hidden]{display:none!important}
.catalog-tool-heading{padding:9px 11px 10px;color:#94acc5;font-size:.72rem;
 font-weight:750;text-transform:uppercase;letter-spacing:.09em}
.catalog-tool-option{display:flex;align-items:center;justify-content:space-between;gap:9px;
 width:100%;min-height:42px;border:0;border-radius:9px;padding:10px 11px;
 background:transparent;color:#d4e3f2;text-align:left;font:inherit;
 font-size:.86rem;cursor:pointer}
.catalog-tool-option:hover,.catalog-tool-option:focus-visible{background:#293d53;color:#fff}
.catalog-tool-option[aria-checked=true]{background:#28445f;color:#e8f6ff;font-weight:750}
.catalog-tool-option .option-check{color:#a7ddff;flex:none;min-width:16px;
 font-weight:750;text-align:center}
.catalog-genre-menu{max-height:min(390px,70vh)}
.catalog-tool-menu::-webkit-scrollbar{width:7px}
.catalog-tool-menu::-webkit-scrollbar-thumb{background:#3c5772;border-radius:8px}
/* Readable questions with only two lines of question/answer space reserved:
   rotating trivia does not push the poster grid up or down. */
.library-trivia{position:relative;z-index:0;width:100%;max-width:min(100%,1040px);
 display:flex;flex-direction:column;justify-content:flex-start;gap:5px;padding-top:2px}
.library-trivia .trivia-question{margin:0;max-width:100%;min-height:2.6em;
 font-size:clamp(1rem,1.07vw,1.25rem);line-height:1.36;letter-spacing:-.018em;
 font-weight:600;color:#e1eaf5;text-wrap:pretty;overflow-wrap:break-word;
 transition:opacity .35s ease,transform .35s ease}
.library-trivia .trivia-question.is-changing{opacity:0;transform:translateY(5px)}
.library-trivia .trivia-answer{display:flex;align-items:baseline;gap:10px;min-height:2.5em;
 opacity:0;visibility:hidden;transform:translateY(6px);
 transition:opacity .42s ease,transform .42s ease,visibility .42s}
.library-trivia .trivia-answer.revealed{opacity:1;visibility:visible;transform:none}
.trivia-answer-label{font-size:.7rem;line-height:1.5;font-weight:800;letter-spacing:.12em;
 text-transform:uppercase;color:#8ebfe9;flex:none}
.library-trivia .trivia-answer p{margin:0;line-height:1.4;
 font-size:clamp(.94rem,1vw,1.14rem);font-weight:650;color:#b4daf8;
 max-width:890px;overflow-wrap:anywhere;text-wrap:pretty}
.library-head + .section-heading{margin-bottom:12px}
#status:empty{display:none}
@media(min-width:1600px){
 .library-trivia{max-width:1120px}
 .library-trivia .trivia-question{font-size:clamp(1.07rem,1.15vw,1.4rem)}
 .library-trivia .trivia-answer p{font-size:clamp(.96rem,1.04vw,1.25rem)}
 .trivia-answer-label{font-size:.72rem}
}
/* Android TV WebView often reports a CSS viewport around 960px. */
@media(min-width:761px) and (max-width:1200px){
 .library-trivia .trivia-question{font-size:clamp(1.02rem,1.55vw,1.22rem)}
 .library-trivia .trivia-answer p{font-size:clamp(.94rem,1.32vw,1.1rem)}
}
@media(min-width:761px) and (hover:none){
 .library-trivia .trivia-question{font-size:clamp(1.02rem,1.55vw,1.22rem)}
 .library-trivia .trivia-answer p{font-size:clamp(.94rem,1.32vw,1.1rem)}
}
@media(max-width:760px){
 .library-head{padding:12px 7px 8px;gap:10px}
 .library-head-top{flex-wrap:wrap;align-items:flex-start;gap:10px}
 .library-heading{flex:1 1 100%}
 .library-header-art{width:min(95%,500px)}
 .library-header-title{gap:10px}
 .library-header-title .library-header-icon svg{width:27px;height:27px}
 /* Mobile can wrap the tools, but they still precede the trivia. */
 .library-head-actions{width:100%;justify-content:flex-start;gap:8px}
 .library-head-actions .search-box{flex:1 1 140px}
 .library-head-actions .search-box input{width:100%}
 .library-trivia .trivia-question{font-size:clamp(1.1rem,3.7vw,1.5rem);line-height:1.4}
 .library-trivia .trivia-answer p{font-size:clamp(1rem,3.3vw,1.32rem)}
 .trivia-answer-label{font-size:.64rem}
}
@media(max-width:520px){
 .library-head-actions{flex-wrap:wrap}
 .library-head-actions .search-box{flex:1 1 100%;width:100%}
 .catalog-tool-menu{max-height:55vh}
}
@media(prefers-reduced-motion:reduce){
 .library-trivia :is(.trivia-question,.trivia-answer){transition:none;transform:none}
}

.catalog-refresh-metadata{display:grid;place-items:center;flex:none;width:44px;height:44px;padding:10px;color:#cde4fa;background:#172536;border:1px solid #40536b;border-radius:11px;cursor:pointer}
.catalog-refresh-metadata:hover,.catalog-refresh-metadata:focus-visible{color:#fff;background:#29415b}
.catalog-refresh-metadata:disabled{opacity:.45;cursor:default}
.catalog-refresh-metadata svg{width:21px;height:21px}
.catalog-metadata-status{color:#aebfd1;font-size:.8rem;line-height:1.5;margin:-4px 0 12px}
.catalog-metadata-status:empty{display:none}
@media(max-width:520px){.library-head-actions .catalog-refresh-metadata{width:44px;height:44px}}
</style></head>
<body data-page="movies">
<div class="app-shell">
  <aside id="app-nav" class="sidebar" aria-label="Sidebar"></aside>
  <div class="workspace">
    <main class="content">
      <div class="page-head library-head" id="library-masthead">
        <div class="library-header-art-frame" aria-hidden="true"><img id="library-header-art" class="library-header-art" alt="" src="/assets/library-header-movies.png"></div>
        <div class="library-head-top">
          <div class="library-heading">
            <p class="eyebrow" id="eyebrow">Your library</p>
            <div class="library-header-title"><span class="library-header-icon" id="library-title-icon" aria-hidden="true"></span><h1 id="page-title">Movies</h1></div>
          </div>
        <div class="library-head-actions" role="group" aria-label="Browse library controls">

          <select id="sort" hidden aria-label="Sort titles"><option value="title">Title A–Z</option><option value="added">Date Added (newest)</option><option value="length">Length (longest)</option><option value="rating">Rating (highest)</option></select>

            </button>

              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.5 7.5v5L10.5 20v-7.5z"/></svg>

           <a id="explore-library" class="explore-icon-link" href="/explore?type=movies" title="Explore More" aria-label="Explore more movies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg></a>
        </div>

          <p class="trivia-question" id="trivia-question" aria-live="off"></p>

      <p id="status" class="status-line" role="status">Loading titles…</p>

<script>
const type=location.pathname==='/tv'?'tv':'movies';
document.body.dataset.page=type;
const $=id=>document.getElementById(id);
const query=new URLSearchParams(location.search);
let total=0,requestId=0,loading=false;
const initialSearch=query.get('search')||'';
$('search').value=initialSearch.slice(0,150);
const requestedSort=query.get('sort')||'title';
if([...$('sort').options].some(o=>o.value===requestedSort))$('sort').value=requestedSort;
let selectedGenre=(query.get('genre')||'').slice(0,60);
let knownGenres=[];
if(query.get('focus')==='search')requestAnimationFrame(()=>$('search').focus());
$('explore-library').href='/explore?type='+type;
$('explore-library').setAttribute('aria-label','Explore more '+(type==='movies'?'movies':'TV shows'));
$('page-title').textContent=type==='movies'?'Movies':'TV Shows';
// Trivia starts with the question; the answer is revealed after a pause.
$('section-title').textContent=type==='movies'?'All Movies':'All TV Shows';
document.title='One-Eyed Willie · '+(type==='movies'?'Movies':'TV Shows');
const selectedLibraryId=Number(query.get('library_id'));
const libraryAppearance=window.WillieLibraryAppearance;
function applyLibraryAppearance(lib){
 const iconKey=lib?.icon|| (type==='tv'?'tv':'film');
 const fontKey=lib?.font||'default';
 const icon=$('library-title-icon');
 if(lib?.icon_image_url||['film','tv','folder'].includes(iconKey)){
  const image=document.createElement('img');
  image.src=lib?.icon_image_url||'/assets/sidebar-icon-'+(type==='tv'?'tv':'movies')+'.png?v=1';
  image.alt='';image.width=40;image.height=40;image.className='sidebar-icon-preview-image';
  icon.replaceChildren(image);
 }else if(libraryAppearance)icon.replaceChildren(libraryAppearance.createIcon(iconKey,40));
 const title=$('page-title');
 title.className='library-font--'+(libraryAppearance?.fonts[fontKey]?fontKey:'default');
 const masthead=$('library-masthead'),art=$('library-header-art');
 masthead.style.setProperty('--masthead-x',(lib?.header_x??75)+'%');
 masthead.style.setProperty('--masthead-y',(lib?.header_y??50)+'%');
 masthead.style.setProperty('--masthead-scale',(lib?.header_scale??100)/100);
 masthead.style.setProperty('--masthead-opacity',(lib?.header_opacity??60)/100);
 art.src=lib?.header_image_url||'/assets/library-header-'+type+'.png';
}
applyLibraryAppearance(null);
fetch('/api/libraries',{cache:'no-store'})
 .then(response=>response.ok?response.json():[])
 .then(libraries=>{
   const items=Array.isArray(libraries)?libraries.filter(lib=>lib.kind===type):[];
   const standard=type==='movies'?'movies':'tvshows';
   const library=Number.isInteger(selectedLibraryId)&&selectedLibraryId>0
     ?items.find(lib=>lib.id===selectedLibraryId)
     :items.find(lib=>String(lib.name||'').toLowerCase().replace(/[^a-z0-9]/g,'')===standard)
       ||items[0];
   if(selectedLibraryId>0&&!library){
     $('status').textContent='Library not found. Choose another library in the sidebar.';
     return;
   }
   applyLibraryAppearance(library);
   if(selectedLibraryId>0&&library){
     const name=String(library.name||'Library');
     $('page-title').textContent=name;
     $('section-title').textContent='All '+name;
     document.title='One-Eyed Willie · '+name;
   }
 }).catch(()=>{});


/* Library trivia is a hands-free question → answer → next-question carousel.
   Saved API questions are preferred; original local questions work without a
   connection. Timers pause while the app is in the background. */
const TRIVIA_QUESTION_MS=6200;
const TRIVIA_ANSWER_MS=5200;
const fallbackTrivia={
 movies:[
  {question:'At what frame rate are most cinema films projected?',answer:'24 frames per second.'},
  {question:'Which brothers held a public film screening in Paris in 1895?',answer:'The Lumière brothers.'},
  {question:'In what year did the first Academy Awards ceremony take place?',answer:'1929.'},
  {question:'What was the first feature-length animated film released by Disney?',answer:'Snow White and the Seven Dwarfs (1937).'},
  {question:'What is the Wilhelm scream?',answer:'A stock sound effect heard in many films.'},
  {question:'What does a storyboard help filmmakers plan?',answer:'The shots and visual sequence of a film.'},
  {question:'Who recreates footsteps and everyday sounds for a film soundtrack?',answer:'Foley artists.'},
  {question:'What tool helps synchronize recorded sound with a filmed image?',answer:'A clapperboard.'},
  {question:'What is another title for a cinematographer?',answer:'Director of photography.'},
  {question:'What animation technique moves physical objects between photographed frames?',answer:'Stop-motion animation.'},
  {question:'What is a dissolve in filmmaking?',answer:'A gradual blend from one shot to another.'},
  {question:'What often accompanied silent movies at early film screenings?',answer:'Live music.'}
 ],
 tv:[
  {question:'In what year was the first US presidential debate televised?',answer:'1960.'},
  {question:'What is the first episode used to introduce or test a proposed TV series called?',answer:'A pilot.'},
  {question:'What do you call an episode filmed mostly on existing sets with a limited cast?',answer:'A bottle episode.'},
  {question:'What is a scene that plays before the opening credits called?',answer:'A cold open.'},
  {question:'Who generally oversees the creative direction and production of a TV series?',answer:'The showrunner.'},
  {question:'What do you call a TV story told across a limited, predetermined number of episodes?',answer:'A miniseries.'},
  {question:'What does “sitcom” stand for?',answer:'Situation comedy.'},
  {question:'What is a cliffhanger?',answer:'An ending that leaves a story unresolved at a dramatic moment.'},
  {question:'What accessibility feature describes dialogue and important sounds on television?',answer:'Closed captions.'},
  {question:'What is the last episode in a TV season called?',answer:'A season finale.'},
  {question:'What kind of TV series features different stories or characters each episode or season?',answer:'An anthology series.'},
  {question:'What is a laugh track?',answer:'Prerecorded audience laughter used in a TV program.'}
 ]
};
function triviaStorage(key,fallback){
 try{return JSON.parse(localStorage.getItem(key))??fallback}catch(_){return fallback}
}
function storeTrivia(key,value){
 try{localStorage.setItem(key,JSON.stringify(value))}catch(_){}
}
function nextOfflineTrivia(){
 const key='oew-trivia-fallback-'+type;
 const old=Number(triviaStorage(key,-1));
 const index=(old+1)%fallbackTrivia[type].length;
 storeTrivia(key,index);
 return fallbackTrivia[type][index];
}
function nextTriviaFromQueue(){
 const key='oew-trivia-batch-'+type;
 const queue=triviaStorage(key,[]);
 if(!Array.isArray(queue)||!queue.length)return null;
 while(queue.length){
  const item=queue.shift();
  if(item&&typeof item.question==='string'&&item.question.trim()&&
    typeof item.answer==='string'&&item.answer.trim()){
   storeTrivia(key,queue);
   return item;
  }
 }
 storeTrivia(key,[]);
 return null;
}
let triviaTimer=null,triviaPhase='question',triviaCurrent=null;
let triviaFetching=false,triviaLastFetch=0;
const triviaQuestion=$('trivia-question'),triviaAnswer=$('trivia-answer');
const triviaAnswerText=$('trivia-answer-text');
function scheduleTrivia(callback,delay){
 clearTimeout(triviaTimer);
 if(!document.hidden)triviaTimer=setTimeout(callback,delay);
}
function revealTriviaAnswer(){
 if(document.hidden)return;
 triviaPhase='answer';
 // Only expose the answer (including to screen readers) after the question.
 triviaAnswer.setAttribute('aria-hidden','false');
 triviaAnswerText.textContent=triviaCurrent?.answer||'';
 triviaAnswer.classList.add('revealed');
 scheduleTrivia(showNextTrivia,TRIVIA_ANSWER_MS);
}
function showNextTrivia(){
 triviaPhase='question';
 triviaCurrent=nextTriviaFromQueue()||nextOfflineTrivia();
 triviaAnswer.classList.remove('revealed');
 triviaAnswer.setAttribute('aria-hidden','true');
 triviaAnswerText.textContent='';
 triviaQuestion.classList.add('is-changing');
 // The question crossfades; no layout changes to the controls or poster grid.
 setTimeout(()=>{
  if(document.hidden)return;
  triviaQuestion.textContent=triviaCurrent.question;
  triviaQuestion.classList.remove('is-changing');
 },180);
 scheduleTrivia(revealTriviaAnswer,TRIVIA_QUESTION_MS);

function loadMissingMoviePosters(){

async function fetchMoviePosters(){

 let next=0;

  while(next<batches.length){
   const part=batches[next++];
   try{
    const response=await fetch('/api/movies/posters',{
     method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({items:part.map(j=>({
      library_id:j.item.library_id,key:j.item.key
     }))})
    });
    if(!response.ok)throw Error('Poster batch unavailable');
    const data=await response.json();
    const map=new Map((data.items||[]).map(e=>[e.library_id+'|'+e.key,e.poster_url]));
    for(const job of part){
     if(!job.cover.isConnected)continue;
     const poster=map.get(job.item.library_id+'|'+job.item.key);
     if(poster?.startsWith('/api/artwork/'))addMoviePoster(job.cover,job.item,poster);
     else requestMissingMoviePoster(job.cover,job.item);

  if(!response.ok)throw Error('Server returned '+response.status);
  const data=await response.json();if(thisRequest!==requestId)return;
  total=data.total;const entries=Array.isArray(data.items)?data.items:[];

  // or change the scroll position while the viewer browses poster rows.

  const focusId=previouslyFocused?[
    previouslyFocused.dataset.hoverKind,

      [link.dataset.hoverKind,link.dataset.hoverLibraryId,link.dataset.hoverKey].join('|')===focusId);

/* Spatial arrow navigation for keyboard, television D-pad and remote controls.
   Moving vertically between library poster rows scrolls smoothly without
   hijacking horizontal poster navigation or changing the chosen column. */
function scrollCatalogRowTo(card){
 const root=document.scrollingElement||document.documentElement;
 const bounds=card.getBoundingClientRect();
 const upper=Math.max(36,innerHeight*.13);
 const lower=innerHeight-Math.max(44,innerHeight*.1);
 if(bounds.top>=upper&&bounds.bottom<=lower)return;
 const max=Math.max(0,root.scrollHeight-root.clientHeight);
 const top=Math.max(0,Math.min(max,root.scrollTop+bounds.top-upper));
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 window.scrollTo({top,behavior:reduced?'instant':'smooth'});
}
function remoteCatalogMove(key){
 const selectors='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled])';
 const targets=[...document.querySelector('.workspace').querySelectorAll(selectors)].filter(el=>{
   if(el.closest('[hidden]'))return false;
   const r=el.getBoundingClientRect();return r.width>0&&r.height>0;
 });
 if(!targets.length)return false;
 const active=document.activeElement;
 if(!targets.includes(active)){(document.getElementById('explore-library')||targets[0]).focus();return true;}
 const r=active.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 const [dx,dy]={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[key];
 let closest=null,score=Infinity;
 for(const candidate of targets){
   if(candidate===active)continue;
   const rect=candidate.getBoundingClientRect(),cx=rect.left+rect.width/2-x,cy=rect.top+rect.height/2-y;
   const forward=cx*dx+cy*dy,side=Math.abs(cx*dy-cy*dx);
   if(forward<=3)continue;
   const value=forward+side*2.75;
   if(value<score){score=value;closest=candidate;}
 }
 if(!closest)return false;
 const betweenPosterRows=['ArrowUp','ArrowDown'].includes(key)&&
   active.matches?.('#items .tile-button')&&closest.matches?.('#items .tile-button');
 closest.focus({preventScroll:true});
 if(betweenPosterRows)scrollCatalogRowTo(closest);
 else if(!['ArrowLeft','ArrowRight'].includes(key)||
          !active.matches?.('#items .tile-button')||
          !closest.matches?.('#items .tile-button'))
   closest.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
 return true;
}
document.addEventListener('keydown',event=>{
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)||event.altKey||event.ctrlKey||event.metaKey)return;
 const focused=document.activeElement;
 if(focused?.matches('input,textarea,[contenteditable="true"]'))return;
 if(focused?.matches('select')){
   if(event.key==='ArrowLeft'||event.key==='ArrowRight')return;
   event.preventDefault();remoteCatalogMove(event.key);return;
 }
 if(remoteCatalogMove(event.key))event.preventDefault();
});

/* Metadata indexing runs separately from poster artwork. */
let metadataRevision=-1, metadataReloadAt=0, metadataTimer=null, lastMetadataFinished=0;
async function checkMetadata(){
 try{
  const response=await fetch('/api/catalog/metadata/status',{cache:'no-store'});
  if(!response.ok)throw Error('Metadata status unavailable');
  const state=await response.json();
  const revision=Number(state.revision)||0,processed=Number(state.processed)||0,
        totalTitles=Number(state.total)||0,
        available=Number(state.available)||0,missing=Number(state.missing)||0;
  $('refresh-metadata').disabled=!!state.running;
  if(state.running){
   $('metadata-status').textContent='Checking genres, ratings and runtimes · '+processed+' of '+totalTitles+' titles';
  }else if(state.error){
   $('metadata-status').textContent=state.error;
  }else if(!state.last_finished){
   $('metadata-status').textContent='Preparing library metadata…';
  }else if(totalTitles===0){
   $('metadata-status').textContent='';
  }else if(available===0){
   $('metadata-status').textContent='No genre, rating or runtime metadata found for '+totalTitles+
     ' titles. Check Settings → Connections (Radarr/Sonarr) and Settings → Metadata (TMDB).';
  }else if(missing>0 && missing/totalTitles>=0.05){
   // Suppress low-noise coverage warnings (for example, 4 of 427 titles).
   // Retries still run in the background regardless of the warning display.
   $('metadata-status').textContent='Metadata available for '+available+' of '+totalTitles+
     ' titles; '+missing+' still missing. Unmatched titles are retried automatically.';
  }else{
   $('metadata-status').textContent='';
  }
  const finished=Number(state.last_finished)||0;
  const newMetadata=metadataRevision>=0&&revision!==metadataRevision;
  const newlyFinished=finished>0&&finished!==lastMetadataFinished;
  metadataRevision=revision;
  lastMetadataFinished=finished;
  if((newlyFinished||newMetadata) && !loading &&
     (newlyFinished || processed-metadataReloadAt>=25 || !state.running)){
    metadataReloadAt=processed;
    load({preserveFocus:true});
  }
 }catch(error){
  $('metadata-status').textContent='Metadata status unavailable: '+error.message;
 }finally{
  clearTimeout(metadataTimer);
  metadataTimer=setTimeout(checkMetadata,4000);
 }
}

  if(!response.ok)throw Error('Unable to start metadata refresh.');
  await checkMetadata();

   actual media change; preserve focused TV poster and the current scroll. */
const CATALOG_POLL_MS=15000;
let catalogPollTimer=null,catalogPollRunning=false;
async function checkLiveCatalog(){
 if(catalogPollRunning)return;
 catalogPollRunning=true;
 try{
  if(document.hidden||loading)return;
  const response=await fetch('/api/catalog/revision',{cache:'no-store'});
  if(!response.ok)return;
  const data=await response.json();
  if(Number.isSafeInteger(data.revision)&&catalogRevision!==null&&
     data.revision!==catalogRevision&&!loading&&!document.hidden){
   await load({preserveFocus:true},true);
  }
 }catch(_){/* Keep current posters if the server temporarily disconnects. */}
 finally{
  catalogPollRunning=false;
  clearTimeout(catalogPollTimer);
  catalogPollTimer=setTimeout(checkLiveCatalog,CATALOG_POLL_MS);
 }
}
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden&&!catalogPollRunning){
  clearTimeout(catalogPollTimer);
  checkLiveCatalog();
 }
});
window.addEventListener('pagehide',()=>clearTimeout(catalogPollTimer));
load();
checkMetadata();
catalogPollTimer=setTimeout(checkLiveCatalog,CATALOG_POLL_MS);
</script>
</body></html>
