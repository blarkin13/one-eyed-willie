<!doctype html>
<html lang="en"><head>
<link rel="icon" type="image/png" href="/assets/favicon.png?v=4">
<link rel="shortcut icon" href="/favicon.ico?v=4">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-Eyed Willie · Browse</title>
<link rel="stylesheet" href="/assets/ui.css">
<script defer src="/assets/shell.js"></script>
<style>
.library-toolbar{margin:26px 0 20px}
.count-label{color:#98a7ba;font-size:.88rem}
.load-more-wrap{text-align:center;margin:34px 0}
#more{min-width:178px}
.detail-top{display:flex;gap:22px;align-items:flex-start}.detail-art{width:128px;aspect-ratio:2/3;border-radius:12px;background:linear-gradient(160deg,#354b61,#18202d);display:flex;align-items:center;justify-content:center;font-size:3.5rem;color:#b1c2d6;flex:none}.detail-metadata{flex:1;min-width:0}.detail-metadata p{color:var(--muted);margin:7px 0}
@media(max-width:530px){.detail-art{width:90px;font-size:2.6rem}.detail-top{gap:13px}}
.alpha-nav{position:fixed;top:50%;right:9px;transform:translateY(-50%);z-index:12;
 display:flex;flex-direction:column;align-items:center;gap:0;background:#0a1421e8;
 backdrop-filter:blur(12px);padding:5px 3px;border-radius:14px}
.alpha-nav[hidden]{display:none}
.alpha-nav button{background:none;border:0;color:#c3d3e4;min-width:25px;min-height:20px;
 font-size:11px;font-weight:700;padding:0 2px}
.alpha-nav button:disabled{color:#4c6074;cursor:default}
.alpha-nav button:not(:disabled):hover,.alpha-nav button:not(:disabled):focus-visible{color:#fff;background:#2a435e;border-radius:5px}
.tile{scroll-margin-top:12px}
@media(max-height:650px){.alpha-nav button{min-height:15px;font-size:10px}}
@media(max-width:700px){.alpha-nav{right:2px;padding:4px 0}
.alpha-nav button{min-width:18px;min-height:19px;font-size:10px}
#items{padding-right:15px}}
.explore-icon-link{display:grid;place-items:center;width:44px;height:44px;border:1px solid #40536b;border-radius:11px;color:#cde4fa;background:#172536;flex:none;transition:background .15s,color .15s}.explore-icon-link:hover,.explore-icon-link:focus-visible{background:#29415b;color:#fff}.explore-icon-link svg{width:23px;height:23px}

body[data-page=movies] :is(a,button,input,select):focus-visible,body[data-page=tv] :is(a,button,input,select):focus-visible{
 outline:3px solid #d7edff!important;outline-offset:4px;box-shadow:0 0 0 7px #5898d24a!important
}
.tile-button:focus-visible .cover{outline:3px solid #d7edff;outline-offset:3px}
</style></head>
<body data-page="movies">
<div class="app-shell">
  <aside id="app-nav" class="sidebar" aria-label="Sidebar"></aside>
  <div class="workspace">
    <main class="content">
      <div class="page-head"><div>
        <p class="eyebrow" id="eyebrow">Your library</p>
        <h1 id="page-title">Movies</h1>
        <p id="page-description">Browse all the movies on your media server.</p>
      </div><a id="explore-library" class="explore-icon-link" href="/explore?type=movies" title="Explore More" aria-label="Explore more movies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg></a></div>
      <div class="toolbar library-toolbar">
        <div class="tools">
          <label class="search-box"><span class="sr-only">Search titles</span><input type="search" id="search" placeholder="Search titles…" maxlength="150" aria-label="Search titles"></label>
          <label><span class="sr-only">Sort titles</span><select id="sort" class="sort-select" aria-label="Sort titles">
            <option value="title">Title A–Z</option><option value="recent">Recently added</option><option value="year">Release year</option>
          </select></label>
        </div>
      </div>
      <div class="section-heading"><h2 id="section-title">All Movies</h2><span id="results-count" class="count-label"></span></div>
      <p id="status" class="status-line" role="status">Loading titles…</p>
      <div id="items" aria-live="off"></div>
      <nav id="alpha-nav" class="alpha-nav" aria-label="Jump to letter" hidden></nav>
      
    </main>
  </div>
</div>

<script>
const type=location.pathname==='/tv'?'tv':'movies';
document.body.dataset.page=type;
const $=id=>document.getElementById(id);
const query=new URLSearchParams(location.search);
let total=0,requestId=0,loading=false;
const initialSearch=query.get('search')||'';
$('search').value=initialSearch.slice(0,150);
if(query.get('focus')==='search')requestAnimationFrame(()=>$('search').focus());
$('explore-library').href='/explore?type='+type;
$('explore-library').setAttribute('aria-label','Explore more '+(type==='movies'?'movies':'TV shows'));
$('page-title').textContent=type==='movies'?'Movies':'TV Shows';
$('page-description').textContent=type==='movies'?'Browse every movie in your collection.':'Browse all of your series and episodes.';
$('section-title').textContent=type==='movies'?'All Movies':'All TV Shows';
document.title='One-Eyed Willie · '+(type==='movies'?'Movies':'TV Shows');

// Movie posters are looked up in one request per page; actual image bytes are
// downloaded once and cached privately on the NUC.
const moviePosterJobs=[];
async function fetchMoviePosters(){
 const jobs=moviePosterJobs.splice(0);
 if(!jobs.length)return;
 // Server caps one poster request at 60. Fetch in bounded batches, while
 // images themselves use native lazy loading and the NUC artwork cache.
 const batches=[];
 for(let i=0;i<jobs.length;i+=50)batches.push(jobs.slice(i,i+50));
 let next=0;
 async function worker(){
   while(next<batches.length){
     const part=batches[next++];
     try{
       const response=await fetch('/api/movies/posters',{
         method:'POST',headers:{'Content-Type':'application/json'},
         body:JSON.stringify({items:part.map(j=>({library_id:j.item.library_id,key:j.item.key}))})});
       if(!response.ok)continue;
       const data=await response.json();
       const map=new Map((data.items||[]).map(e=>[e.library_id+'|'+e.key,e.poster_url]));
       for(const job of part){
         const poster=map.get(job.item.library_id+'|'+job.item.key);
         if(!poster?.startsWith('/api/artwork/')||!job.cover.isConnected)continue;
         const img=document.createElement('img');img.className='poster-image';
         img.alt=job.item.title+' poster';img.loading='lazy';img.decoding='async';
         img.src=poster;job.cover.append(img);
       }
     }catch(_){}
   }
 }
 await Promise.all([worker(),worker(),worker()]);
}
// Artwork requests are intentionally lazy and capped to avoid rate limiting.
const posterQueue=[];
let posterActive=0;
const observer='IntersectionObserver' in window?new IntersectionObserver(entries=>{
 for(const entry of entries){
  if(!entry.isIntersecting)continue;
  observer.unobserve(entry.target);
  entry.target._loadPoster?.();
 }
},{rootMargin:'260px'}):null;
function observePoster(card,cover,item){
 card._loadPoster=()=>{
  posterQueue.push({card,cover,item});
  runPosterQueue();
 };
 if(observer)observer.observe(card);
 else card._loadPoster();
}
function runPosterQueue(){
 while(posterActive<3&&posterQueue.length){
  const job=posterQueue.shift();posterActive++;
  const {card,cover,item}=job;
  const q=new URLSearchParams({library_id:String(item.library_id),key:item.key});
  fetch('/api/tv/poster?'+q,{cache:'no-store'}).then(response=>{
   if(!response.ok)throw Error('Poster request failed');
   return response.json();
  }).then(data=>{
   if(!data.poster_url||!(data.poster_url.startsWith('/api/artwork/')))return;
   if(!card.isConnected)return;
   const img=document.createElement('img');img.className='poster-image';img.alt=item.title+' poster';
   img.src=data.poster_url;img.loading='lazy';img.referrerPolicy='no-referrer';
   cover.appendChild(img);
  }).catch(()=>{}).finally(()=>{posterActive--;runPosterQueue()});
 }
}
function createCard(item){
 const article=document.createElement('article');article.className='tile';
 const button=document.createElement('a');
 button.href=type==='movies'
   ?'/movie?'+new URLSearchParams({library_id:String(item.library_id),key:item.key})
   :'/tv/show?'+new URLSearchParams({library_id:String(item.library_id),key:item.key});
 button.className='tile-button';button.setAttribute('aria-label','View details for '+item.title);
 let hash=0;for(const ch of item.title)hash=(hash*31+ch.charCodeAt(0))>>>0;
 const cover=document.createElement('div');cover.className='cover cover--'+(hash%6);
 const top=document.createElement('div');top.className='cover-top';
 const kind=document.createElement('span');kind.className='media-type';kind.textContent=type==='movies'?'MOVIE':'SERIES';top.append(kind);
 const initial=document.createElement('div');initial.className='cover-initial';initial.setAttribute('aria-hidden','true');initial.textContent=item.title.slice(0,1).toUpperCase()||'W';
 const coverTitle=document.createElement('div');coverTitle.className='cover-title';coverTitle.textContent=item.title;
 cover.append(top,initial,coverTitle);
 const title=document.createElement('h3');title.textContent=item.title;title.title=item.title;
 const meta=document.createElement('div');meta.className='tile-meta';
 meta.textContent=(item.year?item.year+' · ':'')+(item.kind==='tv'?item.seasons.length+' season'+(item.seasons.length===1?'':'s'):item.files+' file'+(item.files===1?'':'s'));
 button.append(cover,title,meta);
 if(item.watched){
   const flag=document.createElement('span');flag.className='watched-badge';flag.textContent='✓ Watched';
   flag.setAttribute('aria-label','Watched');article.append(flag);
 }
 article.append(button);
 if(type==='tv')observePoster(article,cover,item);
 else moviePosterJobs.push({cover,item});
 return article;
}
function drawAlphabet(items){
 const nav=$('alpha-nav');nav.replaceChildren();
 const show=$('sort').value==='title'&&!$('search').value.trim()&&items.length>15;
 nav.hidden=!show;
 if(!show)return;
 const markers=new Map();
 for(const item of items){
   const initial=(item.title.trim()[0]||'#').toUpperCase();
   const letter=/^[A-Z]$/.test(initial)?initial:'#';
   if(!markers.has(letter)){
     const card=document.querySelector('[data-letter="'+letter+'"]');
     if(card)markers.set(letter,card);
   }
 }
 for(const letter of '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'){
   const item=markers.get(letter);
   const a=document.createElement('button');a.type='button';a.textContent=letter;
   a.title=item?'Jump to '+letter:'No titles beginning with '+letter;
   a.setAttribute('aria-label',a.title);a.disabled=!item;
   if(item)a.onclick=()=>item.scrollIntoView({behavior:'smooth',block:'start'});
   nav.append(a);
 }
}
async function load(){
 const thisRequest=++requestId;
 loading=true;$('status').textContent='Loading titles…';
 const params=new URLSearchParams({kind:type,search:$('search').value.trim(),sort:$('sort').value});
 try{
  const response=await fetch('/api/catalog/all?'+params,{cache:'no-store'});
  if(!response.ok)throw Error('Server returned '+response.status);
  const data=await response.json();if(thisRequest!==requestId)return;
  total=data.total;const entries=Array.isArray(data.items)?data.items:[];
  $('items').replaceChildren();
  moviePosterJobs.length=0;posterQueue.length=0;
  const fragment=document.createDocumentFragment();
  for(const item of entries){
    const card=createCard(item);
    const initial=(item.title.trim()[0]||'#').toUpperCase();
    const letter=/^[A-Z]$/.test(initial)?initial:'#';
    card.dataset.letter=letter;
    fragment.append(card);
  }
  $('items').append(fragment);
  drawAlphabet(entries);
  if(type==='movies')fetchMoviePosters();
  $('results-count').textContent=total.toLocaleString()+' titles';
  $('status').textContent='';
  if(!total){
    const empty=document.createElement('div');empty.className='empty';
    const heading=document.createElement('h3');heading.textContent='No titles found';
    empty.append(heading);$('items').append(empty);
  }
 }catch(error){if(thisRequest===requestId)$('status').textContent='Unable to load titles: '+error.message}
 finally{if(thisRequest===requestId)loading=false}
}
/* Spatial arrow navigation for keyboard, television D-pad and remote controls. */
function remoteCatalogMove(key){
 const selectors='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled])';
 const targets=[...document.querySelector('.workspace').querySelectorAll(selectors)].filter(el=>{
   if(el.closest('[hidden]'))return false;
   const r=el.getBoundingClientRect();return r.width>0&&r.height>0;
 });
 if(!targets.length)return false;
 const active=document.activeElement;
 if(!targets.includes(active)){(document.getElementById('explore-library')||targets[0]).focus();return true;}
 const r=active.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 const [dx,dy]={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[key];
 let closest=null,score=Infinity;
 for(const candidate of targets){
   if(candidate===active)continue;
   const rect=candidate.getBoundingClientRect(),cx=rect.left+rect.width/2-x,cy=rect.top+rect.height/2-y;
   const forward=cx*dx+cy*dy,side=Math.abs(cx*dy-cy*dx);
   if(forward<=3)continue;
   const value=forward+side*2.75;
   if(value<score){score=value;closest=candidate;}
 }
 if(!closest)return false;
 closest.focus({preventScroll:true});closest.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
 return true;
}
document.addEventListener('keydown',event=>{
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)||event.altKey||event.ctrlKey||event.metaKey)return;
 const focused=document.activeElement;
 if(focused?.matches('input,textarea,[contenteditable="true"]'))return;
 if(focused?.matches('select')){
   if(event.key==='ArrowLeft'||event.key==='ArrowRight')return;
   event.preventDefault();remoteCatalogMove(event.key);return;
 }
 if(remoteCatalogMove(event.key))event.preventDefault();
});

let debounce;
$('search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>load(),220)});
$('sort').addEventListener('change',()=>load(true));
load();
</script>
</body></html>
