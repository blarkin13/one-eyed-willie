<script>
const type=location.pathname==='/tv'?'tv':'movies';
document.body.dataset.page=type;
const $=id=>document.getElementById(id);
const query=new URLSearchParams(location.search);
let total=0,requestId=0,loading=false;
const initialSearch=query.get('search')||'';
$('search').value=initialSearch.slice(0,150);
const requestedSort=query.get('sort')||'title';
if([...$('sort').options].some(o=>o.value===requestedSort))$('sort').value=requestedSort;
let selectedGenre=(query.get('genre')||'').slice(0,60);
let knownGenres=[];
if(query.get('focus')==='search')requestAnimationFrame(()=>$('search').focus());
$('explore-library').href='/explore?type='+type;
$('explore-library').setAttribute('aria-label','Explore more '+(type==='movies'?'movies':'TV shows'));
$('page-title').textContent=type==='movies'?'Movies':'TV Shows';
// The description is replaced by rotating film/TV trivia below.
$('section-title').textContent=type==='movies'?'All Movies':'All TV Shows';
document.title='One-Eyed Willie · '+(type==='movies'?'Movies':'TV Shows');
const selectedLibraryId=Number(query.get('library_id'));
const libraryAppearance=window.WillieLibraryAppearance;
function applyLibraryAppearance(lib){
 const iconKey=lib?.icon|| (type==='tv'?'tv':'film');
 const fontKey=lib?.font||'default';
 const icon=$('library-title-icon');
 if(libraryAppearance)icon.replaceChildren(libraryAppearance.createIcon(iconKey,40));
 const title=$('page-title');
 title.className='library-font--'+(libraryAppearance?.fonts[fontKey]?fontKey:'default');
 const masthead=$('library-masthead'),art=$('library-header-art');
 masthead.style.setProperty('--masthead-x',(lib?.header_x??75)+'%');
 masthead.style.setProperty('--masthead-y',(lib?.header_y??50)+'%');
 masthead.style.setProperty('--masthead-scale',(lib?.header_scale??100)/100);
 masthead.style.setProperty('--masthead-opacity',(lib?.header_opacity??60)/100);
 art.src=lib?.header_image_url||'/assets/library-header-'+type+'.png';
}
applyLibraryAppearance(null);
fetch('/api/libraries',{cache:'no-store'})
 .then(response=>response.ok?response.json():[])
 .then(libraries=>{
   const items=Array.isArray(libraries)?libraries.filter(lib=>lib.kind===type):[];
   const standard=type==='movies'?'movies':'tvshows';
   const library=Number.isInteger(selectedLibraryId)&&selectedLibraryId>0
     ?items.find(lib=>lib.id===selectedLibraryId)
     :items.find(lib=>String(lib.name||'').toLowerCase().replace(/[^a-z0-9]/g,'')===standard)
       ||items[0];
   if(selectedLibraryId>0&&!library){
     $('status').textContent='Library not found. Choose another library in the sidebar.';
     return;
   }
   applyLibraryAppearance(library);
   if(selectedLibraryId>0&&library){
     const name=String(library.name||'Library');
     $('page-title').textContent=name;
     $('section-title').textContent='All '+name;
     document.title='One-Eyed Willie · '+name;
   }
 }).catch(()=>{});


/* Open Trivia DB film (11) and television (14): one batch per category,
   with per-browser queue/history so navigation and refreshes do not repeat.
   Offline fallback retains a small, rotating set of verified general facts. */
const fallbackTrivia={
 movies:[
  'A standard cinema film runs at 24 frames per second.',
  'The Lumière brothers held a public film screening in Paris in 1895.',
  'The first Academy Awards ceremony took place in 1929.',
  'The first feature-length animated film released by Disney was Snow White and the Seven Dwarfs (1937).',
  'The Wilhelm scream is a stock sound effect reused in many films.',
  'A film storyboard uses a sequence of drawings to plan shots before production.',
  'Foley artists recreate everyday sounds such as footsteps for film soundtracks.',
  'A clapperboard helps synchronize recorded sound with the filmed image.',
  'A cinematographer is also called a director of photography.',
  'Stop-motion animation photographs objects one small movement at a time.',
  'A film dissolve gradually blends one shot into another.',
  'Early silent films were often accompanied by live music.'
 ],
 tv:[
  'The first television broadcast of a US presidential debate took place in 1960.',
  'A television pilot is an initial episode used to introduce or test a proposed series.',
  'A bottle episode is produced mostly on existing sets with a limited cast.',
  'A cold open begins an episode before its opening credits or title sequence.',
  'A showrunner typically oversees the creative direction and day-to-day production of a television series.',
  'A television miniseries tells a story across a predetermined, limited number of episodes.',
  'A sitcom is short for situation comedy.',
  'A cliffhanger leaves a story unresolved at a dramatic moment.',
  'Television closed captions can include dialogue and descriptions of important sounds.',
  'A season finale is the last episode in a television season.',
  'A television anthology series can feature different stories or characters each episode or season.',
  'A laugh track may use prerecorded audience laughter.'
 ]
};
function triviaStorage(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch(_){return fallback}}
function storeTrivia(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(_){}}
function nextOfflineTrivia(){
 const key='oew-trivia-fallback-'+type;
 const old=Number(triviaStorage(key,-1));
 const index=(old+1)%fallbackTrivia[type].length;
 storeTrivia(key,index);
 return fallbackTrivia[type][index];
}
function showTrivia(text,fromApi=false){
 $('page-description').textContent=(fromApi?'Trivia: ':'Did you know? ')+text;
 $('trivia-credit').hidden=!fromApi;
}
function nextTriviaFromQueue(){
 const key='oew-trivia-batch-'+type;
 const queue=triviaStorage(key,[]);
 if(!Array.isArray(queue)||!queue.length)return false;
 const item=queue.shift();
 if(!item||typeof item.question!=='string'||typeof item.answer!=='string')return false;
 storeTrivia(key,queue);
 showTrivia(item.question+' Answer: '+item.answer,true);
 return true;
}
async function rotateTrivia(){
 if(nextTriviaFromQueue())return;
 // Show a local fact immediately; a new API batch replaces it once ready.
 showTrivia(nextOfflineTrivia());
 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),3500);
  let response;
  try{
   response=await fetch('https://opentdb.com/api.php?amount=40&category='+(type==='movies'?'11':'14')+'&type=multiple&encode=url3986',
     {signal:controller.signal,mode:'cors',cache:'no-store'});
  }finally{clearTimeout(timeout)}
  if(!response.ok)return;
  const body=await response.json();
  if(body.response_code!==0||!Array.isArray(body.results))return;
  const historyKey='oew-trivia-history-'+type;
  const history=triviaStorage(historyKey,[]);
  const seen=new Set(Array.isArray(history)?history:[]);
  const fresh=[];
  for(const row of body.results){
   if(!row.question||!row.correct_answer)continue;
   const question=decodeURIComponent(row.question);
   const answer=decodeURIComponent(row.correct_answer);
   if(seen.has(question))continue;
   seen.add(question);fresh.push({question,answer});
  }
  if(!fresh.length)return;
  // Retain a bounded history for future batches; save unshown questions too.
  storeTrivia(historyKey,[...seen].slice(-300));
  storeTrivia('oew-trivia-batch-'+type,fresh);
  nextTriviaFromQueue();
 }catch(_){/* Keep the offline fact when the remote API is unavailable. */}
}
rotateTrivia();

// Movie posters are looked up in one request per page; actual image bytes are
// downloaded once and cached privately on the NUC.
const moviePosterJobs=[];
const movieFallbackQueue=[];
let movieFallbackActive=0;
const movieFallbackObserver='IntersectionObserver' in window
 ?new IntersectionObserver(entries=>{
  for(const entry of entries){
   if(!entry.isIntersecting)continue;
   movieFallbackObserver.unobserve(entry.target);
   entry.target._loadMissingMoviePoster?.();
  }
 },{rootMargin:'260px'}):null;
function requestMissingMoviePoster(cover,item){
 if(cover.dataset.moviePosterRequested||!item.library_id||!item.key)return;
 cover.dataset.moviePosterRequested='1';
 const card=cover.closest('.tile');
 const enqueue=()=>{movieFallbackQueue.push({cover,item});loadMissingMoviePosters()};
 if(movieFallbackObserver&&card){
  card._loadMissingMoviePoster=enqueue;
  movieFallbackObserver.observe(card);
 }else enqueue();
}
function loadMissingMoviePosters(){
 while(movieFallbackActive<2&&movieFallbackQueue.length){
  const {cover,item}=movieFallbackQueue.shift();
  if(!cover.isConnected)continue;
  movieFallbackActive++;
  const query=new URLSearchParams({library_id:String(item.library_id),key:item.key});
  fetch('/api/movies/details?'+query,{cache:'no-store'})
   .then(r=>r.ok?r.json():null)
   .then(data=>{
    if(data?.poster_url?.startsWith('/api/artwork/'))
     addMoviePoster(cover,item,data.poster_url,true);
   }).catch(()=>{}).finally(()=>{movieFallbackActive--;loadMissingMoviePosters()});
 }
}
function addMoviePoster(cover,item,src,fromDetails=false){
 if(!src?.startsWith('/api/artwork/'))return;
 cover.querySelector('.poster-image')?.remove();
 const img=document.createElement('img');
 img.className='poster-image';img.alt=item.title+' poster';
 img.loading='lazy';img.decoding='async';
 const full=src.startsWith('/api/artwork/thumb/')
  ?src.replace('/api/artwork/thumb/','/api/artwork/'):null;
 let triedFull=false;
 img.onerror=()=>{
  if(full&&!triedFull){triedFull=true;img.src=full;return;}
  img.remove();
  if(!fromDetails)requestMissingMoviePoster(cover,item);
 };
 cover.append(img);img.src=src;
}
async function fetchMoviePosters(){
 const jobs=moviePosterJobs.splice(0);
 if(!jobs.length)return;
 const batches=[];
 for(let i=0;i<jobs.length;i+=50)batches.push(jobs.slice(i,i+50));
 let next=0;
 async function worker(){
  while(next<batches.length){
   const part=batches[next++];
   try{
    const response=await fetch('/api/movies/posters',{
     method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({items:part.map(j=>({
      library_id:j.item.library_id,key:j.item.key
     }))})
    });
    if(!response.ok)throw Error('Poster batch unavailable');
    const data=await response.json();
    const map=new Map((data.items||[]).map(e=>[e.library_id+'|'+e.key,e.poster_url]));
    for(const job of part){
     if(!job.cover.isConnected)continue;
     const poster=map.get(job.item.library_id+'|'+job.item.key);
     if(poster?.startsWith('/api/artwork/'))addMoviePoster(job.cover,job.item,poster);
     else requestMissingMoviePoster(job.cover,job.item);
    }
   }catch(_){
    for(const job of part)if(job.cover.isConnected)
     requestMissingMoviePoster(job.cover,job.item);
   }
  }
 }
 await Promise.all([worker(),worker(),worker()]);
}
// Artwork requests are intentionally lazy and capped to avoid rate limiting.
const posterQueue=[];
let posterActive=0;
const observer='IntersectionObserver' in window?new IntersectionObserver(entries=>{
 for(const entry of entries){
  if(!entry.isIntersecting)continue;
  observer.unobserve(entry.target);
  entry.target._loadPoster?.();
 }
},{rootMargin:'260px'}):null;
function observePoster(card,cover,item){
 card._loadPoster=()=>{
  posterQueue.push({card,cover,item});
  runPosterQueue();
 };
 if(observer)observer.observe(card);
 else card._loadPoster();
}
function runPosterQueue(){
 while(posterActive<3&&posterQueue.length){
  const job=posterQueue.shift();posterActive++;
  const {card,cover,item}=job;
  const q=new URLSearchParams({library_id:String(item.library_id),key:item.key});
  fetch('/api/tv/poster?'+q,{cache:'no-store'}).then(response=>{
   if(!response.ok)throw Error('Poster request failed');
   return response.json();
  }).then(data=>{
   if(!data.poster_url||!(data.poster_url.startsWith('/api/artwork/')))return;
   if(!card.isConnected)return;
   const img=document.createElement('img');img.className='poster-image';img.alt=item.title+' poster';
   img.src=data.poster_url;img.loading='lazy';img.referrerPolicy='no-referrer';
   cover.appendChild(img);
  }).catch(()=>{}).finally(()=>{posterActive--;runPosterQueue()});
 }
}
function createCard(item){
 const article=document.createElement('article');article.className='tile';
 const button=document.createElement('a');
 button.href=type==='movies'
   ?'/movie?'+new URLSearchParams({library_id:String(item.library_id),key:item.key})
   :'/tv/show?'+new URLSearchParams({library_id:String(item.library_id),key:item.key});
 button.className='tile-button';button.setAttribute('aria-label','View details for '+item.title);
  button.dataset.hoverKind=type==='movies'?'movies':'tv';
  button.dataset.hoverLibraryId=String(item.library_id);button.dataset.hoverKey=item.key;
 let hash=0;for(const ch of item.title)hash=(hash*31+ch.charCodeAt(0))>>>0;
 const cover=document.createElement('div');cover.className='cover cover--'+(hash%6);
 const top=document.createElement('div');top.className='cover-top';
 const kind=document.createElement('span');kind.className='media-type';kind.textContent=type==='movies'?'MOVIE':'SERIES';top.append(kind);
 const initial=document.createElement('div');initial.className='cover-initial';initial.setAttribute('aria-hidden','true');initial.textContent=item.title.slice(0,1).toUpperCase()||'W';
 const coverTitle=document.createElement('div');coverTitle.className='cover-title';coverTitle.textContent=item.title;
 cover.append(top,initial,coverTitle);
 const title=document.createElement('h3');title.textContent=item.title;title.title=item.title;
 const meta=document.createElement('div');meta.className='tile-meta';
 const details=[];
  if(item.year)details.push(String(item.year));
  if(item.kind==='tv')details.push(item.seasons.length+' season'+(item.seasons.length===1?'':'s'));
  if(Number.isFinite(item.runtime)&&item.runtime>0)details.push(item.runtime+' min');
  if(typeof item.rating==='number')details.push('★ '+item.rating.toFixed(1));
  meta.textContent=details.join(' · ');
 button.append(cover,title,meta);
 if(item.watched){
   const flag=document.createElement('span');flag.className='watched-badge';
   flag.setAttribute('aria-label','Watched');flag.title='Watched';
   flag.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/></svg>';
   article.append(flag);
 }
 article.append(button);
 if(item.poster_url?.startsWith('/api/artwork/')){
   addMoviePoster(cover,item,item.poster_url);
 }else if(type==='tv')observePoster(article,cover,item);
 else moviePosterJobs.push({cover,item});
 return article;
}
function titleInitial(title){
 const significant=String(title||'').trim().replace(/^(the|an|a)\s+/i,'');
 const initial=(significant[0]||'#').toUpperCase();
 return /^[A-Z]$/.test(initial)?initial:'#';
}
function updateGenreChoices(genres){
 const selector=$('genre'),current=selectedGenre;
 const items=Array.isArray(genres)?genres.filter(x=>typeof x==='string'&&x.trim()):[];
 knownGenres=items;
 selector.replaceChildren();
 const all=document.createElement('option');all.value='';all.textContent='All Genres';selector.append(all);
 for(const genre of items){
  const option=document.createElement('option');option.value=genre;option.textContent=genre;selector.append(option);
 }
 if(current&&!items.some(x=>x.toLowerCase()===current.toLowerCase())){
  const option=document.createElement('option');option.value=current;option.textContent=current+' (indexing…)';selector.append(option);
 }
 selector.value=current;
 setMenuLabels();
 if(!$('genre-menu').hidden)renderCatalogMenu('genre');
}
function drawAlphabet(items){
 const nav=$('alpha-nav');nav.replaceChildren();
 const show=$('sort').value==='title'&&!$('search').value.trim()&&items.length>15;
 nav.hidden=!show;
 if(!show)return;
 const markers=new Map();
 for(const item of items){
   const letter=titleInitial(item.title);
   if(!markers.has(letter)){
     const card=document.querySelector('[data-letter="'+letter+'"]');
     if(card)markers.set(letter,card);
   }
 }
 for(const letter of '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'){
   const item=markers.get(letter);
   const a=document.createElement('button');a.type='button';a.textContent=letter;
   a.title=item?'Jump to '+letter:'No titles beginning with '+letter;
   a.setAttribute('aria-label',a.title);a.disabled=!item;
   if(item)a.onclick=()=>item.scrollIntoView({behavior:'smooth',block:'start'});
   nav.append(a);
 }
}
async function load(){
 const thisRequest=++requestId;
 loading=true;$('status').textContent='Loading titles…';
 const params=new URLSearchParams({kind:type,search:$('search').value.trim(),sort:$('sort').value});
 if(selectedGenre)params.set('genre',selectedGenre);
 if(Number.isInteger(selectedLibraryId)&&selectedLibraryId>0)params.set('library_id',String(selectedLibraryId));
 try{
  const response=await fetch('/api/catalog/all?'+params,{cache:'no-store'});
  if(!response.ok)throw Error('Server returned '+response.status);
  const data=await response.json();if(thisRequest!==requestId)return;
  total=data.total;const entries=Array.isArray(data.items)?data.items:[];
  updateGenreChoices(data.genres);
  $('items').replaceChildren();
  moviePosterJobs.length=0;posterQueue.length=0;movieFallbackQueue.length=0;
  const fragment=document.createDocumentFragment();
  for(const item of entries){
    const card=createCard(item);
    const letter=titleInitial(item.title);
    card.dataset.letter=letter;
    fragment.append(card);
  }
  $('items').append(fragment);
  drawAlphabet(entries);
  if(type==='movies')fetchMoviePosters();
  $('results-count').textContent=total.toLocaleString()+' titles';
  $('status').textContent='';
  if(!total){
    const empty=document.createElement('div');empty.className='empty';
    const heading=document.createElement('h3');heading.textContent='No titles found';
    empty.append(heading);$('items').append(empty);
  }
 }catch(error){if(thisRequest===requestId)$('status').textContent='Unable to load titles: '+error.message}
 finally{if(thisRequest===requestId)loading=false}
}
/* Spatial arrow navigation for keyboard, television D-pad and remote controls. */
function remoteCatalogMove(key){
 const selectors='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled])';
 const targets=[...document.querySelector('.workspace').querySelectorAll(selectors)].filter(el=>{
   if(el.closest('[hidden]'))return false;
   const r=el.getBoundingClientRect();return r.width>0&&r.height>0;
 });
 if(!targets.length)return false;
 const active=document.activeElement;
 if(!targets.includes(active)){(document.getElementById('explore-library')||targets[0]).focus();return true;}
 const r=active.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 const [dx,dy]={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[key];
 let closest=null,score=Infinity;
 for(const candidate of targets){
   if(candidate===active)continue;
   const rect=candidate.getBoundingClientRect(),cx=rect.left+rect.width/2-x,cy=rect.top+rect.height/2-y;
   const forward=cx*dx+cy*dy,side=Math.abs(cx*dy-cy*dx);
   if(forward<=3)continue;
   const value=forward+side*2.75;
   if(value<score){score=value;closest=candidate;}
 }
 if(!closest)return false;
 closest.focus({preventScroll:true});closest.scrollIntoView({block:'nearest',inline:'nearest',behavior:'instant'});
 return true;
}
document.addEventListener('keydown',event=>{
 if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)||event.altKey||event.ctrlKey||event.metaKey)return;
 const focused=document.activeElement;
 if(focused?.matches('input,textarea,[contenteditable="true"]'))return;
 if(focused?.matches('select')){
   if(event.key==='ArrowLeft'||event.key==='ArrowRight')return;
   event.preventDefault();remoteCatalogMove(event.key);return;
 }
 if(remoteCatalogMove(event.key))event.preventDefault();
});


/* Small, D-pad accessible sort and genre menus. */
const menuNames=['sort','genre'];
function setMenuLabels(){
 const sort=$('sort'),genre=$('genre');
 const sortChoice=sort.selectedOptions[0]?.textContent||'Title A–Z';
 const genreChoice=genre.selectedOptions[0]?.textContent||'All Genres';
 for(const [id,label] of [['sort','Sort: '+sortChoice],['genre','Filter: '+genreChoice]]){
  const toggle=$(id+'-toggle');
  toggle.title=label;toggle.setAttribute('aria-label',label);
  toggle.classList.toggle('is-active',id==='sort'?sort.value!=='title':Boolean(selectedGenre));
 }
}
function closeCatalogMenu(id,restoreFocus=false){
 const menu=$(id+'-menu');
 if(menu.hidden)return;
 menu.hidden=true;$(id+'-toggle').setAttribute('aria-expanded','false');
 if(restoreFocus)$(id+'-toggle').focus({preventScroll:true});
}
function renderCatalogMenu(id){
 const select=$(id),menu=$(id+'-menu');
 const wasFocused=document.activeElement?.dataset?.menuValue;
 menu.replaceChildren();
 const heading=document.createElement('div');
 heading.className='catalog-tool-heading';
 heading.textContent=id==='sort'?'Sort by':'Filter by genre';
 menu.append(heading);
 for(const option of select.options){
  const button=document.createElement('button');
  button.type='button';button.className='catalog-tool-option';
  button.setAttribute('role','menuitemradio');
  button.setAttribute('aria-checked',String(option.selected));
  button.dataset.menuValue=option.value;
  const label=document.createElement('span');label.textContent=option.textContent;
  const check=document.createElement('span');check.className='option-check';
  check.textContent=option.selected?'✓':'';
  check.setAttribute('aria-hidden','true');
  button.append(label,check);
  button.addEventListener('click',()=>{
   if(id==='sort')select.value=option.value;
   else{selectedGenre=option.value;select.value=option.value;}
   closeCatalogMenu(id,true);setMenuLabels();load();
  });
  menu.append(button);
 }
 if(!menu.hidden){
  const focused=[...menu.querySelectorAll('[role="menuitemradio"]')].find(b=>b.dataset.menuValue===wasFocused);
  (focused||menu.querySelector('[aria-checked="true"]'))?.focus({preventScroll:true});
 }
}
function openCatalogMenu(id){
 for(const other of menuNames)if(other!==id)closeCatalogMenu(other);
 renderCatalogMenu(id);
 const menu=$(id+'-menu');menu.hidden=false;
 $(id+'-toggle').setAttribute('aria-expanded','true');
 (menu.querySelector('[aria-checked="true"]')||menu.querySelector('[role="menuitemradio"]'))?.focus({preventScroll:true});
}
for(const id of menuNames){
 $(id+'-toggle').addEventListener('click',()=>{
  if($(id+'-menu').hidden)openCatalogMenu(id);
  else closeCatalogMenu(id,true);
 });
}
document.addEventListener('pointerdown',event=>{
 if(event.target.closest('.catalog-menu-anchor'))return;
 for(const id of menuNames)closeCatalogMenu(id);
});

document.addEventListener('keydown',event=>{
 const openId=menuNames.find(id=>!$(id+'-menu').hidden);
 if(event.key==='Escape'&&openId){
  event.preventDefault();event.stopImmediatePropagation();
  closeCatalogMenu(openId,true);return;
 }
 const toggle=menuNames.find(id=>document.activeElement===$(id+'-toggle'));
 if(event.key==='ArrowDown'&&toggle&&!openId){
  event.preventDefault();event.stopImmediatePropagation();
  openCatalogMenu(toggle);return;
 }
 if(!openId)return;
 const menu=$(openId+'-menu');
 if(!menu.contains(document.activeElement))return;
 const items=[...menu.querySelectorAll('[role="menuitemradio"]')];
 if(!items.length)return;
 const current=items.indexOf(document.activeElement);
 if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){
  event.preventDefault();event.stopImmediatePropagation();
  const next=event.key==='Home'?0:event.key==='End'?items.length-1:
   (current+(event.key==='ArrowDown'?1:-1)+items.length)%items.length;
  items[next].focus({preventScroll:true});
 }else if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
  event.preventDefault();event.stopImmediatePropagation();
  closeCatalogMenu(openId);
  $(openId==='sort'?'genre-toggle':'sort-toggle').focus({preventScroll:true});
 }
},true);
setMenuLabels();

let debounce;
$('search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>load(),220)});
$('sort').addEventListener('change',()=>{setMenuLabels();load()});
$('genre').addEventListener('change',()=>{selectedGenre=$('genre').value;setMenuLabels();load()});

/* Metadata indexing runs separately from poster artwork. */
let metadataRevision=-1, metadataReloadAt=0, metadataTimer=null, lastMetadataFinished=0;
async function checkMetadata(){
 try{
  const response=await fetch('/api/catalog/metadata/status',{cache:'no-store'});
  if(!response.ok)throw Error('Metadata status unavailable');
  const state=await response.json();
  const revision=Number(state.revision)||0,processed=Number(state.processed)||0,
        totalTitles=Number(state.total)||0,
        available=Number(state.available)||0,missing=Number(state.missing)||0;
  $('refresh-metadata').disabled=!!state.running;
  if(state.running){
   $('metadata-status').textContent='Checking genres, ratings and runtimes · '+processed+' of '+totalTitles+' titles';
  }else if(state.error){
   $('metadata-status').textContent=state.error;
  }else if(!state.last_finished){
   $('metadata-status').textContent='Preparing library metadata…';
  }else if(totalTitles===0){
   $('metadata-status').textContent='';
  }else if(available===0){
   $('metadata-status').textContent='No genre, rating or runtime metadata found for '+totalTitles+
     ' titles. Check Settings → Connections (Radarr/Sonarr) and Settings → Metadata (TMDB).';
  }else if(missing>0 && missing/totalTitles>=0.05){
   // Suppress low-noise coverage warnings (for example, 4 of 427 titles).
   // Retries still run in the background regardless of the warning display.
   $('metadata-status').textContent='Metadata available for '+available+' of '+totalTitles+
     ' titles; '+missing+' still missing. Unmatched titles are retried automatically.';
  }else{
   $('metadata-status').textContent='';
  }
  const finished=Number(state.last_finished)||0;
  const newMetadata=metadataRevision>=0&&revision!==metadataRevision;
  const newlyFinished=finished>0&&finished!==lastMetadataFinished;
  metadataRevision=revision;
  lastMetadataFinished=finished;
  if((newlyFinished||newMetadata) && !loading &&
     (newlyFinished || processed-metadataReloadAt>=25 || !state.running)){
    metadataReloadAt=processed;
    load();
  }
 }catch(error){
  $('metadata-status').textContent='Metadata status unavailable: '+error.message;
 }finally{
  clearTimeout(metadataTimer);
  metadataTimer=setTimeout(checkMetadata,4000);
 }
}
$('refresh-metadata').addEventListener('click',async()=>{
 $('refresh-metadata').disabled=true;
 $('metadata-status').textContent='Starting metadata refresh…';
 try{
  const response=await fetch('/api/catalog/metadata/refresh',{method:'POST'});
  if(!response.ok)throw Error('Unable to start metadata refresh.');
  await checkMetadata();
 }catch(error){
  $('metadata-status').textContent=error.message;
  $('refresh-metadata').disabled=false;
 }
});

load();
checkMetadata();
</script>
