<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-Eyed Willie · Browse</title>
<link rel="stylesheet" href="/assets/ui.css">
<script defer src="/assets/shell.js"></script>
<style>
.library-toolbar{margin:26px 0 20px}
.count-label{color:#98a7ba;font-size:.88rem}
.load-more-wrap{text-align:center;margin:34px 0}
#more{min-width:178px}
.detail-top{display:flex;gap:22px;align-items:flex-start}.detail-art{width:128px;aspect-ratio:2/3;border-radius:12px;background:linear-gradient(160deg,#354b61,#18202d);display:flex;align-items:center;justify-content:center;font-size:3.5rem;color:#b1c2d6;flex:none}.detail-metadata{flex:1;min-width:0}.detail-metadata p{color:var(--muted);margin:7px 0}
@media(max-width:530px){.detail-art{width:90px;font-size:2.6rem}.detail-top{gap:13px}}
</style></head>
<body data-page="movies">
<div class="app-shell">
  <aside id="app-nav" class="sidebar" aria-label="Sidebar"></aside>
  <div class="workspace">
    <main class="content">
      <div class="page-head"><div>
        <p class="eyebrow" id="eyebrow">Your library</p>
        <h1 id="page-title">Movies</h1>
        <p id="page-description">Browse all the movies on your media server.</p>
      </div></div>
      <div class="toolbar library-toolbar">
        <div class="filter-tabs" aria-label="Browse category">
          <a class="filter-link" id="tab-movies" href="/movies">Movies</a>
          <a class="filter-link" id="tab-tv" href="/tv">TV Shows</a>
        </div>
        <div class="tools">
          <label class="search-box"><span class="sr-only">Search titles</span><input type="search" id="search" placeholder="Search titles…" maxlength="150" aria-label="Search titles"></label>
          <label><span class="sr-only">Sort titles</span><select id="sort" class="sort-select" aria-label="Sort titles">
            <option value="title">Title A–Z</option><option value="recent">Recently added</option><option value="year">Release year</option>
          </select></label>
        </div>
      </div>
      <div class="section-heading"><h2 id="section-title">All Movies</h2><span id="results-count" class="count-label"></span></div>
      <p id="status" class="status-line" role="status">Loading titles…</p>
      <div id="items" aria-live="off"></div>
      <div class="load-more-wrap"><button type="button" class="secondary-button" id="more" hidden>Load more</button></div>
      <p class="note">Movie artwork comes from local poster files or your Radarr library. TV artwork comes from TVmaze. Artwork is cached on the server.</p>
    </main>
  </div>
</div>

<script>
const type=location.pathname==='/tv'?'tv':'movies';
document.body.dataset.page=type;
const $=id=>document.getElementById(id);
const query=new URLSearchParams(location.search);
let offset=0,total=0,requestId=0,loading=false;
const PAGE_SIZE=60;
const initialSearch=query.get('search')||'';
$('search').value=initialSearch.slice(0,150);
if(query.get('focus')==='search')requestAnimationFrame(()=>$('search').focus());
$('page-title').textContent=type==='movies'?'Movies':'TV Shows';
$('page-description').textContent=type==='movies'?'Browse every movie in your collection.':'Browse all of your series and episodes.';
$('section-title').textContent=type==='movies'?'All Movies':'All TV Shows';
document.title='One-Eyed Willie · '+(type==='movies'?'Movies':'TV Shows');
for(const [id,kind] of [['tab-movies','movies'],['tab-tv','tv']]){
  const tab=$(id);tab.setAttribute('aria-current',type===kind?'page':'false');
}
// Movie posters are looked up in one request per page; actual image bytes are
// downloaded once and cached privately on the NUC.
const moviePosterJobs=[];
function fetchMoviePosters(){
 const jobs=moviePosterJobs.splice(0);
 if(!jobs.length)return;
 fetch('/api/movies/posters',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({items:jobs.map(j=>({library_id:j.item.library_id,key:j.item.key}))})})
   .then(response=>response.ok?response.json():null)
   .then(data=>{
     if(!data?.items)return;
     const map=new Map(data.items.map(entry=>[entry.library_id+'|'+entry.key,entry.poster_url]));
     for(const job of jobs){
       const poster=map.get(job.item.library_id+'|'+job.item.key);
       if(!poster?.startsWith('/api/artwork/')||!job.cover.isConnected)continue;
       const img=document.createElement('img');img.className='poster-image';img.alt=job.item.title+' poster';
       img.src=poster;img.loading='lazy';job.cover.append(img);
     }
   }).catch(()=>{});
}
// Artwork requests are intentionally lazy and capped to avoid rate limiting.
const posterQueue=[];
let posterActive=0;
const observer='IntersectionObserver' in window?new IntersectionObserver(entries=>{
 for(const entry of entries){
  if(!entry.isIntersecting)continue;
  observer.unobserve(entry.target);
  entry.target._loadPoster?.();
 }
},{rootMargin:'260px'}):null;
function observePoster(card,cover,item){
 card._loadPoster=()=>{
  posterQueue.push({card,cover,item});
  runPosterQueue();
 };
 if(observer)observer.observe(card);
 else card._loadPoster();
}
function runPosterQueue(){
 while(posterActive<3&&posterQueue.length){
  const job=posterQueue.shift();posterActive++;
  const {card,cover,item}=job;
  const q=new URLSearchParams({library_id:String(item.library_id),key:item.key});
  fetch('/api/tv/poster?'+q,{cache:'no-store'}).then(response=>{
   if(!response.ok)throw Error('Poster request failed');
   return response.json();
  }).then(data=>{
   if(!data.poster_url||!(data.poster_url.startsWith('/api/artwork/')))return;
   if(!card.isConnected)return;
   const img=document.createElement('img');img.className='poster-image';img.alt=item.title+' poster';
   img.src=data.poster_url;img.loading='lazy';img.referrerPolicy='no-referrer';
   cover.appendChild(img);
  }).catch(()=>{}).finally(()=>{posterActive--;runPosterQueue()});
 }
}
function createCard(item){
 const article=document.createElement('article');article.className='tile';
 const button=document.createElement('a');
 button.href=type==='movies'
   ?'/movie?'+new URLSearchParams({library_id:String(item.library_id),key:item.key})
   :'/tv/show?'+new URLSearchParams({library_id:String(item.library_id),key:item.key});
 button.className='tile-button';button.setAttribute('aria-label','View details for '+item.title);
 let hash=0;for(const ch of item.title)hash=(hash*31+ch.charCodeAt(0))>>>0;
 const cover=document.createElement('div');cover.className='cover cover--'+(hash%6);
 const top=document.createElement('div');top.className='cover-top';
 const kind=document.createElement('span');kind.className='media-type';kind.textContent=type==='movies'?'MOVIE':'SERIES';top.append(kind);
 const initial=document.createElement('div');initial.className='cover-initial';initial.setAttribute('aria-hidden','true');initial.textContent=item.title.slice(0,1).toUpperCase()||'W';
 const coverTitle=document.createElement('div');coverTitle.className='cover-title';coverTitle.textContent=item.title;
 cover.append(top,initial,coverTitle);
 const title=document.createElement('h3');title.textContent=item.title;title.title=item.title;
 const meta=document.createElement('div');meta.className='tile-meta';
 meta.textContent=(item.year?item.year+' · ':'')+(item.kind==='tv'?item.seasons.length+' season'+(item.seasons.length===1?'':'s'):item.files+' file'+(item.files===1?'':'s'));
 button.append(cover,title,meta);
 if(item.watched){
   const flag=document.createElement('span');flag.className='watched-badge';flag.textContent='✓ Watched';
   flag.setAttribute('aria-label','Watched');article.append(flag);
 }
 article.append(button);
 if(type==='tv')observePoster(article,cover,item);
 else moviePosterJobs.push({cover,item});
 return article;
}
async function load(reset=true){
 if(loading&&!reset)return;
 const thisRequest=++requestId;if(reset){offset=0;$('items').replaceChildren();}
 loading=true;$('more').disabled=true;$('status').textContent='Loading titles…';
 const params=new URLSearchParams({kind:type,search:$('search').value.trim(),sort:$('sort').value,offset:String(offset),limit:String(PAGE_SIZE)});
 try{
  const response=await fetch('/api/catalog?'+params,{cache:'no-store'});if(!response.ok)throw Error('Server returned '+response.status);
  const data=await response.json();if(thisRequest!==requestId)return;
  total=data.total;const items=Array.isArray(data.items)?data.items:[];
  for(const item of items)$('items').append(createCard(item));
  if(type==='movies')fetchMoviePosters();
  offset+=items.length;
  $('results-count').textContent=total.toLocaleString()+' title'+(total===1?'':'s');
  $('status').textContent=total?('Showing '+offset.toLocaleString()+' of '+total.toLocaleString()):'';
  if(!total){const empty=document.createElement('div');empty.className='empty';const h=document.createElement('h3');h.textContent='No titles found';const p=document.createElement('p');p.textContent=$('search').value?'Try another search.':'Add a library in Settings → Libraries and scan it.';empty.append(h,p);$('items').append(empty);}
  $('more').hidden=offset>=total;
 }catch(error){if(thisRequest===requestId)$('status').textContent='Unable to load titles: '+error.message;}
 finally{if(thisRequest===requestId){loading=false;$('more').disabled=false;}}
}
let debounce;
$('search').addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(()=>load(true),220)});
$('sort').addEventListener('change',()=>load(true));
$('more').onclick=()=>load(false);
load();
</script>
</body></html>
