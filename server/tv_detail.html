<!doctype html>
<html lang="en"><head>
<link rel="icon" type="image/png" href="/assets/favicon.png?v=3">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-Eyed Willie · TV Shows</title>
<link rel="stylesheet" href="/assets/ui.css"><script defer src="/assets/shell.js"></script><script defer src="/assets/player.js"></script>
<style>
body[data-page=tv] .tv-extras{padding:10px 0 28px}
body[data-page=tv] .tv-extras h2{margin:30px 0 17px;font-size:1.45rem}
.tv-facts{display:flex;gap:12px 28px;flex-wrap:wrap;color:#a9bdd3;margin-bottom:12px}
.tv-rating{color:#dfedfc}
.tv-cast{display:grid;grid-auto-flow:column;grid-auto-columns:125px;gap:18px;overflow-x:auto;padding-bottom:10px}
.tv-cast-person{display:flex;flex-direction:column;gap:6px}
.tv-actor-image{width:125px;height:170px;object-fit:cover;background:#1a2b3a;border-radius:6px}
.tv-actor-placeholder{display:grid;place-items:center;color:#a5bcd6;font-size:2rem}
.tv-cast-person strong{font-size:.89rem}.tv-cast-person span{font-size:.78rem;color:#9aabc0}
.tv-trailer{position:relative;width:100%;max-width:560px;aspect-ratio:16/9;background:#142335;overflow:hidden;border-radius:8px}
.tv-trailer iframe{display:block;width:100%;height:100%;border:0}
.tv-trailer-preview{position:relative;width:100%;height:100%;display:grid;place-items:center;border:0;color:#fff;background:#162537;cursor:pointer}
.tv-trailer-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tv-trailer-preview span{position:relative;z-index:1;display:grid;place-items:center;width:64px;height:46px;border-radius:10px;background:#e9f1fc;color:#132235;font-size:27px;box-shadow:0 6px 28px #0008}
.tv-trailer-fallback{font-size:.86rem;color:#aabdd0;margin:9px 0}
.tv-trailer-fallback a{color:#c1dcf4;text-decoration:underline;text-underline-offset:3px}
.tv-reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px 36px}
.tv-review{padding:0;border:0}.tv-review p{color:#b7c9d9;line-height:1.65;white-space:pre-wrap}
.tv-trailer-launch{background:none;color:#d9ecfb;border:0;font-size:1rem;cursor:pointer}
</style></head><body data-page="tv">
<div class="app-shell">
<aside id="app-nav" class="sidebar" aria-label="Sidebar"></aside>
<div class="workspace">
<main class="content" id="content">
<a class="breadcrumb-link" id="back-link" href="/tv">← All TV Shows</a>
<div id="loading" class="status-line" role="status">Loading TV library…</div>
<div id="view"></div>

</main>
</div></div>
<script>
const params=new URLSearchParams(location.search);
const state={library_id:Number(params.get('library_id')),key:params.get('key')||'',season_number:Number(params.get('season_number')),media_id:Number(params.get('media_id'))};
const view=document.getElementById('view'),loading=document.getElementById('loading'),back=document.getElementById('back-link');
const route=location.pathname.includes('/episode')?'episode':location.pathname.includes('/season')?'season':'show';
const showHref=(id,key)=>'/tv/show?'+new URLSearchParams({library_id:String(id),key});
const seasonHref=(id,key,season)=>'/tv/season?'+new URLSearchParams({library_id:String(id),key,season_number:String(season)});
const episodeHref=id=>'/tv/episode?'+new URLSearchParams({media_id:String(id)});
function el(tag,cls,text){
  const node=document.createElement(tag);if(cls)node.className=cls;
  if(text!==undefined&&text!==null)node.textContent=String(text);
  return node;
}
function watchIcon(watched){
 return watched
  ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 3-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 4v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>'
  : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function updateWatchIcon(button,watched,scope='episode'){
 const action=watched?'Mark '+scope+' unwatched':'Mark '+scope+' watched';
 button.title=action;button.setAttribute('aria-label',action);
 button.setAttribute('aria-pressed',String(!!watched));
 button.innerHTML=watchIcon(watched);
}
function playbackButton(id,title,resume=false){
 const button=el('button',resume?'secondary-button media-icon-action':'primary-button media-icon-action');
 button.type='button';
 const label=resume?'Resume from saved position':'Play from beginning';
 button.setAttribute('aria-label',label);button.title=label;
 button.innerHTML=resume
  ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.4 6M4 4v7h7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10 9 6 3-6 3z" fill="currentColor"/></svg>'
  : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
 button.addEventListener('click',()=>WilliePlayer.open(id,title,{restart:!resume}));
 return button;
}
function canResume(item){
 const p=Number(item.position_seconds)||0,d=Number(item.duration_seconds)||0;
 return !item.watched&&d>0&&p>=30&&p<d*.95;
}
function image(src,cls,alt){
  const node=el('img',cls);node.alt=alt||'';
  if(typeof src==='string'&&src.startsWith('/api/artwork/')){
    node.src=src;node.loading='lazy';node.referrerPolicy='no-referrer';
  }
  return node;
}
function poster(url,alt){
 if(url)return image(url,'hero-poster',alt);
 const fallback=el('div','hero-poster');fallback.setAttribute('role','img');fallback.setAttribute('aria-label','Poster not available');
 return fallback;
}
function credit(data){
 const div=el('p','muted');div.append('TV show information from ');
 const link=el('a','text-link','TVmaze');link.href=(typeof data.source_url==='string'&&data.source_url.startsWith('https://www.tvmaze.com/'))?data.source_url:'https://www.tvmaze.com/';link.target='_blank';link.rel='noopener noreferrer';div.append(link,'.');return div;
}
function notice(){
 const div=el('div','metadata-notice');
 div.append('Automatic TVmaze metadata did not match this title. You can optionally try TMDB in ');
 const link=el('a','', 'Settings → Metadata');link.href='/settings/metadata';div.append(link,'.');
 return div;
}
function hero(title,overview,art,backdrop,year,subtitle){
 const head=el('section','media-hero');
 if(backdrop)head.appendChild(image(backdrop,'hero-backdrop',''));
 const artNode=poster(art,title+' poster');
 const info=el('div','hero-info');info.append(el('p','eyebrow',subtitle||'TV SERIES'),el('h1','',title));
 if(year)info.appendChild(el('p','muted',String(year)));
 info.appendChild(el('p','',overview||'No description available for this title yet.'));
 head.append(artNode,info);return head;
}
function bulkWatchedControl(data,scope){
 const button=el('button','media-icon-action watch-icon-control');
 const allWatched=scope==='show'
   ?data.watched_count===data.episode_count
   :data.season.watched_count===data.season.episode_count;
 const updateLabel=watched=>{
   button.title=watched?'Mark all unwatched':'Mark all watched';
   button.setAttribute('aria-label',button.title);
   updateWatchIcon(button,watched,scope==='show'?'series':'season');
 };
 updateLabel(allWatched);
 button.onclick=async()=>{
   button.disabled=true;
   const watched=button.getAttribute('aria-pressed')!=='true';
   try{
     const q=new URLSearchParams({library_id:String(state.library_id),key:state.key});
     if(scope==='season')q.set('season_number',String(state.season_number));
     const r=await fetch('/api/tv/'+scope+'/watched?'+q,{
       method:'PUT',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({watched})});
     if(!r.ok)throw Error('Cannot update watched status');
     updateLabel(watched);
     if(scope==='show')data.watched_count=watched?data.episode_count:0;
     else data.season.watched_count=watched?data.season.episode_count:0;
     const note=el('span','muted',watched?'All marked watched':'All marked unwatched');
     button.after(note);setTimeout(()=>note.remove(),2500);
     if(scope==='season')view.querySelectorAll('.episode-actions button[aria-pressed]').forEach(control=>{
        control.setAttribute('aria-pressed',String(watched));
        updateWatchIcon(control,watched);
     });
   }catch(err){loading.textContent=err.message}
   finally{button.disabled=false}
 };
 return button;
}
function showExtras(data){
 const section=el('section','tv-extras');
 const facts=el('div','tv-facts');
 const score=Number(data.rating);
 if(Number.isFinite(score)&&score>0)facts.append(el('span','tv-rating','★ '+score.toFixed(1)+' / 10 · '+(data.metadata_source||'Provider')));
 if(data.network)facts.append(el('span','tv-network',data.network));
 if(Array.isArray(data.genres)&&data.genres.length)facts.append(el('span','tv-genres',data.genres.join(' · ')));
 if(facts.childNodes.length)section.append(facts);
 if(/^[A-Za-z0-9_-]{11}$/.test(data.trailer_key||'')){
   const title=el('h2','','Trailer');
   const trailer=el('div','tv-trailer');
   const key=data.trailer_key;
   const launch=el('button','tv-trailer-preview');
   launch.type='button';launch.title='Play trailer';
   launch.setAttribute('aria-label','Play '+data.title+' trailer');
   const thumbnail=el('img');thumbnail.alt='';thumbnail.loading='lazy';
   thumbnail.referrerPolicy='no-referrer';
   thumbnail.src='https://i.ytimg.com/vi/'+key+'/hqdefault.jpg';
   const badge=el('span','','▶');badge.setAttribute('aria-hidden','true');
   launch.append(thumbnail,badge);
   launch.onclick=()=>{
     const frame=document.createElement('iframe');
     frame.title=data.title+' trailer';frame.allowFullscreen=true;
     frame.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
     frame.referrerPolicy='strict-origin-when-cross-origin';
     frame.src='https://www.youtube-nocookie.com/embed/'+key+'?autoplay=1&playsinline=1';
     trailer.replaceChildren(frame);
   };
   trailer.append(launch);
   const fallback=el('p','tv-trailer-fallback');
   fallback.append('If playback is blocked, ');
   const link=el('a','','watch on YouTube');
   link.href='https://www.youtube.com/watch?v='+key;
   link.target='_blank';link.rel='noopener noreferrer';
   fallback.append(link,'.');
   section.append(title,trailer,fallback);
 }
 const actors=Array.isArray(data.cast)?data.cast.filter(person=>person.name):[];
 if(actors.length){
   section.append(el('h2','','Cast'));
   const grid=el('div','tv-cast');
   for(const actor of actors){
     const person=el('article','tv-cast-person');
     if(actor.photo?.startsWith('/api/artwork/'))person.append(image(actor.photo,'tv-actor-image',''));
     else person.append(el('div','tv-actor-image tv-actor-placeholder',actor.name[0]));
     person.append(el('strong','',actor.name));
     if(actor.character)person.append(el('span','',actor.character));
     grid.append(person);
   }
   section.append(grid);
 }
 const reviews=Array.isArray(data.reviews)?data.reviews.filter(review=>review.excerpt):[];
 if(reviews.length){
   section.append(el('h2','','Reviews · TMDB community'));
   const grid=el('div','tv-reviews');
   for(const review of reviews){
     const entry=el('article','tv-review');
     entry.append(el('strong','',review.author||'TMDB contributor'),
                  el('p','',review.excerpt));
     grid.append(entry);
   }
   section.append(grid);
 }
 return section;
}
function coverCard(item,title,subtitle,href){
 const article=el('article','season-card');
 const a=el('a','tile-button');a.href=href;
 const cover=el('div','cover');
 if(item.poster_url)cover.append(image(item.poster_url,'poster-image',title+' poster'));
 else{cover.append(el('div','cover-top'),el('div','cover-initial',(title||'S')[0]),el('div','cover-title',title))}
 a.append(cover,el('h3','',title),el('p','',subtitle));article.append(a);return article;
}
function setBack(text,href){back.href=href;back.textContent='← '+text;}
async function loadJson(url){
 const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('Unable to load details ('+response.status+')');
 return response.json();
}
async function renderShow(){
 if(!Number.isInteger(state.library_id)||!state.library_id||!state.key)throw Error('Select a TV show from the library.');
 const data=await loadJson('/api/tv/show?'+new URLSearchParams({library_id:state.library_id,key:state.key}));
 setBack('All TV Shows','/tv');
 document.title=data.title+' · One-Eyed Willie';
 view.append(hero(data.title,data.overview,data.poster_url,data.backdrop_url,data.year,'TV SERIES'));
 const showActions=el('div','show-bulk-actions');showActions.append(bulkWatchedControl(data,'show'));
 view.append(showActions);
 view.append(showExtras(data));
 const heading=el('div','section-heading');heading.append(el('h2','','Seasons'),el('span','',data.seasons.length+' available'));
 view.appendChild(heading);
 const grid=el('div','season-grid');
 for(const season of data.seasons){
  if(season.number===null)continue;
  grid.appendChild(coverCard(season,season.name,season.watched_count+' / '+season.episode_count+' watched',
    seasonHref(data.library_id,data.key,season.number)));
 }
 view.appendChild(grid);
 if(data.seasons.some(s=>s.number===null)){
   const note=el('p','muted','Some files do not have season and episode numbers in their filenames, so they could not be assigned to a season.');
   view.appendChild(note);
 }
 if(data.metadata_source==='TVmaze')view.appendChild(credit(data));
 if(!data.metadata_available)view.appendChild(notice());
}
async function renderSeason(){
 if(!Number.isInteger(state.season_number)||state.season_number<0||!state.key||!state.library_id)throw Error('Choose a season from the show page.');
 const data=await loadJson('/api/tv/season?'+new URLSearchParams({library_id:state.library_id,key:state.key,season_number:state.season_number}));
 setBack('Back to '+data.show.title,showHref(data.show.library_id,data.show.key));
 document.title=data.season.name+' · '+data.show.title+' · One-Eyed Willie';
 view.append(hero(data.show.title+' — '+data.season.name,data.season.overview,
   data.season.poster_url,null,null,'TV SEASON'));
 const seasonActions=el('div','show-bulk-actions');seasonActions.append(bulkWatchedControl(data,'season'));
 view.append(seasonActions);
 const heading=el('div','section-heading');heading.append(el('h2','','Episodes'),el('span','',data.episodes.length+' in your library'));view.appendChild(heading);
 const list=el('div','episode-grid');
 for(const episode of data.episodes){
  const card=el('a','episode-card');card.href=episodeHref(episode.id);
  if(episode.still_url)card.append(image(episode.still_url,'episode-still','Still from '+episode.title));
  else{
    const fallback=el('div','episode-still');fallback.setAttribute('role','img');fallback.setAttribute('aria-label','Episode still not available');card.append(fallback);
  }
  const detail=el('div','');
  const tag=el('p','episode-meta',episode.episode===null?'Episode':'Episode '+episode.episode);
  detail.append(tag,el('h3','',episode.title));
  if(episode.air_date)detail.append(el('div','episode-meta',episode.air_date));
  detail.append(el('p','episode-desc',episode.overview||'No episode description available yet.'));
  card.append(detail);
  const row=el('div','episode-entry');row.append(card);
  const controls=el('div','episode-actions');
  const play=playbackButton(episode.id,data.show.title+' · '+episode.title);
  const resume=canResume(episode)?playbackButton(episode.id,data.show.title+' · '+episode.title,true):null;
  const watched=el('button','media-icon-action watch-icon-control');
  watched.type='button';updateWatchIcon(watched,episode.watched);
  watched.onclick=async()=>{
    watched.disabled=true;
    try{
      const r=await fetch('/api/watch/'+episode.id+'/watched',{method:'PUT',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({watched:!episode.watched})});
      if(!r.ok)throw Error('Status unavailable');
      episode.watched=!episode.watched;updateWatchIcon(watched,episode.watched);
    }catch(_){watched.title='Try again';}
    finally{watched.disabled=false;}
  };
  controls.append(play);if(resume)controls.append(resume);
  controls.append(watched);row.append(controls);list.append(row);
 }
 view.appendChild(list);
 if(!data.metadata_available)view.appendChild(notice());
}
async function renderEpisode(){
 if(!Number.isInteger(state.media_id)||!state.media_id)throw Error('Choose an episode from its season.');
 const data=await loadJson('/api/tv/episode?'+new URLSearchParams({media_id:state.media_id}));
 setBack('Back to '+data.show_title, data.season_number===null?
   showHref(data.library_id,data.key):seasonHref(data.library_id,data.key,data.season_number));
 document.title=data.title+' · '+data.show_title+' · One-Eyed Willie';
 view.append(el('p','eyebrow',data.show_title+' · Season '+(data.season_number??'?')+' · Episode '+(data.episode_number??'?')),
   el('h1','episode-detail-title',data.title));
 if(data.still_url)view.append(image(data.still_url,'episode-preview','Episode preview image'));
 else{const preview=el('div','episode-preview');preview.setAttribute('role','img');preview.setAttribute('aria-label','Episode preview unavailable');view.append(preview);}
 view.append(el('p','episode-summary',data.overview||'No episode description is available yet.'));
 const meta=el('p','muted',[
  data.air_date||null,data.runtime?data.runtime+' min':null
 ].filter(Boolean).join(' · '));view.append(meta);
 const controls=el('div','episode-detail-actions');
 const play=playbackButton(data.id,data.show_title+' · '+data.title);
 const resume=canResume(data)?playbackButton(data.id,data.show_title+' · '+data.title,true):null;
 const watched=el('button','media-icon-action watch-icon-control');
 watched.type='button';updateWatchIcon(watched,data.watched);
 watched.onclick=async()=>{
   watched.disabled=true;
   try{
     const r=await fetch('/api/watch/'+data.id+'/watched',{
       method:'PUT',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({watched:!data.watched})});
     if(!r.ok)throw Error('Unable to save status');
     data.watched=!data.watched;updateWatchIcon(watched,data.watched);
   }catch(_){watched.title='Try again'}
   finally{watched.disabled=false}
 };
 controls.append(play);if(resume)controls.append(resume);
 controls.append(watched);view.append(controls);
 if(!data.metadata_available)view.appendChild(notice());
}
(async()=>{
 try{
  if(route==='show')await renderShow();
  else if(route==='season')await renderSeason();
  else await renderEpisode();
  loading.textContent='';
 }catch(error){loading.textContent=error.message;}
})();
</script>
</body></html>
