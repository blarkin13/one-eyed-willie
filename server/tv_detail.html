<script>

const state={library_id:Number(params.get('library_id')),key:params.get('key')||'',season_number:Number(params.get('season_number')),media_id:Number(params.get('media_id'))};
const view=document.getElementById('view'),loading=document.getElementById('loading');
const route=location.pathname.includes('/episode')?'episode':location.pathname.includes('/season')?'season':'show';
const showHref=(id,key)=>'/tv/show?'+new URLSearchParams({library_id:String(id),key});
const seasonHref=(id,key,season)=>'/tv/season?'+new URLSearchParams({library_id:String(id),key,season_number:String(season)});
function el(tag,cls,text){
  const node=document.createElement(tag);if(cls)node.className=cls;
  if(text!==undefined&&text!==null)node.textContent=String(text);
  return node;
}

/* Only scroll the horizontal rail: scrollIntoView also moves the whole page
   on some Android WebViews, leaving the selected item offscreen. */
function revealRailItem(rail,item){
 if(!rail||!item)return;
 const viewport=rail.getBoundingClientRect(),card=item.getBoundingClientRect();
 const padding=14;
 const delta=card.left<viewport.left+padding
   ?card.left-viewport.left-padding
   :card.right>viewport.right-padding
     ?card.right-viewport.right+padding:0;
 if(Math.abs(delta)>1)rail.scrollLeft+=delta;
}
function setupSeasonRail(rail,kind){
 const shell=el('div','season-rail-shell season-rail-shell--'+kind);
 const makeArrow=forward=>{
   const button=el('button','season-rail-arrow');button.type='button';
   button.dataset.seasonScrollArrow='true';
   const name=kind==='seasons'?'seasons':'episodes';
   const action=forward?'Next':'Previous';
   button.title=action+' '+name;button.setAttribute('aria-label',action+' '+name);
   button.setAttribute('aria-controls',rail.id);
   button.innerHTML=forward
     ?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
     :'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
   button.onclick=()=>rail.scrollBy({left:(forward?1:-1)*rail.clientWidth*.8,behavior:'smooth'});
   return button;
 };
 const back=makeArrow(false),next=makeArrow(true);
 shell.append(back,rail,next);
 const update=()=>{
   const max=Math.max(0,rail.scrollWidth-rail.clientWidth);
   shell.classList.toggle('has-overflow',max>3);
   back.disabled=max<=3||rail.scrollLeft<=2;
   next.disabled=max<=3||rail.scrollLeft>=max-2;
 };
 rail.addEventListener('scroll',update,{passive:true});
 rail.addEventListener('focusin',event=>{
   if(event.target instanceof Element&&rail.contains(event.target))
     revealRailItem(rail,event.target);
   update();
 });
 // Desktop keyboard and TV remote both traverse every item in order.
 // TV handles D-pad events itself, while browsers use these arrow keys.
 rail.addEventListener('keydown',event=>{
   if(!['ArrowLeft','ArrowRight'].includes(event.key)||event.altKey||event.ctrlKey||event.metaKey)return;
   const entries=[...rail.querySelectorAll(rail.matches('.season-tabs')?'a[href]':'.season-episode-tile')];
   const index=entries.indexOf(document.activeElement);
   if(index<0)return;
   const target=entries[index+(event.key==='ArrowRight'?1:-1)];
   if(!target)return;
   event.preventDefault();
   target.focus({preventScroll:true});
   revealRailItem(rail,target);
 });
 if(typeof ResizeObserver==='function')new ResizeObserver(update).observe(rail);
 window.addEventListener('resize',update,{passive:true});
 requestAnimationFrame(update);
 return {shell,update};
}
function anchorIcon(){
 return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/></svg>';
}
function syncEpisodeWatchedBadge(tile,watched){

}
function updateWatchIcon(button,watched,scope='episode'){
 const action=watched?'Mark '+scope+' unwatched':'Mark '+scope+' watched';
 button.title=action;button.setAttribute('aria-label',action);
 button.setAttribute('aria-pressed',String(!!watched));

 button.innerHTML=anchorIcon();
}
function playbackButton(id,title,resume=false){
 const button=el('button',resume?'secondary-button media-icon-action':'primary-button media-icon-action');
 button.type='button';
 const label=resume?'Resume from saved position':'Play from beginning';
 button.setAttribute('aria-label',label);button.title=label;
 button.innerHTML=resume
  ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.4 6M4 4v7h7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10 9 6 3-6 3z" fill="currentColor"/></svg>'
  : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
 button.addEventListener('click',()=>WilliePlayer.open(id,title,{restart:!resume}));
 return button;
}
function canResume(item){

function image(src,cls,alt){
  const node=el('img',cls);node.alt=alt||'';
  if(typeof src==='string'&&src.startsWith('/api/artwork/')){

function openMatchDialog(){
 const dialog=el('dialog','tv-match-dialog');dialog.setAttribute('aria-label','Fix TV show metadata match');
 const head=el('div','tv-match-head');
 const heading=el('h2','','Fix Match');
 const close=el('button','media-icon-action','×');close.type='button';close.title='Close';close.setAttribute('aria-label','Close matching');
 close.onclick=()=>dialog.close();head.append(heading,close);
 const description=el('p','muted','Search TMDB and TVmaze, then select the correct series. This updates metadata only; your media files stay unchanged.');
 const form=el('form','tv-match-search');
 const input=el('input');input.type='search';input.required=true;input.minLength=2;input.maxLength=120;
 input.value=state.show_title||state.key.split(':')[0]||'';input.placeholder='Search TV show title';input.setAttribute('aria-label','Search show title');
 const search=el('button','primary-button','Search');search.type='submit';form.append(input,search);
 const message=el('p','tv-match-message');message.setAttribute('role','status');
 const results=el('div','tv-match-results');
 const restore=el('button','tv-match-restore','Restore automatic match');restore.type='button';
 restore.onclick=async()=>{
   if(!confirm('Remove your saved metadata match and try automatic matching again?'))return;
   restore.disabled=true;
   try{
     const q=new URLSearchParams({library_id:String(state.library_id),key:state.key});
     const r=await fetch('/api/tv/match?'+q,{method:'DELETE'});
     if(!r.ok)throw Error('Unable to reset match');
     location.reload();
   }catch(error){message.textContent=error.message;restore.disabled=false;}
 };
 async function searchMatches(event){
   if(event)event.preventDefault();
   search.disabled=true;message.textContent='Searching TV providers…';results.replaceChildren();
   try{
     const q=new URLSearchParams({library_id:String(state.library_id),key:state.key,query:input.value.trim()});
     const response=await fetch('/api/tv/match/search?'+q,{cache:'no-store'});
     const data=await response.json();if(!response.ok)throw Error(data.detail||'Search unavailable');
     if(!data.results.length){message.textContent='No matches found. Try another title or year.';return;}
     message.textContent='Select the correct title from '+data.results.length+' results.';
     for(const item of data.results){
       const choice=el('button','tv-match-choice');choice.type='button';
       if(item.poster_url&&/^https:\/\//.test(item.poster_url)){
         const picture=el('img');picture.src=item.poster_url;picture.alt='';picture.loading='lazy';choice.append(picture);
       }
       const text=el('span');text.append(el('strong','',item.title||'Untitled'),el('small','',item.provider+' · '+(item.year||'Year unknown')));
       if(item.overview)text.append(el('small','',item.overview.slice(0,180)));
       choice.append(text);
       choice.onclick=async()=>{
         choice.disabled=true;message.textContent='Saving metadata match…';
         try{
           const target=new URLSearchParams({library_id:String(state.library_id),key:state.key});
           const r=await fetch('/api/tv/match?'+target,{method:'PUT',headers:{'Content-Type':'application/json'},
             body:JSON.stringify({provider:item.provider,provider_id:item.provider_id})});
           const updated=await r.json();if(!r.ok)throw Error(updated.detail||'Could not save match');
           location.reload();
         }catch(error){message.textContent=error.message;choice.disabled=false;}
       };
       results.append(choice);
     }
   }catch(error){message.textContent=error.message;}
   finally{search.disabled=false;}
 }
 form.onsubmit=searchMatches;
 dialog.append(head,description,form,message,results,restore);
 document.body.append(dialog);
 dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
 dialog.addEventListener('close',()=>dialog.remove());
 dialog.addEventListener('keydown',event=>{
   if(!['ArrowDown','ArrowUp'].includes(event.key)||event.target===input)return;
   const candidates=[input,search,...results.querySelectorAll('button'),restore,close];
   const pos=candidates.indexOf(document.activeElement);
   candidates[(pos+(event.key==='ArrowDown'?1:-1)+candidates.length)%candidates.length]?.focus();
   event.preventDefault();
 });
 dialog.showModal();input.focus();searchMatches();
}

function bulkWatchedControl(data,scope){

   ?data.watched_count===data.episode_count
   :data.season.watched_count===data.season.episode_count;
 const updateLabel=watched=>{
   button.title=watched?'Mark all unwatched':'Mark all watched';
   button.setAttribute('aria-label',button.title);
   updateWatchIcon(button,watched,scope==='show'?'series':'season');
 };
 updateLabel(allWatched);
 button.onclick=async()=>{
   button.disabled=true;
   const watched=button.getAttribute('aria-pressed')!=='true';
   try{
     const q=new URLSearchParams({library_id:String(state.library_id),key:state.key});
     if(scope==='season')q.set('season_number',String(state.season_number));
     const r=await fetch('/api/tv/'+scope+'/watched?'+q,{
       method:'PUT',headers:{'Content-Type':'application/json'},

     if(!r.ok)throw Error('Cannot update watched status');
     updateLabel(watched);
     if(scope==='show')data.watched_count=watched?data.episode_count:0;
     else data.season.watched_count=watched?data.season.episode_count:0;
     const note=el('span','muted',watched?'All marked watched':'All marked unwatched');
     button.after(note);setTimeout(()=>note.remove(),2500);
     if(scope==='season')view.querySelectorAll('.episode-actions button[aria-pressed]').forEach(control=>{
        control.setAttribute('aria-pressed',String(watched));
        updateWatchIcon(control,watched);
     });
   }catch(err){loading.textContent=err.message}
   finally{button.disabled=false}
 };

}

 }
 if(Number(data.rating)>0)facts.append(el('span','series-fact-chip',
   'TMDB '+Number(data.rating).toFixed(1)+'/10'));
 if(data.imdb_id&&/^tt[0-9]{7,9}$/.test(data.imdb_id)){
   const link=el('a','series-fact-chip',
     data.imdb_rating>0?'IMDb ★ '+Number(data.imdb_rating).toFixed(1)+'/10':'IMDb');
   link.href='https://www.imdb.com/title/'+data.imdb_id+'/';
   link.target='_blank';link.rel='noopener noreferrer';
   link.title=data.imdb_rating>0?'IMDb rating':'View IMDb rating';
   facts.append(link);
 }else{
   facts.append(el('span','series-fact-chip','IMDb unavailable'));
 }
 if(data.network)facts.append(el('span','series-fact-chip',data.network));
 if(Array.isArray(data.genres)&&data.genres.length)
   facts.append(el('span','series-fact-chip',data.genres.join(' · ')));
 controls.append(actions,facts);
 return controls;
}
async function renderShow(){
 if(!Number.isInteger(state.library_id)||!state.library_id||!state.key)throw Error('Select a TV show from the library.');
 const data=await loadJson('/api/tv/show?'+new URLSearchParams({library_id:state.library_id,key:state.key}));
 document.title=data.title+' · One-Eyed Willie';
 state.show_title=data.title;
 const showHero=hero(data.title,data.overview,data.poster_url,data.backdrop_url,data.year,'TV SERIES');
 showHero.append(seriesControls(data));
 view.append(showHero);
 const heading=el('div','section-heading');heading.append(el('h2','','Seasons'),el('span','',data.seasons.length+' available'));
 view.appendChild(heading);
 const grid=el('div','season-grid');
 for(const season of data.seasons){
  if(season.number===null)continue;
  grid.appendChild(coverCard(season,season.name,season.watched_count+' / '+season.episode_count+' watched',
    seasonHref(data.library_id,data.key,season.number)));
 }
 view.appendChild(grid);
 view.append(showExtras(data,{includeFacts:false}));
 if(data.seasons.some(s=>s.number===null)){
   const note=el('p','muted','Some files do not have season and episode numbers in their filenames, so they could not be assigned to a season.');
   view.appendChild(note);
 }
 if(data.metadata_source==='TVmaze')view.appendChild(credit(data));
 if(!data.metadata_available)view.appendChild(notice());
}
async function renderSeason(){
  if(!Number.isInteger(state.season_number)||state.season_number<0||!state.key||!state.library_id)
    throw Error('Choose a season from the show page.');
  const data=await loadJson('/api/tv/season?'+new URLSearchParams({
    library_id:state.library_id,key:state.key,season_number:state.season_number
  }));
  document.body.classList.add('tv-season-mode');
  document.title=data.season.name+' · '+data.show.title+' · One-Eyed Willie';
  state.show_title=data.show.title;
  const available=(data.episodes||[]).slice().sort((a,b)=>(a.episode??1e5)-(b.episode??1e5));
  if(!available.length){
    view.append(el('h1','',data.show.title),el('p','muted','No local episodes were found in this season.'));
    return;
  }
  // Open at the first episode that still needs watching, not the end of the list.
  let selected=available.find(episode=>!episode.watched)||available[0];
  const allCards=new Map(),formatCache=new Map();
  const cinema=el('section','tv-season-cinema');
  const backdrop=image('','season-backdrop','');
  backdrop.hidden=true;backdrop.loading='eager';cinema.append(backdrop);
  const tabs=el('nav','season-tabs');tabs.id='season-tabs';tabs.setAttribute('aria-label','Show and seasons');
  const showLink=el('a','','Show');showLink.href=showHref(data.show.library_id,data.show.key);
  tabs.append(showLink);
  for(const season of data.seasons||[]){
    if(season.number==null)continue;
    const link=el('a','',season.number===0?'Specials':'Season '+season.number);
    link.href=seasonHref(data.show.library_id,data.show.key,season.number);
    if(season.number===state.season_number)link.setAttribute('aria-current','page');
    tabs.append(link);
  }
  const tabsRail=setupSeasonRail(tabs,'seasons');cinema.append(tabsRail.shell);
  const copy=el('div','season-hero-copy');
  const showName=el('h1','season-show-name',data.show.title);
  const epTitle=el('h2','season-episode-title');
  const epMeta=el('div','season-episode-meta');
  const epOverview=el('p','season-episode-summary');
  copy.append(showName,epTitle,epMeta,epOverview);
  cinema.append(copy);view.append(cinema);
  const track=el('div','season-episode-track');track.id='season-episodes';
  track.setAttribute('aria-label','Episodes in '+data.season.name);
  const episodeRail=setupSeasonRail(track,'episodes');
  const actions=el('div','season-actions-row');
  const support=el('div','season-support');
  view.append(episodeRail.shell,actions,support);
  let activeEpisodeMenu=null;
  const selectEpisode=episode=>{
    activeEpisodeMenu?.close(false);
    const previousButton=allCards.get(selected?.id);
    if(previousButton&&selected.id!==episode.id){
      previousButton.classList.remove('is-selected');
      previousButton.setAttribute('aria-pressed','false');
      previousButton.querySelector('.season-video-quality')?.remove();
    }
    selected=episode;
    const activeButton=allCards.get(episode.id);
    activeButton?.classList.add('is-selected');
    activeButton?.setAttribute('aria-pressed','true');
    const picture=episode.still_url||data.show.backdrop_url;
    if(typeof picture==='string'&&picture.startsWith('/api/artwork/')){
      backdrop.src=picture;backdrop.hidden=false;
    }else{backdrop.removeAttribute('src');backdrop.hidden=true}
    epTitle.textContent=episode.title||(episode.episode?'Episode '+episode.episode:'Episode');
    const fields=[
      (episode.season!=null&&episode.episode!=null)
        ?'S'+String(episode.season).padStart(2,'0')+' · E'+String(episode.episode).padStart(2,'0'):null,
      episode.air_date||null,episode.runtime?episode.runtime+' min':null
    ];
    // TV classifications (TV-MA, TV-14...) belong with duration, not below the thumbnails.
    if(data.show.content_rating)fields.push(data.show.content_rating);
    epMeta.replaceChildren(...fields.filter(Boolean).map(value=>
      el('span',value===data.show.content_rating?'season-parental-inline':'',value)));
    epOverview.textContent=episode.overview||data.season.overview||'No description available.';
    const renderFormat=details=>{
      if(selected.id!==episode.id)return;
      const tile=allCards.get(episode.id);
      tile?.querySelector('.season-video-quality')?.remove();
      const labels=[details?.resolution,details?.hdr].filter(Boolean);
      if(!tile||!labels.length)return;
      const badges=el('span','season-video-quality');
      badges.setAttribute('aria-label','Video quality: '+labels.join(', '));
      for(const label of labels)badges.append(el('span','',label));
      tile.append(badges);
    };
    if(formatCache.has(episode.id))renderFormat(formatCache.get(episode.id));
    else{
      loadJson('/api/tv/episode?'+new URLSearchParams({media_id:episode.id}))
        .then(details=>{formatCache.set(episode.id,details.video_format||{});renderFormat(details.video_format||{});})
        .catch(()=>{formatCache.set(episode.id,{})});
    }
    actions.replaceChildren();
    const play=playbackButton(episode.id,data.show.title+' · '+epTitle.textContent);
    play.id='season-play-button';
    actions.append(play);
    if(canResume(episode)){
      const resume=playbackButton(episode.id,data.show.title+' · '+epTitle.textContent,true);
      resume.id='season-resume-button';actions.append(resume);
    }
    actions.append(trailerButton(data.show.trailer_key,data.show.title));
    const more=el('button','media-icon-action season-more-button');
    more.type='button';more.title='Episode and season options';
    more.setAttribute('aria-label','Episode and season options');
    more.setAttribute('aria-haspopup','dialog');
    more.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
    more.setAttribute('aria-haspopup','menu');
    more.setAttribute('aria-expanded','false');
    more.onclick=()=>{
      if(activeEpisodeMenu){activeEpisodeMenu.close();return}
      const menu=el('div','season-more-popover');
      menu.setAttribute('role','menu');
      menu.setAttribute('aria-label','Episode and season options');
      menu.id='season-actions-menu';
      more.setAttribute('aria-controls',menu.id);
      more.setAttribute('aria-expanded','true');
      const closeMenu=(restore=true)=>{
        if(!menu.isConnected)return;
        menu.remove();
        document.removeEventListener('pointerdown',outside,true);
        document.removeEventListener('keydown',keys,true);
        window.removeEventListener('scroll',onScroll,true);
        activeEpisodeMenu=null;
        more.setAttribute('aria-expanded','false');
        if(restore&&more.isConnected)more.focus({preventScroll:true});
      };
      const outside=event=>{
        if(!menu.contains(event.target)&&!more.contains(event.target))closeMenu(false);
      };
      const onScroll=event=>{
        if(event.target instanceof Node&&menu.contains(event.target))return;
        closeMenu(false);
      };
      const keys=event=>{
        if(!menu.contains(document.activeElement))return;
        if(['Escape','Backspace','BrowserBack','GoBack'].includes(event.key)){
          event.preventDefault();event.stopImmediatePropagation();closeMenu();return;
        }
        if(!['ArrowDown','ArrowUp'].includes(event.key))return;
        event.preventDefault();event.stopImmediatePropagation();
        const buttons=[...menu.querySelectorAll('[role="menuitem"]')];
        const i=buttons.indexOf(document.activeElement);
        const next=Math.max(0,Math.min(buttons.length-1,
          i+(event.key==='ArrowDown'?1:-1)));
        buttons[next]?.focus({preventScroll:true});
      };
      const option=(label,run)=>{
        const button=el('button','season-overflow-item',label);
        button.type='button';button.setAttribute('role','menuitem');
        button.onclick=async()=>{
          closeMenu(false);
          try{await run()}catch(error){loading.textContent=error.message}
          finally{
            if(!document.querySelector('dialog[open],.willie-player'))
              document.getElementById('season-play-button')?.focus({preventScroll:true});
          }
        };
        menu.append(button);
      };
      option(episode.watched?'Mark episode unwatched':'Mark episode watched',async()=>{
        const response=await fetch('/api/watch/'+episode.id+'/watched',{
          method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({watched:!episode.watched})
        });
        if(!response.ok)throw Error('Could not update episode watched status');
        episode.watched=!episode.watched;
        syncEpisodeWatchedBadge(allCards.get(episode.id),episode.watched);
        selectEpisode(episode);
      });
      option(available.every(e=>e.watched)?'Mark season unwatched':'Mark season watched',async()=>{
        const watched=!available.every(e=>e.watched);
        const q=new URLSearchParams({library_id:data.show.library_id,key:data.show.key,
          season_number:state.season_number});
        const response=await fetch('/api/tv/season/watched?'+q,{
          method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({watched})
        });
        if(!response.ok)throw Error('Could not update season watched status');
        for(const ep of available){
          ep.watched=watched;
          syncEpisodeWatchedBadge(allCards.get(ep.id),watched);
        }
        selectEpisode(selected);
      });
      option('Fix match',()=>openMatchDialog());
      option('Shuffle season',()=>{
        if(typeof window.WilliePlayer?.shuffleSeason!=='function')
          throw Error('Shuffle playback is not ready. Reload the page and try again.');
        WilliePlayer.shuffleSeason(available.map(ep=>({
          id:ep.id,title:data.show.title+' · '+(ep.title||'Episode '+ep.episode),
          resume:canResume(ep)
        })));
      });
      document.body.append(menu);
      const rect=more.getBoundingClientRect();
      menu.style.left=Math.max(8,Math.min(innerWidth-menu.offsetWidth-8,rect.left))+'px';
      menu.style.top=(rect.bottom+menu.offsetHeight+8<=innerHeight
        ?rect.bottom+4:Math.max(8,rect.top-menu.offsetHeight-4))+'px';
      activeEpisodeMenu={close:closeMenu};
      document.addEventListener('pointerdown',outside,true);
      document.addEventListener('keydown',keys,true);
      window.addEventListener('scroll',onScroll,true);
      menu.querySelector('[role="menuitem"]')?.focus({preventScroll:true});
    };
    actions.append(more);
    const facts=el('div','season-action-facts');
    const score=data.show.rotten_tomatoes;
    if(Number.isInteger(score)&&score>=0&&score<=100){
      const rt=el('span','season-fact','RT '+score+'%');
      rt.title='Rotten Tomatoes critic score';facts.append(rt);
    }
    if(Number(data.show.rating)>0){
      const tmdb=el('span','season-fact','TMDB '+Number(data.show.rating).toFixed(1)+'/10');
      tmdb.title='TMDB community rating';facts.append(tmdb);
    }
    if(data.show.network)facts.append(el('span','season-fact',data.show.network));
    if(Array.isArray(data.show.genres)&&data.show.genres.length)
      facts.append(el('span','season-fact',data.show.genres.join(' · ')));
    actions.append(facts);
  };
  for(const episode of available){
    const button=el('button','season-episode-tile');button.type='button';
    button.title=(episode.episode!=null?'Episode '+episode.episode+' · ':'')+episode.title;
    if(episode.still_url?.startsWith('/api/artwork/'))
      button.append(image(episode.still_url,'','Episode '+episode.episode+' still'));
    else button.append(el('div','season-tile-placeholder',data.show.title));
    button.append(el('span','season-episode-chip',episode.episode!=null?'E'+episode.episode:'EP'));
    syncEpisodeWatchedBadge(button,episode.watched);
    // Merely moving focus changes the hero selection; only OK/click plays.
    button.addEventListener('focus',()=>selectEpisode(episode));
    button.onclick=()=>WilliePlayer.open(episode.id,
      data.show.title+' · '+(episode.title||'Episode '+(episode.episode??'')),
      {restart:!canResume(episode)});
    const action=canResume(episode)?'Resume':'Play';
    button.setAttribute('aria-label',action+' episode '+(episode.episode??'')+', '+(episode.title||'')+
      (episode.watched?' (watched)':''));
    button.setAttribute('aria-pressed','false');
    allCards.set(episode.id,button);track.append(button);
  }
  selectEpisode(selected);
  // Web keyboard parity: Down from any episode always targets Play.
  track.addEventListener('keydown',event=>{
    if(event.key!=='ArrowDown')return;
    const episodeTile=document.activeElement?.closest('.season-episode-tile');
    if(!episodeTile)return;
    const play=document.getElementById('season-play-button');
    if(play){event.preventDefault();play.focus();}
  });
  actions.addEventListener('keydown',event=>{
    if(event.key!=='ArrowUp'||document.activeElement?.id!=='season-play-button')return;
    const episodeTile=allCards.get(selected.id);
    if(episodeTile){
      event.preventDefault();episodeTile.focus({preventScroll:true});
      revealRailItem(track,episodeTile);
    }
  });
  const selectedTile=allCards.get(selected.id);
  if(selectedTile)revealRailItem(track,selectedTile);
  const currentTab=tabs.querySelector('[aria-current="page"]');
  if(currentTab)revealRailItem(tabs,currentTab);
  tabsRail.update();episodeRail.update();
  // Refresh watched flags and resume positions when the player closes or
  // Android TV returns from its native playback activity.
  const refreshEpisodeProgress=async()=>{
    try{
      const updated=await loadJson('/api/tv/season?'+new URLSearchParams({
        library_id:state.library_id,key:state.key,season_number:state.season_number
      }));
      const byId=new Map((updated.episodes||[]).map(episode=>[episode.id,episode]));
      for(const episode of available){
        const fresh=byId.get(episode.id);
        if(!fresh)continue;
        episode.watched=fresh.watched;
        episode.position_seconds=fresh.position_seconds;
        episode.duration_seconds=fresh.duration_seconds;
        syncEpisodeWatchedBadge(allCards.get(episode.id),episode.watched);
      }
      selectEpisode(selected);
    }catch(_){/* Keep the last usable state if the server is temporarily unavailable. */}
  };
  document.addEventListener('willie:watch-updated',refreshEpisodeProgress);
  // Reuse the show's existing cast/crew, metadata and review source.
  // Playback and episode selection stay usable if enrichment is unavailable.
  try{
    const show=await loadJson('/api/tv/show?'+new URLSearchParams({
      library_id:data.show.library_id,key:data.show.key
    }));
    const extras=showExtras({...show,title:data.show.title+' Season '+state.season_number},{includeFacts:false});
    extras.querySelectorAll('h2').forEach(h=>{
      if(h.textContent==='Cast')h.textContent='Cast & Crew';
    });
    support.append(extras);
  }catch(_){
    if(!data.metadata_available)support.append(notice());
  }
  if(!data.metadata_available&&!support.querySelector('.metadata-notice'))support.append(notice());
}
// Old episode-detail URLs return to the containing season, preserving bookmarks.
async function redirectLegacyEpisode(){
 if(!Number.isInteger(state.media_id)||state.media_id<1)throw Error('Choose an episode from its season.');
 const data=await loadJson('/api/tv/episode?'+new URLSearchParams({media_id:state.media_id}));
 location.replace(data.season_number===null
   ?showHref(data.library_id,data.key)
   :seasonHref(data.library_id,data.key,data.season_number));
}
(async()=>{
 try{
  if(route==='show')await renderShow();
  else if(route==='season')await renderSeason();
  else await redirectLegacyEpisode();
  loading.textContent='';
 }catch(error){loading.textContent=error.message;}
})();
</script>
