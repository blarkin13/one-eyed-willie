<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03060b">
<title>Watch · One-Eyed Willie</title>
<link rel="icon" type="image/png" sizes="128x128" href="/assets/favicon.png?v=5">
<script defer src="/assets/player.js?v=progress-1"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03060b;color:#e6edf5;font:16px system-ui,-apple-system,sans-serif}
main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:18px}
img{width:65px;height:65px;object-fit:contain}
button{padding:17px 36px;border:1px solid #6888ae;border-radius:14px;background:#274260;color:#fff;font:700 1.1rem system-ui;cursor:pointer}
button:hover{background:#355b81}p{max-width:540px;color:#a7b9ce;text-align:center;line-height:1.5}
</style></head><body>
<main><img src="/assets/favicon.png" alt=""><h1>One-Eyed Willie</h1>
<button id="launch" type="button">Play fullscreen</button>
<p>Press Play to open your movie or episode. If your browser blocks fullscreen, the immersive player still fills the window. Press Esc to exit.</p>
</main>
<script>
const id=Number(location.pathname.split('/').pop());
document.getElementById('launch').addEventListener('click',()=>{
  if(!Number.isInteger(id)||id<=0)return;
  window.WilliePlayer.open(id,'Now Playing',{restart:new URLSearchParams(location.search).get('restart')==='1'});
});
</script></body></html>
