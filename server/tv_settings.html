<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Playback Settings · One-Eyed Willie</title>
<link rel="stylesheet" href="/assets/ui.css?v=tv-playback-1">
<script defer src="/assets/shell.js?v=tv-playback-1"></script>
<style>
/* Compact TV settings: settings-only layout; normal player/library focus is unchanged. */
.tv-playback-settings{max-width:870px;padding-bottom:58px}
.tv-playback-settings .page-head{margin-bottom:14px}
.tv-playback-settings #tv-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.tv-playback-settings .page-head h1{font-size:clamp(1.55rem,3vw,2.05rem);line-height:1.1}
.tv-playback-settings .settings-section{margin:0 0 13px}
.tv-playback-settings .settings-section h2{font-size:1.04rem;letter-spacing:.01em;
 margin:0 0 7px;color:#ecf2fa}
.tv-playback-settings .settings-card{margin:0;max-width:none;padding:13px 16px;
 border:1px solid #2c4259;border-radius:13px;
 background:linear-gradient(125deg,#142131f2,#101b2af2);
 box-shadow:0 5px 20px #0002}
.tv-playback-settings .settings-card p{font-size:.79rem;line-height:1.35;margin:5px 0 9px}
.tv-playback-settings .settings-card label:not(.setting-toggle){
 display:block;font-size:.78rem;color:#b8c8da;margin:0 0 4px;font-weight:600}
.tv-playback-settings .settings-card .setting-toggle{display:flex;align-items:center;
 gap:10px;padding:8px 12px;min-height:43px;border:1px solid transparent;
 background:#18283a;border-radius:8px;margin:0 0 6px;
 font-size:.88rem;color:#ebf0f5}
.tv-playback-settings .settings-card .setting-toggle input[type="checkbox"]{
 width:19px;height:19px;flex:none;accent-color:var(--oew-tv-select-color,#A61E1E)}
.tv-playback-settings .settings-two-col{display:grid;
 grid-template-columns:minmax(0,1fr);gap:5px;margin:5px 0}
.tv-playback-settings .settings-two-col>div{display:grid;align-items:center;
 grid-template-columns:minmax(0,1fr) minmax(180px,42%);gap:12px;min-width:0}
.tv-playback-settings .settings-two-col>div label{margin:0!important}
.tv-playback-settings .tv-inline-setting{display:grid;align-items:center;
 grid-template-columns:minmax(0,1fr) minmax(180px,42%);gap:12px;margin:6px 0}
.tv-playback-settings .tv-inline-setting label{margin:0!important}
.tv-playback-settings .settings-card button.secondary-button,
.tv-playback-settings .settings-card button.primary-button{
 min-height:39px;min-width:0;max-width:100%;padding:7px 12px;
 border-radius:8px;text-align:left;font-size:.87rem;
 color:#ecf2f9;background:#1a2a3d;border:1px solid #3d536b}
.tv-playback-settings .settings-two-col button{width:100%}
.tv-playback-settings input[type="range"]{min-height:35px;width:100%;accent-color:var(--oew-tv-select-color,#A61E1E)}
.tv-playback-settings .tv-volume-row{display:grid;align-items:center;
 grid-template-columns:minmax(0,1fr) minmax(180px,42%);gap:12px;margin:8px 0}
.tv-playback-settings .tv-volume-row label{margin:0!important}
.tv-playback-settings .form-actions{margin:7px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.tv-playback-settings .settings-card .form-actions button{min-width:110px}
.tv-playback-settings .tv-save-status{margin:5px 0 0!important;
 color:#b3dec7!important;font-size:.76rem;line-height:1.25;font-weight:600}
.tv-playback-settings .tv-save-status:empty{display:none}
.tv-playback-settings .tv-save-status[data-state="error"]{color:#ffc0b7!important}
.tv-playback-settings dialog{background:#101d2bf7;color:#f2f5fa;
 border:1px solid #53657e;border-radius:13px;
 box-shadow:0 22px 70px #000b;padding:18px;
 max-height:82vh;overflow:auto;width:min(440px,90vw)}
.tv-playback-settings dialog::backdrop{background:#000b}
.tv-playback-settings .tv-language-options{display:grid;gap:5px;margin:11px 0}
.tv-playback-settings .tv-language-options button{
 min-height:42px;padding:8px 13px;border-radius:8px;text-align:left;
 color:#ecf2fa;background:#1b2b3e;border:1px solid #354b64}
.tv-playback-settings .tv-language-options button[aria-pressed="true"]{
 border-color:var(--oew-tv-select-color,#A61E1E);font-weight:700}
html body[data-page="settings"] .tv-playback-settings
 :is(button,input[type="range"],input[type="checkbox"]):is(:focus,:focus-visible){
 color:#fff!important;filter:none!important;transform:none!important;
 outline:3px solid var(--oew-tv-select-color,#A61E1E)!important;
 outline-offset:2px!important;box-shadow:0 0 0 3px #07101c!important;
 border-color:var(--oew-tv-select-color,#A61E1E)!important;
 background-color:#263d58!important;position:relative;z-index:3}
html body[data-page="settings"] .tv-playback-settings .setting-toggle:focus-within{
 outline:3px solid var(--oew-tv-select-color,#A61E1E)!important;
 outline-offset:1px!important;background:#263c57!important;color:#fff!important}
html body[data-page="settings"] .tv-playback-settings
 .setting-toggle input:is(:focus,:focus-visible){
 outline:0!important;box-shadow:none!important;background:transparent!important}
.tv-save-toast{position:fixed;bottom:18px;right:20px;z-index:230;
 max-width:min(440px,85vw);pointer-events:none;
 padding:10px 15px;border-radius:10px;
 border:1px solid var(--oew-tv-select-color,#A61E1E);
 background:#0a1828f5;box-shadow:0 9px 25px #0009;
 color:#f4faf8;font-size:.88rem;font-weight:650}
.tv-save-toast[data-state="error"]{border-color:#f87171}
.tv-save-toast[hidden]{display:none!important}
@media(max-width:680px){
 .tv-playback-settings .settings-card{padding:11px}
 .tv-playback-settings .settings-two-col>div,
 .tv-playback-settings .tv-inline-setting,.tv-playback-settings .tv-volume-row{
 grid-template-columns:minmax(0,1fr);gap:4px}
 .tv-playback-settings .settings-card button.secondary-button{width:100%}
}
@media(prefers-reduced-motion:no-preference){
 .tv-playback-settings :is(button,.setting-toggle){
 transition:background-color .15s ease,border-color .15s ease,outline-color .15s ease}}
</style>
<script defer src="/assets/ambient.js?v=1"></script>
</head><body data-page="settings"><div class="app-shell">
<aside class="sidebar" id="app-nav" aria-label="Sidebar"></aside>
<div class="workspace"><main class="content tv-playback-settings">
<div class="page-head"><div>
<h1>Settings</h1>
</div></div>
<p id="tv-status" class="message" role="status" aria-live="polite"></p>
<div id="tv-save-toast" class="tv-save-toast" role="status" aria-live="polite" hidden></div>
<section class="settings-section" aria-labelledby="tv-subtitles-heading">
<h2 id="tv-subtitles-heading">Subtitles</h2>
<div class="settings-card"><form id="tv-subtitle-form">
<label class="setting-toggle"><input type="checkbox" id="tv-subtitles-on">
 Auto-show subtitles</label>
<div class="tv-inline-setting"><label for="tv-language-button">Language</label>
<input type="hidden" id="tv-subtitle-language" value="en">
<button type="button" class="secondary-button" id="tv-language-button" aria-haspopup="dialog" aria-controls="tv-language-dialog">English</button></div>
<dialog id="tv-language-dialog" aria-labelledby="tv-language-heading">
<h2 id="tv-language-heading">Preferred subtitle language</h2>
<div id="tv-language-options" class="tv-language-options"></div>
<button type="button" class="secondary-button" id="tv-language-cancel">Cancel</button>
</dialog>

<div class="settings-two-col" id="tv-caption-style">
  <div><label for="tv-subtitle-background">Subtitle background</label>
  <button type="button" class="secondary-button" id="tv-subtitle-background">None (transparent)</button></div>
  <div><label for="tv-subtitle-size">Text size</label>
  <button type="button" class="secondary-button" id="tv-subtitle-size">Normal</button></div>
  <div><label for="tv-subtitle-color">Text color</label>
  <button type="button" class="secondary-button" id="tv-subtitle-color">White</button></div>
  <div><label for="tv-subtitle-outline">Text outline</label>
  <button type="button" class="secondary-button" id="tv-subtitle-outline">On</button></div>
</div>
<p class="tv-save-status" id="tv-subtitle-status" role="status" aria-live="polite"></p>
</form></div></section>
<section class="settings-section" aria-labelledby="tv-color-heading">
<h2 id="tv-color-heading">Highlight color</h2>
<div class="settings-card">
<form id="tv-color-form">
<div class="tv-inline-setting"><label for="tv-color-button">Focus color · shared with all TVs</label>
<input type="hidden" id="tv-selected-color" value="#A61E1E">
<button type="button" id="tv-color-button" class="secondary-button" aria-haspopup="dialog" aria-controls="tv-color-dialog">Crimson red (default)</button></div>
<dialog id="tv-color-dialog" aria-labelledby="tv-color-dialog-heading">
<h2 id="tv-color-dialog-heading">Select a color</h2>
<div id="tv-color-options" class="tv-language-options"></div>
<button type="button" id="tv-color-cancel" class="secondary-button">Cancel</button>
</dialog>
<p class="tv-save-status" id="tv-color-status" role="status" aria-live="polite"></p>
</form>
</div></section>
<section class="settings-section" aria-labelledby="tv-shared-heading"><h2 id="tv-shared-heading">Playback</h2>
<div class="settings-card"><form id="tv-playback-form">
<label class="setting-toggle"><input id="tv-auto-next" type="checkbox"> Auto-play next episode</label>
<label class="setting-toggle"><input id="tv-show-theme" type="checkbox"> TV show themes</label>
<label class="setting-toggle"><input id="tv-movie-theme" type="checkbox"> Movie themes</label>
<label class="setting-toggle"><input id="tv-loop-theme" type="checkbox"> Loop themes</label>
<label class="setting-toggle"><input id="tv-fade-theme" type="checkbox"> Fade themes in/out</label>
<div class="tv-volume-row"><label for="tv-theme-volume">Theme volume: <output id="tv-theme-volume-label">25%</output></label>
<input id="tv-theme-volume" type="range" min="0" max="100" step="5" value="25"></div>
<p class="tv-save-status" id="tv-playback-status" role="status" aria-live="polite"></p>
</form></div></section>
<section class="settings-section" aria-labelledby="tv-ambient-heading">
<h2 id="tv-ambient-heading">Ambient effects</h2>
<div class="settings-card"><form id="tv-ambient-form">
<div class="settings-two-col">
 <div><label for="tv-ambient-effect">Effect</label>
 <button type="button" class="secondary-button" id="tv-ambient-effect">Off (default)</button></div>
</div>
<div class="tv-volume-row"><label for="tv-ambient-intensity">Intensity: <output id="tv-ambient-intensity-label">10%</output></label>
<input id="tv-ambient-intensity" type="range" min="10" max="100" step="5" value="10"></div>
<div class="settings-two-col">
 <div><label for="tv-ambient-speed">Speed</label>
 <button type="button" class="secondary-button" id="tv-ambient-speed">Normal</button></div>
 <div><label for="tv-ambient-layer">Position</label>
 <button type="button" class="secondary-button" id="tv-ambient-layer">Over interface</button></div>
</div>
<div class="form-actions"><button type="button" id="tv-ambient-off" class="secondary-button">Turn off effects</button></div>
<p class="tv-save-status" id="tv-ambient-status" role="status" aria-live="polite"></p>
</form></div></section>
<section class="settings-section" aria-labelledby="tv-connection-heading"><h2 id="tv-connection-heading">Connection</h2>
<div class="settings-card">
<button type="button" id="tv-server-connection" class="secondary-button">Change server connection</button>
</div></section>
</main></div></div>
<script>
const el=id=>document.getElementById(id);
let tvToastTimer=null;
function message(text,section='',state=''){
 const status=el('tv-status');
 status.textContent=text;
 const kind=state||(/could not|unavailable|failed|unable|error/i.test(text)?'error':
   /saving|loading/i.test(text)?'saving':'success');
 const local=section?el('tv-'+section+'-status'):null;
 if(local){local.textContent=text;local.dataset.state=kind;}
 const toast=el('tv-save-toast');
 toast.textContent=(kind==='success'?'✓  ':'')+text;
 toast.dataset.state=kind;
 toast.hidden=false;
 clearTimeout(tvToastTimer);
 // Failures stay readable longer; the latest status also remains in its card.
 tvToastTimer=setTimeout(()=>{toast.hidden=true},kind==='error'?8500:4500);
}
async function api(path,options={}){
 const r=await fetch(path,{cache:'no-store',...options,
  headers:{'Content-Type':'application/json',...(options.headers||{})}});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(data.detail||'Request failed');
 return data;
}
function devicePrompt(action,payload=''){
 const reply=prompt('oewtv:subtitles:'+action,payload);
 if(reply===null)throw Error('TV subtitle preferences unavailable');
 return reply;
}
const tvLanguages=[
 ['en','English'],['es','Spanish'],['fr','French'],['de','German'],
 ['it','Italian'],['pt','Portuguese'],['ja','Japanese'],['ko','Korean']
];
const langDialog=el('tv-language-dialog'),langButton=el('tv-language-button');
function chooseLanguage(language){
 const pair=tvLanguages.find(row=>row[0]===language)||tvLanguages[0];
 el('tv-subtitle-language').value=pair[0];
 langButton.textContent=pair[1];
 for(const item of el('tv-language-options').querySelectorAll('button'))
  item.setAttribute('aria-pressed',String(item.dataset.lang===pair[0]));
}
for(const [code,label] of tvLanguages){
 const option=document.createElement('button');
 option.type='button';option.textContent=label;option.dataset.lang=code;
 option.addEventListener('click',()=>{
  chooseLanguage(code);
  langDialog.close();
  saveSubtitleOnTv();
 });
 el('tv-language-options').append(option);
}
langButton.onclick=()=>{
 langDialog.showModal();
 (el('tv-language-options').querySelector('[aria-pressed="true"]')||
  el('tv-language-options').querySelector('button'))?.focus();
};
el('tv-language-cancel').onclick=()=>langDialog.close();
langDialog.addEventListener('close',()=>langButton.focus({preventScroll:true}));
const captionStyleChoices={
 background:[['none','None (transparent)'],['25','25% black'],['50','50% black'],['75','75% black'],['100','Solid black']],
 size:[['small','Small'],['normal','Normal'],['large','Large']],
 color:[['white','White'],['yellow','Yellow']],
 outline:[['true','On'],['false','Off']]
};
const captionStyle={background:'none',size:'normal',color:'white',outline:'true'};
function updateCaptionButton(key){
 const choices=captionStyleChoices[key],current=choices.find(pair=>pair[0]===captionStyle[key])||choices[0];
 captionStyle[key]=current[0];
 const button=el('tv-subtitle-'+key);
 button.textContent=current[1];
 button.setAttribute('aria-label',key+' '+current[1]+'. Press OK to change');
}
for(const key of Object.keys(captionStyleChoices)){
 const button=el('tv-subtitle-'+key);
 button.onclick=()=>{
  const choices=captionStyleChoices[key];
  const index=choices.findIndex(pair=>pair[0]===captionStyle[key]);
  captionStyle[key]=choices[(index+1)%choices.length][0];
  updateCaptionButton(key);
  saveSubtitleOnTv();
 };
 updateCaptionButton(key);
}
try{
 const saved=JSON.parse(devicePrompt('get'));
 el('tv-subtitles-on').checked=!!saved.enabled;
 const valid=['en','es','fr','de','it','pt','ja','ko'];
 chooseLanguage(valid.includes(saved.language)?saved.language:'en');
 for(const key of Object.keys(captionStyle)){
  captionStyle[key]=key==='outline'?String(saved.outline!==false):
    String(saved[key]??captionStyle[key]);
  updateCaptionButton(key);
 }
}catch(error){message(error.message)}
function saveSubtitleOnTv(){
 try{
  const settings=JSON.stringify({enabled:el('tv-subtitles-on').checked,
   language:el('tv-subtitle-language').value,
   background:captionStyle.background,size:captionStyle.size,
   color:captionStyle.color,outline:captionStyle.outline==='true'});
  if(devicePrompt('set',settings)!=='ACK')throw Error('Could not save subtitle preferences');
  message('Subtitles saved on this TV.','subtitle');
 }catch(error){message('Could not save subtitles: '+error.message,'subtitle','error')}
}
el('tv-subtitles-on').addEventListener('change',saveSubtitleOnTv);
el('tv-subtitle-form').onsubmit=event=>{
 event.preventDefault();saveSubtitleOnTv();
};
el('tv-theme-volume').oninput=()=>{
 el('tv-theme-volume-label').textContent=el('tv-theme-volume').value+'%';
};
const tvColors=[
 ['#A61E1E','Crimson red (default)'],['#8B5CF6','Purple'],['#3B82F6','Blue'],
 ['#14B8A6','Teal'],['#22C55E','Green'],
 ['#F59E0B','Orange'],['#EC4899','Pink'],
 ['#EF4444','Red'],['#FFFFFF','White']
];
const colorDialog=el('tv-color-dialog'),colorButton=el('tv-color-button');
function chooseColor(value){
 const selected=tvColors.find(item=>item[0]===value)||tvColors[0];
 el('tv-selected-color').value=selected[0];
 colorButton.textContent=selected[1];
 for(const item of el('tv-color-options').querySelectorAll('button')){
  item.setAttribute('aria-pressed',String(item.dataset.color===selected[0]));
 }
}
for(const [code,name] of tvColors){
 const option=document.createElement('button');
 option.type='button';option.dataset.color=code;
 option.style.display='flex';option.style.alignItems='center';option.style.gap='12px';
 const swatch=document.createElement('span');
 swatch.style.cssText='display:inline-block;width:23px;height:23px;flex:none;border-radius:50%;border:1px solid #8b9db2';
 swatch.style.backgroundColor=code;
 const title=document.createElement('span');title.textContent=name;
 option.append(swatch,title);
 option.addEventListener('click',()=>{
  chooseColor(code);colorDialog.close();void saveSelectionColor();
 });
 el('tv-color-options').append(option);
}
colorButton.onclick=()=>{
 colorDialog.showModal();
 (el('tv-color-options').querySelector('[aria-pressed="true"]')||
  el('tv-color-options').querySelector('button'))?.focus();
};
el('tv-color-cancel').onclick=()=>colorDialog.close();
colorDialog.addEventListener('close',()=>colorButton.focus({preventScroll:true}));
api('/api/settings/tv-appearance').then(data=>{
 chooseColor(data.selection_color);
}).catch(error=>message('Could not load selection color: '+error.message));
async function saveSelectionColor(){
 const chosen=el('tv-selected-color').value;
 message('Saving selection color…','color','saving');
 try{
  await api('/api/settings/tv-appearance',{
   method:'PUT',body:JSON.stringify({selection_color:chosen})
  });
  document.documentElement.style.setProperty('--oew-tv-select-color',chosen);
  message('Selection color saved for all TVs.','color');
 }catch(error){message('Could not save selection color: '+error.message,'color','error')}
}
el('tv-color-form').onsubmit=event=>{
 event.preventDefault();void saveSelectionColor();
};
let sharedPlayback=null;
api('/api/settings/playback').then(data=>{
 sharedPlayback=data;
 el('tv-auto-next').checked=!!data.auto_play_next;
 el('tv-show-theme').checked=!!data.tv_theme_music;
 el('tv-movie-theme').checked=!!data.movie_theme_music;
 el('tv-loop-theme').checked=!!data.theme_loop;
 el('tv-fade-theme').checked=!!data.theme_fade;
 el('tv-theme-volume').value=Number.isFinite(data.theme_volume)?data.theme_volume:25;
 el('tv-theme-volume-label').textContent=el('tv-theme-volume').value+'%';
}).catch(error=>message(error.message));
let playbackSaveQueue=Promise.resolve(),playbackSaveVersion=0;
function saveSharedPlayback(){
 if(!sharedPlayback){
  message('Playback settings are not available yet.','playback','error');
  return Promise.resolve();
 }
 const values={
  auto_play_next:el('tv-auto-next').checked,
  tv_theme_music:el('tv-show-theme').checked,
  movie_theme_music:el('tv-movie-theme').checked,
  theme_loop:el('tv-loop-theme').checked,
  theme_fade:el('tv-fade-theme').checked,
  theme_volume:Number(el('tv-theme-volume').value)
 },version=++playbackSaveVersion;
 message('Saving playback settings…','playback','saving');
 // Serialize rapid remote changes to prevent older writes from winning.
 playbackSaveQueue=playbackSaveQueue.catch(()=>{}).then(async()=>{
  const saved=await api('/api/settings/playback',{
   method:'PUT',body:JSON.stringify(values)
  });
  if(version===playbackSaveVersion){
   sharedPlayback=saved;
   message('Playback settings saved for all TVs.','playback');
  }
 }).catch(error=>{
  if(version===playbackSaveVersion)
   message('Could not save playback settings: '+error.message,'playback','error');
 });
 return playbackSaveQueue;
}
for(const id of ['tv-auto-next','tv-show-theme','tv-movie-theme','tv-loop-theme','tv-fade-theme']){
 el(id).addEventListener('change',()=>{void saveSharedPlayback()});
}
el('tv-theme-volume').addEventListener('change',()=>{void saveSharedPlayback()});
el('tv-playback-form').onsubmit=event=>{
 event.preventDefault();void saveSharedPlayback();
};
const ambientChoices={
 effect:[['off','Off (default)'],['snow','Snow'],['rain','Rain'],['leaves','Falling leaves'],['fireflies','Fireflies']],
 speed:[['slow','Slow'],['normal','Normal'],['fast','Fast']],
 layer:[['foreground','Over interface'],['background','Behind interface']]
};
let ambientState={effect:'off',intensity:10,speed:'normal',layer:'foreground'};
let ambientTouched=false,ambientSaveVersion=0,ambientSaveQueue=Promise.resolve();
function saveAmbientOnTv(){
 ambientTouched=true;
 const values={...ambientState},version=++ambientSaveVersion;
 message('Saving ambient effects…','ambient','saving');
 ambientSaveQueue=ambientSaveQueue.catch(()=>{}).then(async()=>{
  const saved=await api('/api/settings/ambient',{
   method:'PUT',body:JSON.stringify(values)
  });
  if(version===ambientSaveVersion){
   window.WillieAmbient?.confirmed(saved);
   message('Ambient effects saved for all TVs.','ambient');
  }
 }).catch(error=>{
  if(version===ambientSaveVersion)
   message('Could not save ambient effects: '+error.message,'ambient','error');
 });
 return ambientSaveQueue;
}
function drawAmbientButtons(){
 for(const [field,choices] of Object.entries(ambientChoices)){
  const row=choices.find(pair=>pair[0]===ambientState[field])||choices[0];
  el('tv-ambient-'+field).textContent=row[1];
  el('tv-ambient-'+field).setAttribute('aria-label',field+': '+row[1]+'. Press OK to change.');
 }
 el('tv-ambient-intensity').value=ambientState.intensity;
 el('tv-ambient-intensity-label').textContent=ambientState.intensity+'%';
 window.WillieAmbient?.preview(ambientState);
}
for(const [field,choices] of Object.entries(ambientChoices)){
 el('tv-ambient-'+field).onclick=()=>{
  const index=choices.findIndex(pair=>pair[0]===ambientState[field]);
  ambientState[field]=choices[(index+1)%choices.length][0];
  drawAmbientButtons();
  saveAmbientOnTv();
 };
}
el('tv-ambient-intensity').oninput=()=>{
 ambientTouched=true;
 ambientState.intensity=Number(el('tv-ambient-intensity').value);
 drawAmbientButtons();
};
el('tv-ambient-intensity').onchange=saveAmbientOnTv;
api('/api/settings/ambient').then(data=>{
 if(ambientTouched)return;
 ambientState={...ambientState,...data};drawAmbientButtons();
 window.WillieAmbient?.confirmed(data);
}).catch(error=>message('Could not load ambient effects: '+error.message));
el('tv-ambient-form').onsubmit=event=>{
 event.preventDefault();
 saveAmbientOnTv();
};
el('tv-ambient-off').onclick=()=>{
