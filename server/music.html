<!doctype html>
<html lang="en"><head>
<link rel="icon" type="image/png" sizes="128x128" href="/assets/favicon.png?v=5">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yarr Media · Music</title>
<link rel="stylesheet" href="/assets/ui.css?v=music-2">
<script src="/assets/library-appearance.js?v=music-2"></script>
<script defer src="/assets/shell.js?v=music-3"></script>
<style>
:root{--accent:var(--oew-tv-select-color,#A61E1E);--accent-hi:color-mix(in srgb,var(--accent) 80%,#fff);--accent-soft:color-mix(in srgb,var(--accent) 55%,#fff)}
/* Masthead: same structure and sizing as Movies/TV (catalog.html). */
.music-main{padding-bottom:max(150px,calc(var(--player-space,0px) + 40px))}
#library-masthead[hidden]{display:none}
.library-head{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-bottom:14px;position:relative;isolation:isolate;z-index:20;padding:14px 8px 10px}
.library-head-top{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;min-width:0;position:relative;z-index:10}
.library-header-art-frame{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.library-header-art{position:absolute;pointer-events:none;left:var(--masthead-x,75%);top:var(--masthead-y,50%);width:min(77%,790px);height:auto;transform:translate(-50%,-50%) scale(var(--masthead-scale,1));opacity:var(--masthead-opacity,.6);user-select:none;object-fit:contain}
.library-header-title{display:flex;align-items:center;gap:20px}
.library-header-icon{color:#d8d8d8;flex:0 0 76px;width:76px;height:76px;display:inline-grid;place-items:center}
.library-header-icon :is(svg,img){width:76px;height:76px;object-fit:contain;display:block}
.library-header-icon .library-fa-icon{display:inline-flex;align-items:center;justify-content:center}
.library-header-icon .library-fa-icon>i{display:none}
.fontawesome-ready .library-header-icon .library-fa-icon>i{display:inline-block}
.fontawesome-ready .library-header-icon .library-fa-icon>.library-fa-fallback{display:none!important}
/* Compact, fixed trivia lines: changing question/answer lengths never
   resize the header or move the grid, on Movies, TV or custom libraries. */
.library-trivia{position:relative;z-index:0;width:100%;max-width:min(100%,1040px);
 display:flex;flex-direction:column;justify-content:flex-start;gap:5px;padding-top:2px}
.library-trivia .trivia-question{margin:0;max-width:100%;height:2.72em;min-height:0;
 flex:none;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;
 -webkit-line-clamp:2;line-clamp:2;
 font-size:clamp(1rem,1.07vw,1.25rem);line-height:1.36;letter-spacing:-.018em;
 font-weight:600;color:#e1eaf5;text-wrap:pretty;overflow-wrap:break-word;
 transition:opacity .35s ease,transform .35s ease}
.library-trivia .trivia-question.is-changing{opacity:0;transform:translateY(5px)}
.library-trivia .trivia-answer{display:flex;align-items:flex-start;gap:10px;
 height:2.8em;min-height:0;flex:none;overflow:hidden;
 font-size:clamp(.94rem,1vw,1.14rem);
 opacity:0;visibility:hidden;transform:translateY(6px);
 transition:opacity .42s ease,transform .42s ease,visibility .42s}
.library-trivia .trivia-answer.revealed{opacity:1;visibility:visible;transform:none}
.trivia-answer-label{font-size:.7rem;line-height:1.5;font-weight:800;letter-spacing:.12em;
 text-transform:uppercase;color:#8ebfe9;flex:none}
.library-trivia .trivia-answer p{margin:0;line-height:1.4;
 font-size:inherit;font-weight:650;color:#b4daf8;min-width:0;
 max-width:890px;overflow-wrap:anywhere;text-wrap:pretty;
 overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;
 -webkit-line-clamp:2;line-clamp:2}
/* Explicitly cover the built-in Movies landing page as well as TV and
   user-created library routes. Keep both boxes the same height through
   rotating trivia and ignore older TV min-height rules. */
body[data-page="movies"] #library-masthead .trivia-question,
body[data-page="tv"] #library-masthead .trivia-question{
 height:2.72em!important;min-height:0!important;max-height:2.72em!important;
}
body[data-page="movies"] #library-masthead .trivia-answer,
body[data-page="tv"] #library-masthead .trivia-answer{
 height:2.8em!important;min-height:0!important;max-height:2.8em!important;
}
@media(min-width:1600px){.library-trivia{max-width:1120px}.library-trivia .trivia-question{font-size:clamp(1.07rem,1.15vw,1.4rem)}.library-trivia .trivia-answer{font-size:clamp(.96rem,1.04vw,1.25rem)}.trivia-answer-label{font-size:.72rem}}
@media(min-width:761px) and (max-width:1200px){.library-trivia .trivia-question{font-size:clamp(1.02rem,1.55vw,1.22rem)}.library-trivia .trivia-answer{font-size:clamp(.94rem,1.32vw,1.1rem)}}
@media(min-width:761px) and (hover:none){.library-trivia .trivia-question{font-size:clamp(1.02rem,1.55vw,1.22rem)}.library-trivia .trivia-answer{font-size:clamp(.94rem,1.32vw,1.1rem)}}
@media(max-width:760px){.library-trivia .trivia-question{font-size:clamp(1.1rem,3.7vw,1.5rem);line-height:1.4}.library-trivia .trivia-answer{font-size:clamp(1rem,3.3vw,1.32rem)}.trivia-answer-label{font-size:.64rem}}
@media(prefers-reduced-motion:reduce){.library-trivia :is(.trivia-question,.trivia-answer){transition:none;transform:none}}

.library-head-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;position:relative;z-index:11}
.library-head-actions .search-box input{width:clamp(185px,19vw,270px)}
.tool{display:grid;place-items:center;position:relative;width:44px;height:44px;border:1px solid #515151;border-radius:11px;background:#232323;color:#e1e1e1;padding:10px;cursor:pointer;flex:none}
.tool svg{width:22px;height:22px}
.tool:hover,.tool:focus-visible,.tool[aria-expanded=true]{background:#3e3e3e;color:#fff;border-color:#9e9e9e}
.tool:disabled{opacity:.45;cursor:default}
.menu-anchor{position:relative}
.tool-menu{position:absolute;z-index:45;right:0;top:calc(100% + 9px);width:240px;padding:7px;background:#1d1d1d;border:1px solid #555555;border-radius:14px;box-shadow:0 18px 45px #000b}
.tool-menu[hidden]{display:none}
.genre-menu{max-height:min(420px,65vh);overflow-y:auto;overscroll-behavior:contain}
.tool-menu button small{color:#9a9a9a;font-weight:600;margin-left:auto;padding-left:10px}
.tool-dot{display:none;position:absolute;width:7px;height:7px;border-radius:50%;right:6px;top:6px;background:var(--accent)}
.tool.is-active{color:#fff;border-color:var(--accent)}
.tool.is-active .tool-dot{display:block}
.tool-menu h4{margin:0;padding:9px 11px 10px;color:#a9a9a9;font-size:.72rem;font-weight:750;text-transform:uppercase;letter-spacing:.09em}
.tool-menu button{display:flex;justify-content:space-between;width:100%;min-height:42px;border:0;border-radius:9px;padding:10px 11px;background:transparent;color:#e1e1e1;text-align:left;font:inherit;font-size:.86rem;cursor:pointer}
.tool-menu button:hover,.tool-menu button:focus-visible{background:#3a3a3a;color:#fff}
.tool-menu button[aria-checked=true]{background:#404040;color:#f4f4f4;font-weight:750}
.tool-menu button[aria-checked=true]::after{content:"✓";color:#d4d4d4}
body[data-page=music] :is(a,button,input,select):focus-visible{outline:3px solid #eaeaea!important;outline-offset:4px}

/* View tabs + section heading */
.music-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.view-tabs{display:inline-flex;padding:4px;gap:4px;background:#1b1b1b;border:1px solid #444444;border-radius:12px}
.view-tabs button{border:0;background:transparent;color:#c9c9c9;font:650 .9rem system-ui;padding:9px 16px;border-radius:9px;cursor:pointer;min-height:40px}
.view-tabs button[aria-selected=true]{background:#464646;color:#fff}
.count-label{color:#a5a5a5;font-size:.88rem}
#status:empty{display:none}

/* Grid: reuses .tile/.cover from ui.css, square covers for music. */
#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,175px),1fr));gap:25px 18px;padding-right:22px}
.music-cover{aspect-ratio:1/1}
.music-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.artist-tile .music-cover{border-radius:50%}
.artist-tile h3,.artist-tile .tile-meta{text-align:center}
.cover-play{position:absolute;right:10px;bottom:10px;z-index:2;width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px #0009;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;cursor:pointer}
.cover-play svg{width:20px;height:20px;margin-left:2px}
.tile:hover .cover-play,.tile:focus-within .cover-play{opacity:1;transform:none}
.artist-tile .cover-play{right:auto;left:50%;bottom:auto;top:50%;width:54px;height:54px;transform:translate(-50%,-50%) scale(.85)}
.artist-tile:hover .cover-play,.artist-tile:focus-within .cover-play{transform:translate(-50%,-50%)}
.alpha-nav{position:fixed;top:50%;right:9px;transform:translateY(-50%);z-index:12;display:flex;flex-direction:column;background:#131313e8;backdrop-filter:blur(12px);padding:5px 3px;border-radius:14px}
.alpha-nav[hidden]{display:none}
.alpha-nav button{background:none;border:0;color:#d1d1d1;min-width:25px;min-height:20px;font-size:11px;font-weight:700;padding:0 2px;cursor:pointer}
.alpha-nav button:disabled{color:#5d5d5d;cursor:default}
.alpha-nav button:not(:disabled):hover{color:#fff;background:#404040;border-radius:5px}

/* Album / artist detail */
.detail{position:relative;isolation:isolate;border-radius:20px;overflow:hidden;padding:30px;margin:4px 0 26px;border:1px solid #3a3a3a}
.detail-bg{position:absolute;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3);opacity:.55}
.detail::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#111111aa,#111111f2)}
.detail-top{display:flex;gap:30px;align-items:flex-end}
.detail-art{width:min(250px,38vw);aspect-ratio:1;border-radius:14px;overflow:hidden;flex:none;background:linear-gradient(155deg,#444444,#212121);box-shadow:0 18px 45px #000a;display:grid;place-items:center;color:#cecece;font-size:4rem}
.detail-art.round{border-radius:50%}
.detail-art img{width:100%;height:100%;object-fit:cover}
.detail-info{min-width:0}
.detail-info .eyebrow{margin:0 0 6px}
.detail-info h1{margin:0;font-size:clamp(1.9rem,4.2vw,3.6rem);line-height:1.05;letter-spacing:-.03em;overflow-wrap:anywhere}
.detail-meta{color:#d1d1d1;margin:12px 0 0;font-size:.95rem}
.detail-meta a{color:#fff;font-weight:700;text-decoration:none}
.detail-meta a:hover{text-decoration:underline}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.detail-bg.fanart{inset:0;filter:none;opacity:.42;background-position:center 25%}
.detail.has-fanart::after{background:linear-gradient(90deg,#0f0f0ff5 0%,#0f0f0fd9 45%,#0f0f0f70 100%),linear-gradient(0deg,#0f0f0f 0%,transparent 40%)}
.detail-sub{color:#d4d4d4;font-size:1.05rem;margin:8px 0 0;font-weight:550}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{font-size:.78rem;font-weight:650;color:#e6e6e6;background:#ffffff14;border:1px solid #ffffff24;border-radius:999px;padding:5px 11px}
.about{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:28px;margin:0 0 30px;padding:22px 26px;border:1px solid #363636;border-radius:16px;background:#171717}
.about h2{margin:0 0 10px;font-size:1.1rem}
.bio{color:#d2d2d2;line-height:1.7;font-size:.95rem;margin:0;white-space:pre-line;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.bio.open{display:block}
.bio-more{background:none;border:0;color:var(--accent-soft);font:700 .86rem system-ui;padding:8px 0 0;cursor:pointer}
.bio-source{color:#949494;font-size:.78rem;margin-top:10px}
.facts{display:grid;gap:12px;align-content:start}
.fact small{display:block;color:#949494;font-size:.72rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.fact span{color:#eaeaea;font-size:.92rem}
.ext-links{display:flex;flex-wrap:wrap;gap:6px}
.ext-links a{font-size:.8rem;color:#e6e6e6;text-decoration:none;border:1px solid #4c4c4c;border-radius:8px;padding:5px 9px}
.ext-links a:hover{background:#2d2d2d;color:#fff}
.artist-logo{max-width:min(340px,70%);max-height:90px;object-fit:contain;object-position:left;display:block;margin:4px 0 2px}
@media(max-width:900px){.about{grid-template-columns:1fr;padding:18px}}
.btn-play{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:750;padding:12px 24px;min-height:46px;cursor:pointer;font-size:.95rem}
.btn-play:hover{background:var(--accent-hi)}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;border:1px solid #6c6c6c;border-radius:999px;background:#151515aa;color:#f1f1f1;font-weight:650;padding:12px 22px;min-height:46px;cursor:pointer;font-size:.95rem}
.btn-ghost:hover{background:#333333}
.btn-play svg,.btn-ghost svg{width:18px;height:18px}
.back-link{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:#cacaca;font:650 .9rem system-ui;padding:6px 0;margin-bottom:12px;cursor:pointer}
.back-link:hover{color:#fff}
.sub-heading{font-size:1.1rem;margin:28px 0 14px}
.top-songs-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-songs-play{background:none;border:1px solid #ffffff40;color:#fff;border-radius:999px;padding:7px 16px;font:600 .9rem system-ui;cursor:pointer;margin-top:14px}
.top-songs-play:hover{background:#ffffff14}

/* Track list */
.tracks{width:100%;border-collapse:collapse}
.tracks th{color:#a0a0a0;font-size:.72rem;font-weight:750;text-transform:uppercase;letter-spacing:.09em;text-align:left;padding:0 12px 10px;border-bottom:1px solid #353535}
.tracks td{padding:0 12px;height:56px;border-bottom:1px solid #24242490;color:#e2e2e2;font-size:.92rem}
.tracks tr.row{cursor:pointer}
.tracks tr.row:hover td,.tracks tr.row:focus-visible td{background:#242424}
.tracks tr.row:focus-visible{outline:2px solid var(--accent-soft);outline-offset:-2px}
.tracks td:first-child{border-radius:9px 0 0 9px}.tracks td:last-child{border-radius:0 9px 9px 0}
.tracks .num{width:46px;color:#a0a0a0;font-variant-numeric:tabular-nums;text-align:center}
.tracks .dur{width:70px;text-align:right;color:#a0a0a0;font-variant-numeric:tabular-nums}
.tracks .t-title{font-weight:650;color:#f5f5f5}
.tracks .t-sub{display:block;font-size:.8rem;color:#a5a5a5;font-weight:500;margin-top:2px}
.tracks .t-cell{display:flex;align-items:center;gap:12px;min-width:0}
.tracks .t-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:#343434}
.tracks .clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tracks td.secondary{color:#b0b0b0}
.tracks tr.playing .t-title,.tracks tr.playing .num{color:var(--accent-soft)}
.tracks .num .play-ico{display:none}
.tracks tr.row:hover .num .n{display:none}.tracks tr.row:hover .num .play-ico{display:inline}
.disc-row td{height:44px;color:#b0b0b0;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;cursor:default}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent-soft);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
@media(prefers-reduced-motion:reduce){.eq i{animation:none;height:10px}}

/* Player */
.player{position:fixed;left:var(--sidebar-width,96px);right:0;bottom:0;z-index:30;background:#101010f2;backdrop-filter:blur(18px);border-top:1px solid #3e3e3e;padding:10px 22px;display:grid;grid-template-columns:minmax(180px,1fr) minmax(320px,2fr) minmax(150px,1fr);align-items:center;gap:20px}
.player[hidden]{display:none}
.now{display:flex;align-items:center;gap:13px;min-width:0}
.now img,.now .ph{width:60px;height:60px;border-radius:8px;object-fit:cover;flex:none;background:#343434;box-shadow:0 4px 14px #0007}
.now-text{min-width:0}
.now-text strong{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-text button{background:none;border:0;padding:0;color:#b8b8b8;font-size:.82rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;text-align:left}
.now-text button:hover{color:#fff;text-decoration:underline}
.center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.controls{display:flex;align-items:center;gap:10px}
.pbtn{background:none;border:0;color:#d5d5d5;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative}
.pbtn svg{width:20px;height:20px}
.pbtn:hover{color:#fff}
.pbtn.on{color:var(--accent-soft)}
.pbtn.on::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--accent-soft)}
.pbtn.main{width:46px;height:46px;background:#f3f6fb;color:#131313}
.pbtn.main:hover{transform:scale(1.05);color:#131313}
.pbtn.main svg{width:20px;height:20px}
.seek-row{display:flex;align-items:center;gap:10px;width:100%}
.seek-row span{color:#a5a5a5;font-size:.75rem;font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
input[type=range].bar{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent-soft) var(--p,0%),#4b4b4b var(--p,0%));cursor:pointer}
input[type=range].bar::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s}
input[type=range].bar:hover::-webkit-slider-thumb,input[type=range].bar:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range].bar::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.right .bar{max-width:120px}
#close-player,#max-player{opacity:.8}#close-player:hover,#max-player:hover{opacity:1}
body.music-tv :is(#close-player,#max-player){display:none}
.now img{cursor:pointer}
#player[hidden]{display:none!important}
/* ---- Full-screen player: big art, details and lyrics ---- */
#player .pf{display:none}
#player.max{inset:0!important;left:0!important;display:flex;flex-direction:column;padding:0;gap:0;border:0;background:#050505;backdrop-filter:none;z-index:2000}
#player.max>.now,#player.max>.right{display:none}
#player.max .pf{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
.pf-bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(48px) saturate(1.2) brightness(.42);transform:scale(1.1);z-index:0;pointer-events:none}
#player.max .center{position:relative;z-index:2;padding:10px 24px calc(22px + env(safe-area-inset-bottom));width:min(720px,100%);align-self:center;box-sizing:border-box}
#player.max .controls{gap:18px}
#player.max .pbtn.main{width:62px;height:62px}#player.max .pbtn.main svg{width:26px;height:26px}
.pf-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 8px}
.pf-top .pbtn{color:#fff}.pf-top .pbtn svg{width:24px;height:24px}
.pf-tabs{display:flex;gap:4px;background:#ffffff14;border-radius:999px;padding:4px}
.pf-tabs button{background:none;border:0;color:#cfcfcf;font:inherit;font-size:.9rem;font-weight:650;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
@media(max-width:380px){.pf-tabs button{padding:7px 10px;font-size:.84rem}}
.pf-tabs button[aria-selected="true"]{background:#fff;color:#111}
.pf-body{position:relative;z-index:1;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);overflow:hidden}
.pf-panel{min-height:0;overflow:auto;padding:12px 24px 8px;scrollbar-width:none}
.pf-panel::-webkit-scrollbar{display:none}
.pf-panel[hidden]{display:none}
.pf-info{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.pf-art{width:min(78vw,42vh,440px);aspect-ratio:1;border-radius:12px;overflow:hidden;background:#2a2a2a;box-shadow:0 18px 60px #000a;margin:6px 0 16px;flex:none}
.pf-art img{width:100%;height:100%;object-fit:cover;display:block}
.pf-title{font-size:1.5rem;font-weight:800;line-height:1.25;color:#fff;margin:0}
.pf-artist{background:none;border:0;padding:0;color:#e2e2e2;font:inherit;font-size:1.05rem;cursor:pointer}
.pf-album{background:none;border:0;padding:0;color:#aeb3b9;font:inherit;font-size:.92rem;cursor:pointer}
.pf-artist:hover,.pf-album:hover{text-decoration:underline;color:#fff}
.pf-facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0 4px;max-width:560px}
.pf-facts span{font-size:.78rem;color:#dfe3e8;background:#ffffff17;border-radius:999px;padding:5px 10px;white-space:nowrap}
.pf-credits{color:#9aa0a6;font-size:.82rem;line-height:1.5;margin:6px 0 0}
.pf-lyrics{max-width:640px;margin:0 auto;padding:8px 0 40vh;font-size:1.35rem;font-weight:700;line-height:1.5}
.pf-lyrics p{margin:0 0 .55em;color:#ffffff66;transition:color .25s}
.pf-lyrics.synced p{cursor:pointer}
.pf-lyrics p.now{color:#fff}
.pf-lyrics.plain{white-space:pre-wrap;color:#eee;font-size:1.1rem;font-weight:600;padding-bottom:40px}
.pf-lyrics .pf-none{color:#aeb3b9;font-size:1rem;font-weight:500;text-align:center;padding-top:20vh}
.pf-lyrics .pf-note{color:#8d939a;font-size:.8rem;font-weight:500;margin-top:18px}
/* Up next: the queue, with remove and drag to reorder. */
.pf-queue{max-width:640px;margin:0 auto;padding:4px 0 24px}
.pf-qhead{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;color:#aeb3b9;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.pf-qhead button{background:none;border:0;color:var(--accent-soft);font:inherit;letter-spacing:0;text-transform:none;font-size:.9rem;cursor:pointer;padding:6px 0}
.pf-qrow{display:flex;align-items:center;gap:12px;padding:7px 6px;border-radius:10px;cursor:pointer;position:relative;background:transparent;touch-action:pan-y}
.pf-qrow:hover{background:#ffffff0d}
.pf-qrow.current{background:#ffffff12}
.pf-qrow.dragging{background:#26282c;box-shadow:0 8px 24px #000a;z-index:2;transition:none}
.pf-qrow img,.pf-qrow .ph{width:46px;height:46px;border-radius:5px;object-fit:cover;flex:none;background:#2a2a2a}
.pf-qtext{flex:1;min-width:0}
.pf-qtext strong{display:block;color:#fff;font-size:.95rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-qrow.current .pf-qtext strong{color:var(--accent-soft)}
.pf-qtext span{display:block;color:#aeb3b9;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-qrow button{background:none;border:0;color:#9aa0a6;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none;border-radius:50%}
.pf-qrow button:hover{color:#fff;background:#ffffff14}
.pf-qrow .pf-qdrag{cursor:grab;touch-action:none}
.pf-qrow svg{width:20px;height:20px}
.pf-qempty{color:#aeb3b9;text-align:center;padding:24px 0}
#queue-player{opacity:.8}#queue-player:hover{opacity:1}
body.music-tv #queue-player{display:none}
/* Wide screens: details always on the left; lyrics or the queue on the right. */
@media(min-width:900px){
 .pf-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:0 4vw}
 #player.max .pf-panel[data-panel="info"][hidden]{display:flex}
 .pf-panel[data-panel="info"]{display:flex;align-items:center;justify-content:center;grid-column:1;grid-row:1}
 .pf-panel:not([data-panel="info"]){grid-column:2;grid-row:1}
 .pf-tabs button[data-tab="info"]{display:none}
}
@media(max-width:900px){
 .player{left:0;grid-template-columns:1fr auto;gap:8px 12px;padding:8px 12px}
 .center{grid-column:1/-1;grid-row:2}.right{grid-row:1;grid-column:2}.right .bar,.right #mute{display:none}
 .now img,.now .ph{width:46px;height:46px}
 .detail{padding:20px}.detail-top{flex-direction:column;align-items:flex-start;gap:18px}
 .tracks .hide-sm{display:none}
}
@media(max-width:760px){
 .library-head-top{flex-wrap:wrap}.library-head-actions{width:100%;flex-wrap:wrap}
 .library-head-actions .search-box{flex:1 1 140px}.library-head-actions .search-box input{width:100%}
 .library-header-icon,.library-header-icon :is(svg,img){width:60px;height:60px;flex-basis:60px}
 #items{padding-right:28px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px}
 .view-tabs button{padding:8px 12px}
}
/* ---- Google TV remote: obvious selection, bigger targets, no unreachable controls ---- */
html body.music-tv[data-page] :is(.pbtn,.view-tabs button,.tool,.btn-play,.btn-ghost,.back-link,.ext-links a,.bio-more,#now-sub,.tool-menu button):is(:focus,:focus-visible){
 outline:3px solid var(--accent)!important;outline-offset:3px!important;filter:none!important;
 box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)!important}
html body.music-tv[data-page] .pbtn.main:is(:focus,:focus-visible){transform:scale(1.12)}
html body.music-tv[data-page] .view-tabs button:is(:focus,:focus-visible){background:#3a3a3a;color:#fff}
html body.music-tv[data-page] tr.row:is(:focus,:focus-visible){outline:0!important;transform:none!important}
.tracks tr.row:focus-visible{transform:none}
html body.music-tv[data-page] tr.row:is(:focus,:focus-visible) td{background:#2a2a2a!important;color:#fff}
html body.music-tv[data-page] tr.row:is(:focus,:focus-visible) td:first-child{box-shadow:inset 5px 0 0 var(--accent)!important}
html body.music-tv[data-page] tr.row:is(:focus,:focus-visible) .t-title{color:#fff}
body.music-tv .tracks td{height:64px;font-size:1rem}
body.music-tv .player{padding:14px 28px}
body.music-tv .pbtn{width:52px;height:52px}
body.music-tv .pbtn svg{width:24px;height:24px}
body.music-tv .pbtn.main{width:60px;height:60px}
body.music-tv #now-sub{padding:4px 6px;border-radius:6px}
body.music-tv .right,body.music-tv #alpha-nav,body.music-tv .cover-play{display:none!important}
body.music-tv .player{grid-template-columns:minmax(220px,1fr) minmax(360px,2fr) minmax(40px,.3fr)}
body.music-tv #seek:is(:focus,:focus-visible){outline:3px solid var(--accent)!important;outline-offset:6px!important;border-radius:4px}

<script>
const $=id=>document.getElementById(id);
const audio=$('audio');
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_SHUFFLE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>';
let genreFilter='';
let tracks=[],libraries=[],libraryFilter='',view='albums',sortKey='title',query='';
let queue=[],order=[],pos=-1,shuffle=false,repeat='off';

const store={get(k,d){try{const v=localStorage.getItem('music.'+k);return v===null?d:v}catch{return d}},
 set(k,v){try{localStorage.setItem('music.'+k,v)}catch{}}};
const fmt=s=>{if(!Number.isFinite(s)||s<0)return '0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x};
const longFmt=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+' hr '+(m%60)+' min':m+' min'};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=text;return e}
function svg(markup){const t=document.createElement('template');t.innerHTML=markup;return t.content.firstChild}
const artUrl=t=>'/api/music/tracks/'+t.id+'/art';
function sortName(s){return String(s||'').replace(/^(the|a|an)\s+/i,'').toLocaleLowerCase()}
function initial(s){const c=(sortName(s)[0]||'#').toUpperCase();return /^[A-Z]$/.test(c)?c:'#'}

/* ---------- Data shaping ---------- */
// A song's genres: its artist's genres from Lidarr plus the song's own genre tag.
function genresOf(t){
 const artist=lidarrArtist(t.artist);
 const album=artist?.albums?.find(x=>x.title.toLocaleLowerCase()===String(t.album).toLocaleLowerCase());
 const out=new Set(album?album.genres:(artist?.genres||[]));
 if(t.genre)out.add(t.genre);
 return out;
}
function filtered(){
 const q=query.toLocaleLowerCase();
 return tracks.filter(t=>(!libraryFilter||String(t.library_id)===libraryFilter)&&
  (!genreFilter||genresOf(t).has(genreFilter))&&
  (!q||(t.title+' '+t.artist+' '+t.album+' '+[...genresOf(t)].join(' ')).toLocaleLowerCase().includes(q)));
}
function buildGenreMenu(){
 // Count albums per genre within the selected library, most common first.
 const albumsByGenre=new Map();
 for(const t of tracks){
  if(libraryFilter&&String(t.library_id)!==libraryFilter)continue;
  for(const g of genresOf(t)){if(!albumsByGenre.has(g))albumsByGenre.set(g,new Set());albumsByGenre.get(g).add(t.artist+'\u0000'+t.album)}
 }
 const genres=[...albumsByGenre].sort((a,b)=>b[1].size-a[1].size||a[0].localeCompare(b[0]));
 if(genreFilter&&!albumsByGenre.has(genreFilter))genreFilter='';
 $('genre-anchor').hidden=!genres.length;
 $('genre-toggle').classList.toggle('is-active',!!genreFilter);
 $('genre-toggle').title=genreFilter?'Genre: '+genreFilter:'Filter by genre';
 const menu=$('genre-menu');menu.replaceChildren(el('h4','','Genre'));
 for(const [g,set] of [['',null],...genres]){
  const b=el('button','',g||'All genres');b.type='button';b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',String(g===genreFilter));
  if(set)b.append(el('small','',String(set.size)));
  b.addEventListener('click',()=>{genreFilter=g;store.set('genre',g);closeMenus();buildGenreMenu();renderBrowse();if(tvMode)$('genre-toggle').focus({preventScroll:true})});
  menu.append(b);
 }
}
function albumsOf(list){
 const map=new Map();
 for(const t of list){const k=t.artist+'\u0000'+t.album;
  if(!map.has(k))map.set(k,{key:k,title:t.album,artist:t.artist,tracks:[],year:null,added:''});
  const a=map.get(k);a.tracks.push(t);if(t.year&&(!a.year||t.year<a.year))a.year=t.year;if((t.added_at||'')>a.added)a.added=t.added_at||''}
 for(const a of map.values())a.tracks.sort((x,y)=>(x.disc_number||1)-(y.disc_number||1)||(x.track_number??999)-(y.track_number??999)||x.title.localeCompare(y.title));
 return [...map.values()];
}
function artistsOf(list){
 const map=new Map();
 for(const a of albumsOf(list)){if(!map.has(a.artist))map.set(a.artist,{name:a.artist,albums:[],tracks:[]});const r=map.get(a.artist);r.albums.push(a);r.tracks.push(...a.tracks)}
 return [...map.values()];
}
const SORTS={albums:[['title','Album title'],['artist','Artist'],['year','Year (newest)'],['added','Recently added']],
 artists:[['title','Name'],['albums','Most albums']],
 songs:[['title','Title'],['artist','Artist'],['album','Album'],['duration','Length (longest)'],['added','Recently added']]};
function sortList(items){
 const by=sortKey,c=(a,b)=>sortName(a).localeCompare(sortName(b));
 if(view==='albums')return items.sort((a,b)=>by==='artist'?c(a.artist,b.artist)||(a.year||0)-(b.year||0):by==='year'?(b.year||0)-(a.year||0)||c(a.title,b.title):by==='added'?b.added.localeCompare(a.added):c(a.title,b.title));
 if(view==='artists')return items.sort((a,b)=>by==='albums'?b.albums.length-a.albums.length||c(a.name,b.name):c(a.name,b.name));
 return items.sort((a,b)=>by==='artist'?c(a.artist,b.artist):by==='album'?c(a.album,b.album)||(a.track_number??999)-(b.track_number??999):by==='duration'?(b.duration||0)-(a.duration||0):by==='added'?(b.added_at||'').localeCompare(a.added_at||''):c(a.title,b.title));
}

/* ---------- Covers ---------- */
// Lidarr artwork by artist name (photo + backdrop); empty if Lidarr is not connected.
let lidarrArtists=new Map();
const lidarrArtist=name=>lidarrArtists.get(String(name||'').toLocaleLowerCase());
const lidarrImage=(a,kind)=>a&&a.images.includes(kind)?'/api/lidarr/artist/'+a.id+'/image/'+kind:null;
function cover(track,label,round,imageUrl){
 const box=el('div','cover music-cover cover--'+(label.length%6));
 const init=el('div','cover-initial',(label.trim()[0]||'♪').toUpperCase());init.setAttribute('aria-hidden','true');
 box.append(el('div','cover-top'),init,el('div','cover-title',round?'':label));
 if(track){const img=new Image();img.loading='lazy';img.alt='';img.decoding='async';img.src=imageUrl||artUrl(track);img.onerror=()=>{if(imageUrl&&img.src.indexOf('/api/music/')<0)img.src=artUrl(track);else img.remove()};box.append(img)}
 return box;
}
function playOverlay(handler,label){
 const b=el('button','cover-play');b.type='button';b.setAttribute('aria-label',label);b.append(svg(ICON_PLAY));
 b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();handler()});return b;
}

/* ---------- Browse rendering ---------- */
function renderBrowse(){
 const list=filtered(),items=$('items'),songs=$('song-list');
 items.replaceChildren();songs.replaceChildren();
 const albums=albumsOf(list),artists=artistsOf(list);
 const total=list.reduce((s,t)=>s+(t.duration||0),0);
 for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-selected',String(b.dataset.view===view));

// Average brightness of a logo's visible pixels; dark logos get inverted.
function isDarkImage(img){
 try{const c=document.createElement('canvas'),w=c.width=64,h=c.height=Math.max(1,Math.round(64*img.naturalHeight/img.naturalWidth));
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const d=x.getImageData(0,0,w,h).data;let sum=0,n=0;
  for(let i=0;i<d.length;i+=4){const a=d[i+3]/255;if(a<.3)continue;sum+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])*a;n+=a}
  return n>0&&sum/n<90}catch{return false}
}

function playList(list,index,shuffled){

function buildOrder(first){

 if(shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  if(first!=null){order.splice(order.indexOf(first),1);order.unshift(first)}}

}
function load(autoplay){

 const holder=$('now-art');holder.replaceChildren();const img=new Image();img.alt='';img.src=artUrl(t);img.onerror=()=>img.replaceWith(el('span','ph'));holder.append(img);

 if(autoplay)audio.play().catch(()=>{});
 if('mediaSession' in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:[{src:artUrl(t),sizes:'512x512'}]});
 }
 store.set('last',JSON.stringify({ids:queue.map(x=>x.id),order,pos,shuffle}));
 markPlaying();
 if(typeof renderFull==='function')renderFull();
 if(typeof renderQueue==='function'&&fullTab==='queue')renderQueue();

/* ---------- Up next (the queue) ---------- */
function saveQueue(){store.set('last',JSON.stringify({ids:queue.map(x=>x.id),order,pos,shuffle}))}
function jumpTo(i){if(i<0||i>=order.length||i===pos)return;pos=i;load(true)}
function removeAt(i){
 if(i<=pos||i>=order.length)return;
 const qi=order[i];
 queue.splice(qi,1);order.splice(i,1);
 order=order.map(x=>x>qi?x-1:x);
 saveQueue();renderQueue();
}
function moveTo(from,to){
 if(from<=pos||to<=pos||from>=order.length)return;
 to=Math.min(to,order.length-1);
 const [x]=order.splice(from,1);order.splice(to,0,x);
 saveQueue();renderQueue();
}
function clearUpNext(){
 const keep=order.slice(0,pos+1);
 queue=keep.map(i=>queue[i]);order=keep.map((_,k)=>k);
 saveQueue();renderQueue();
}

  {question:'What is the best-selling album of all time?',answer:'Michael Jackson’s “Thriller”.'},
  {question:'Which composer kept writing music after losing his hearing?',answer:'Ludwig van Beethoven.'},
  {question:'What does “a cappella” mean?',answer:'Singing without instrumental accompaniment.'},
  {question:'In what city did jazz first develop?',answer:'New Orleans.'},
  {question:'How many strings does a standard guitar have?',answer:'Six.'},
  {question:'Which instrument did Louis Armstrong famously play?',answer:'The trumpet.'},
  {question:'What format did the compact disc begin replacing in the 1980s?',answer:'Vinyl records and cassette tapes.'}
 ]};
function triviaStorage(key,fallback){
 try{return JSON.parse(localStorage.getItem(key))??fallback}catch(_){return fallback}
}
function storeTrivia(key,value){
 try{localStorage.setItem(key,JSON.stringify(value))}catch(_){}
}
function nextOfflineTrivia(){
 const key='oew-trivia-fallback-'+type;
 const old=Number(triviaStorage(key,-1));
 const index=(old+1)%fallbackTrivia[type].length;
 storeTrivia(key,index);
 return fallbackTrivia[type][index];
}
function nextTriviaFromQueue(){
 const key='oew-trivia-batch-'+type;
 const queue=triviaStorage(key,[]);
 if(!Array.isArray(queue)||!queue.length)return null;
 while(queue.length){
  const item=queue.shift();
  if(item&&typeof item.question==='string'&&item.question.trim()&&
    typeof item.answer==='string'&&item.answer.trim()){
   storeTrivia(key,queue);
   return item;
  }
 }
 storeTrivia(key,[]);
 return null;
}
let triviaTimer=null,triviaPhase='question',triviaCurrent=null;
let triviaFetching=false,triviaLastFetch=0;
const triviaQuestion=$('trivia-question'),triviaAnswer=$('trivia-answer');
const triviaAnswerText=$('trivia-answer-text');
function scheduleTrivia(callback,delay){
 clearTimeout(triviaTimer);
 if(!document.hidden)triviaTimer=setTimeout(callback,delay);
}
function revealTriviaAnswer(){
 if(document.hidden)return;
 triviaPhase='answer';
 // Only expose the answer (including to screen readers) after the question.
 triviaAnswer.setAttribute('aria-hidden','false');
 triviaAnswerText.textContent=triviaCurrent?.answer||'';
 triviaAnswer.classList.add('revealed');
 scheduleTrivia(showNextTrivia,TRIVIA_ANSWER_MS);
}
function showNextTrivia(){
 triviaPhase='question';
 triviaCurrent=nextTriviaFromQueue()||nextOfflineTrivia();
 triviaAnswer.classList.remove('revealed');
 triviaAnswer.setAttribute('aria-hidden','true');
 triviaAnswerText.textContent='';
 triviaQuestion.classList.add('is-changing');
 // The question crossfades; no layout changes to the controls or poster grid.
 setTimeout(()=>{
  if(document.hidden)return;
  triviaQuestion.textContent=triviaCurrent.question;
  triviaQuestion.classList.remove('is-changing');
 },180);
 scheduleTrivia(revealTriviaAnswer,TRIVIA_QUESTION_MS);
 if((triviaStorage('oew-trivia-batch-'+type,[])||[]).length<5)fetchTriviaBatch();
}
async function fetchTriviaBatch(){
 if(triviaFetching||Date.now()-triviaLastFetch<12000)return;
 triviaFetching=true;triviaLastFetch=Date.now();
 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),3500);
  let response;
  try{
   response=await fetch('https://opentdb.com/api.php?amount=40&category='+
     '12'+'&type=multiple&encode=url3986',
     {signal:controller.signal,mode:'cors',cache:'no-store'});
  }finally{clearTimeout(timeout)}
  if(!response.ok)return;
  const data=await response.json();
  if(data.response_code!==0||!Array.isArray(data.results))return;
  const historyKey='oew-trivia-history-'+type;
  const seen=new Set(triviaStorage(historyKey,[]));
  const queueKey='oew-trivia-batch-'+type;
  const fresh=[];
  for(const row of data.results){
   if(!row.question||!row.correct_answer)continue;
   try{
    const question=decodeURIComponent(row.question),answer=decodeURIComponent(row.correct_answer);
    if(seen.has(question)||!question.trim()||!answer.trim())continue;
    seen.add(question);
    fresh.push({question,answer});
   }catch(_){/* Skip malformed API content. */}
  }
  if(!fresh.length)return;
  storeTrivia(historyKey,[...seen].slice(-300));
  const existing=triviaStorage(queueKey,[]);
  storeTrivia(queueKey,[...(Array.isArray(existing)?existing:[]),...fresh].slice(0,70));
 }catch(_){/* Continue rotating local trivia when the provider is unavailable. */}
 finally{triviaFetching=false}
}
document.addEventListener('visibilitychange',()=>{
 clearTimeout(triviaTimer);
 if(document.hidden)return;
 if(triviaPhase==='answer')scheduleTrivia(showNextTrivia,TRIVIA_ANSWER_MS);
 else{
  triviaQuestion.classList.remove('is-changing');
  if(triviaCurrent)triviaQuestion.textContent=triviaCurrent.question;
  scheduleTrivia(revealTriviaAnswer,TRIVIA_QUESTION_MS);
 }
});
window.addEventListener('pagehide',()=>clearTimeout(triviaTimer));
showNextTrivia();
}
boot();
</script></body></html>
