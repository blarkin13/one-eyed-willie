<!doctype html>
<html lang="en"><head>
<link rel="icon" type="image/png" sizes="128x128" href="/assets/favicon.png?v=5">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yarr Media · Music</title>
<link rel="stylesheet" href="/assets/ui.css?v=music-2">
<script src="/assets/library-appearance.js?v=music-2"></script>
<script defer src="/assets/shell.js?v=music-2"></script>
<style>
/* Masthead: same structure and sizing as Movies/TV (catalog.html). */
.music-main{padding-bottom:150px}
#library-masthead[hidden]{display:none}
.library-head{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-bottom:14px;position:relative;isolation:isolate;z-index:20;padding:14px 8px 10px}
.library-head-top{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;min-width:0;position:relative;z-index:10}
.library-header-art-frame{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.library-header-art{position:absolute;pointer-events:none;left:var(--masthead-x,75%);top:var(--masthead-y,50%);width:min(77%,790px);height:auto;transform:translate(-50%,-50%) scale(var(--masthead-scale,1));opacity:var(--masthead-opacity,.6);user-select:none;object-fit:contain}
.library-header-title{display:flex;align-items:center;gap:20px}
.library-header-icon{color:#beddf7;flex:0 0 76px;width:76px;height:76px;display:inline-grid;place-items:center}
.library-header-icon :is(svg,img){width:76px;height:76px;object-fit:contain;display:block}
.library-header-icon .library-fa-icon{display:inline-flex;align-items:center;justify-content:center}
.library-header-icon .library-fa-icon>i{display:none}
.fontawesome-ready .library-header-icon .library-fa-icon>i{display:inline-block}
.fontawesome-ready .library-header-icon .library-fa-icon>.library-fa-fallback{display:none!important}
.library-subtitle{width:100%;max-width:none!important;text-align:left;margin:0;color:#e1eaf5;font-weight:600;font-size:clamp(1rem,1.07vw,1.25rem)}
.library-head-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;position:relative;z-index:11}
.library-head-actions .search-box input{width:clamp(185px,19vw,270px)}
.tool{display:grid;place-items:center;position:relative;width:44px;height:44px;border:1px solid #40536b;border-radius:11px;background:#172536;color:#cde4fa;padding:10px;cursor:pointer;flex:none}
.tool svg{width:22px;height:22px}
.tool:hover,.tool:focus-visible,.tool[aria-expanded=true]{background:#29415b;color:#fff;border-color:#7fa3c5}
.tool:disabled{opacity:.45;cursor:default}
.menu-anchor{position:relative}
.tool-menu{position:absolute;z-index:45;right:0;top:calc(100% + 9px);width:240px;padding:7px;background:#121e2d;border:1px solid #405875;border-radius:14px;box-shadow:0 18px 45px #000b}
.tool-menu[hidden]{display:none}
.tool-menu h4{margin:0;padding:9px 11px 10px;color:#94acc5;font-size:.72rem;font-weight:750;text-transform:uppercase;letter-spacing:.09em}
.tool-menu button{display:flex;justify-content:space-between;width:100%;min-height:42px;border:0;border-radius:9px;padding:10px 11px;background:transparent;color:#d4e3f2;text-align:left;font:inherit;font-size:.86rem;cursor:pointer}
.tool-menu button:hover,.tool-menu button:focus-visible{background:#293d53;color:#fff}
.tool-menu button[aria-checked=true]{background:#28445f;color:#e8f6ff;font-weight:750}
.tool-menu button[aria-checked=true]::after{content:"✓";color:#a7ddff}
body[data-page=music] :is(a,button,input,select):focus-visible{outline:3px solid #d7edff!important;outline-offset:4px}

/* View tabs + section heading */
.music-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.view-tabs{display:inline-flex;padding:4px;gap:4px;background:#111c2a;border:1px solid #33465d;border-radius:12px}
.view-tabs button{border:0;background:transparent;color:#b9cbe0;font:650 .9rem system-ui;padding:9px 16px;border-radius:9px;cursor:pointer;min-height:40px}
.view-tabs button[aria-selected=true]{background:#2c4a67;color:#fff}
.count-label{color:#98a7ba;font-size:.88rem}
#status:empty{display:none}

/* Grid: reuses .tile/.cover from ui.css, square covers for music. */
#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,175px),1fr));gap:25px 18px;padding-right:22px}
.music-cover{aspect-ratio:1/1}
.music-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.artist-tile .music-cover{border-radius:50%}
.artist-tile h3,.artist-tile .tile-meta{text-align:center}
.cover-play{position:absolute;right:10px;bottom:10px;z-index:2;width:46px;height:46px;border-radius:50%;border:0;background:#8b5cf6;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px #0009;opacity:0;transform:translateY(6px);transition:opacity .15s,transform .15s;cursor:pointer}
.cover-play svg{width:20px;height:20px;margin-left:2px}
.tile:hover .cover-play,.tile:focus-within .cover-play{opacity:1;transform:none}
.alpha-nav{position:fixed;top:50%;right:9px;transform:translateY(-50%);z-index:12;display:flex;flex-direction:column;background:#0a1421e8;backdrop-filter:blur(12px);padding:5px 3px;border-radius:14px}
.alpha-nav[hidden]{display:none}
.alpha-nav button{background:none;border:0;color:#c3d3e4;min-width:25px;min-height:20px;font-size:11px;font-weight:700;padding:0 2px;cursor:pointer}
.alpha-nav button:disabled{color:#4c6074;cursor:default}
.alpha-nav button:not(:disabled):hover{color:#fff;background:#2a435e;border-radius:5px}

/* Album / artist detail */
.detail{position:relative;isolation:isolate;border-radius:20px;overflow:hidden;padding:30px;margin:4px 0 26px;border:1px solid #2b3c52}
.detail-bg{position:absolute;inset:-40px;z-index:-2;background-size:cover;background-position:center;filter:blur(40px) saturate(1.3);opacity:.55}
.detail::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0a1220aa,#0a1220f2)}
.detail-top{display:flex;gap:30px;align-items:flex-end}
.detail-art{width:min(250px,38vw);aspect-ratio:1;border-radius:14px;overflow:hidden;flex:none;background:linear-gradient(155deg,#30475e,#152331);box-shadow:0 18px 45px #000a;display:grid;place-items:center;color:#c2cfe2;font-size:4rem}
.detail-art.round{border-radius:50%}
.detail-art img{width:100%;height:100%;object-fit:cover}
.detail-info{min-width:0}
.detail-info .eyebrow{margin:0 0 6px}
.detail-info h1{margin:0;font-size:clamp(1.9rem,4.2vw,3.6rem);line-height:1.05;letter-spacing:-.03em;overflow-wrap:anywhere}
.detail-meta{color:#c4d3e3;margin:12px 0 0;font-size:.95rem}
.detail-meta a{color:#fff;font-weight:700;text-decoration:none}
.detail-meta a:hover{text-decoration:underline}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn-play{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:999px;background:#8b5cf6;color:#fff;font-weight:750;padding:12px 24px;min-height:46px;cursor:pointer;font-size:.95rem}
.btn-play:hover{background:#9d74ff}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;border:1px solid #5a6f88;border-radius:999px;background:#0b1626aa;color:#eaf2fb;font-weight:650;padding:12px 22px;min-height:46px;cursor:pointer;font-size:.95rem}
.btn-ghost:hover{background:#22364d}
.btn-play svg,.btn-ghost svg{width:18px;height:18px}
.back-link{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:#b9cde3;font:650 .9rem system-ui;padding:6px 0;margin-bottom:12px;cursor:pointer}
.back-link:hover{color:#fff}
.sub-heading{font-size:1.1rem;margin:28px 0 14px}

/* Track list */
.tracks{width:100%;border-collapse:collapse}
.tracks th{color:#8ea3ba;font-size:.72rem;font-weight:750;text-transform:uppercase;letter-spacing:.09em;text-align:left;padding:0 12px 10px;border-bottom:1px solid #26374b}
.tracks td{padding:0 12px;height:56px;border-bottom:1px solid #18263590;color:#d8e4f1;font-size:.92rem}
.tracks tr.row{cursor:pointer}
.tracks tr.row:hover td,.tracks tr.row:focus-visible td{background:#17263a}
.tracks tr.row:focus-visible{outline:2px solid #a78bfa;outline-offset:-2px}
.tracks td:first-child{border-radius:9px 0 0 9px}.tracks td:last-child{border-radius:0 9px 9px 0}
.tracks .num{width:46px;color:#8ea3ba;font-variant-numeric:tabular-nums;text-align:center}
.tracks .dur{width:70px;text-align:right;color:#8ea3ba;font-variant-numeric:tabular-nums}
.tracks .t-title{font-weight:650;color:#f1f6fc}
.tracks .t-sub{display:block;font-size:.8rem;color:#93a8be;font-weight:500;margin-top:2px}
.tracks .t-cell{display:flex;align-items:center;gap:12px;min-width:0}
.tracks .t-thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:#24364e}
.tracks .clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tracks td.secondary{color:#9fb3c8}
.tracks tr.playing .t-title,.tracks tr.playing .num{color:#b9a2ff}
.tracks .num .play-ico{display:none}
.tracks tr.row:hover .num .n{display:none}.tracks tr.row:hover .num .play-ico{display:inline}
.disc-row td{height:44px;color:#9fb3c8;font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;cursor:default}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:#b9a2ff;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
@media(prefers-reduced-motion:reduce){.eq i{animation:none;height:10px}}

/* Player */
.player{position:fixed;left:var(--sidebar-width,96px);right:0;bottom:0;z-index:30;background:#08111ef2;backdrop-filter:blur(18px);border-top:1px solid #2e4057;padding:10px 22px;display:grid;grid-template-columns:minmax(180px,1fr) minmax(320px,2fr) minmax(150px,1fr);align-items:center;gap:20px}
.player[hidden]{display:none}
.now{display:flex;align-items:center;gap:13px;min-width:0}
.now img,.now .ph{width:60px;height:60px;border-radius:8px;object-fit:cover;flex:none;background:#24364e;box-shadow:0 4px 14px #0007}
.now-text{min-width:0}
.now-text strong{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-text button{background:none;border:0;padding:0;color:#a8bbd0;font-size:.82rem;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;text-align:left}
.now-text button:hover{color:#fff;text-decoration:underline}
.center{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.controls{display:flex;align-items:center;gap:10px}
.pbtn{background:none;border:0;color:#c9d7e6;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative}
.pbtn svg{width:20px;height:20px}
.pbtn:hover{color:#fff}
.pbtn.on{color:#b9a2ff}
.pbtn.on::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#b9a2ff}
.pbtn.main{width:46px;height:46px;background:#f3f6fb;color:#0b1422}
.pbtn.main:hover{transform:scale(1.05);color:#0b1422}
.pbtn.main svg{width:20px;height:20px}
.seek-row{display:flex;align-items:center;gap:10px;width:100%}
.seek-row span{color:#93a8be;font-size:.75rem;font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
input[type=range].bar{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,#b9a2ff var(--p,0%),#3a4d63 var(--p,0%));cursor:pointer}
input[type=range].bar::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s}
input[type=range].bar:hover::-webkit-slider-thumb,input[type=range].bar:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range].bar::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff}
.right{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.right .bar{max-width:120px}
@media(max-width:900px){
 .player{left:0;grid-template-columns:1fr auto;gap:8px 12px;padding:8px 12px}
 .center{grid-column:1/-1;grid-row:2}.right{grid-row:1;grid-column:2}.right .bar,.right #mute{display:none}
 .now img,.now .ph{width:46px;height:46px}
 .detail{padding:20px}.detail-top{flex-direction:column;align-items:flex-start;gap:18px}
 .tracks .hide-sm{display:none}
}
@media(max-width:760px){
 .library-head-top{flex-wrap:wrap}.library-head-actions{width:100%;flex-wrap:wrap}
 .library-head-actions .search-box{flex:1 1 140px}.library-head-actions .search-box input{width:100%}
 .library-header-icon,.library-header-icon :is(svg,img){width:60px;height:60px;flex-basis:60px}
 #items{padding-right:28px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px 14px}
 .view-tabs button{padding:8px 12px}
}
</style>
</head>
<body data-page="music"><div class="app-shell">
<aside id="app-nav" class="sidebar" aria-label="Sidebar"></aside>
<div class="workspace"><main class="content music-main">
<div class="page-head library-head" id="library-masthead">
 <div class="library-header-art-frame" aria-hidden="true"><img id="library-header-art" class="library-header-art" alt="" src="/assets/library-header-music.png"></div>
 <div class="library-head-top">
  <div class="library-heading">
   <p class="eyebrow">Your library</p>
   <div class="library-header-title"><span class="library-header-icon" id="library-title-icon" aria-hidden="true"></span><h1 id="page-title">Music</h1></div>
  </div>
  <div class="library-head-actions" role="group" aria-label="Browse music controls">
   <label class="search-box"><span class="sr-only">Search music</span><input type="search" id="search" placeholder="Search songs, artists, albums…" maxlength="120"></label>
   <div class="menu-anchor">
    <button class="tool" type="button" id="sort-toggle" aria-label="Sort" aria-haspopup="menu" aria-expanded="false" title="Sort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h13M4 11h9M4 16h5"/><path d="M19 11v9m-3-3 3 3 3-3"/></svg></button>
    <div class="tool-menu" id="sort-menu" role="menu" hidden></div>
   </div>
   <div class="menu-anchor" id="library-anchor" hidden>
    <button class="tool" type="button" id="library-toggle" aria-label="Choose music library" aria-haspopup="menu" aria-expanded="false" title="Music library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6.5 7.5v5L10.5 20v-7.5z"/></svg></button>
    <div class="tool-menu" id="library-menu" role="menu" hidden></div>
   </div>
   <button class="tool" type="button" id="scan" title="Scan music folders" aria-label="Scan music folders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.1 5.4"/><path d="M20 4v7h-7"/></svg></button>
   <a class="tool" href="/settings/libraries" title="Manage music folders" aria-label="Manage music folders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
  </div>
 </div>
 <p class="library-subtitle" id="library-subtitle">Loading your music…</p>
</div>

<div id="browse">
 <div class="music-bar">
  <div class="view-tabs" role="tablist" aria-label="Browse by">
   <button type="button" role="tab" data-view="albums" aria-selected="true">Albums</button>
   <button type="button" role="tab" data-view="artists" aria-selected="false">Artists</button>
   <button type="button" role="tab" data-view="songs" aria-selected="false">Songs</button>
  </div>
  <span class="count-label" id="results-count"></span>
 </div>
 <p class="status-line" id="status" role="status"></p>
 <div id="items"></div>
 <div id="song-list"></div>
</div>
<div id="detail-view" hidden></div>
<nav id="alpha-nav" class="alpha-nav" aria-label="Jump to letter" hidden></nav>
</main></div></div>

<div class="player" id="player" hidden aria-label="Music player">
 <div class="now"><span id="now-art"></span><div class="now-text"><strong id="now-title">—</strong><button type="button" id="now-sub">—</button></div></div>
 <div class="center">
  <div class="controls">
   <button class="pbtn" type="button" id="shuffle" aria-label="Shuffle" aria-pressed="false" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
   <button class="pbtn" type="button" id="previous" aria-label="Previous" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
   <button class="pbtn main" type="button" id="play-pause" aria-label="Play" title="Play / pause (Space)"></button>
   <button class="pbtn" type="button" id="next" aria-label="Next" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
   <button class="pbtn" type="button" id="repeat" aria-label="Repeat: off" title="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><span id="repeat-one" hidden style="position:absolute;font:800 9px system-ui;top:13px">1</span></button>
  </div>
  <div class="seek-row"><span id="elapsed">0:00</span><input class="bar" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="total">0:00</span></div>
 </div>
 <div class="right">
  <button class="pbtn" type="button" id="mute" aria-label="Mute" title="Mute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path id="vol-waves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
  <input class="bar" id="volume" type="range" min="0" max="100" value="100" aria-label="Volume">
 </div>
 <audio id="audio" preload="metadata"></audio>
</div>

<script>
const $=id=>document.getElementById(id);
const audio=$('audio');
const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
const ICON_SHUFFLE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>';
let tracks=[],libraries=[],libraryFilter='',view='albums',sortKey='title',query='';
let queue=[],order=[],pos=-1,shuffle=false,repeat='off';

const store={get(k,d){try{const v=localStorage.getItem('music.'+k);return v===null?d:v}catch{return d}},
 set(k,v){try{localStorage.setItem('music.'+k,v)}catch{}}};
const fmt=s=>{if(!Number.isFinite(s)||s<0)return '0:00';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x};
const longFmt=s=>{const m=Math.round(s/60);return m>=60?Math.floor(m/60)+' hr '+(m%60)+' min':m+' min'};
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=text;return e}
function svg(markup){const t=document.createElement('template');t.innerHTML=markup;return t.content.firstChild}
const artUrl=t=>'/api/music/tracks/'+t.id+'/art';
function sortName(s){return String(s||'').replace(/^(the|a|an)\s+/i,'').toLocaleLowerCase()}
function initial(s){const c=(sortName(s)[0]||'#').toUpperCase();return /^[A-Z]$/.test(c)?c:'#'}

/* ---------- Data shaping ---------- */
function filtered(){
 const q=query.toLocaleLowerCase();
 return tracks.filter(t=>(!libraryFilter||String(t.library_id)===libraryFilter)&&
  (!q||(t.title+' '+t.artist+' '+t.album+' '+(t.genre||'')).toLocaleLowerCase().includes(q)));
}
function albumsOf(list){
 const map=new Map();
 for(const t of list){const k=t.artist+'\u0000'+t.album;
  if(!map.has(k))map.set(k,{key:k,title:t.album,artist:t.artist,tracks:[],year:null,added:''});
  const a=map.get(k);a.tracks.push(t);if(t.year&&(!a.year||t.year<a.year))a.year=t.year;if((t.added_at||'')>a.added)a.added=t.added_at||''}
 for(const a of map.values())a.tracks.sort((x,y)=>(x.disc_number||1)-(y.disc_number||1)||(x.track_number??999)-(y.track_number??999)||x.title.localeCompare(y.title));
 return [...map.values()];
}
function artistsOf(list){
 const map=new Map();
 for(const a of albumsOf(list)){if(!map.has(a.artist))map.set(a.artist,{name:a.artist,albums:[],tracks:[]});const r=map.get(a.artist);r.albums.push(a);r.tracks.push(...a.tracks)}
 return [...map.values()];
}
const SORTS={albums:[['title','Album title'],['artist','Artist'],['year','Year (newest)'],['added','Recently added']],
 artists:[['title','Name'],['albums','Most albums']],
 songs:[['title','Title'],['artist','Artist'],['album','Album'],['duration','Length (longest)'],['added','Recently added']]};
function sortList(items){
 const by=sortKey,c=(a,b)=>sortName(a).localeCompare(sortName(b));
 if(view==='albums')return items.sort((a,b)=>by==='artist'?c(a.artist,b.artist)||(a.year||0)-(b.year||0):by==='year'?(b.year||0)-(a.year||0)||c(a.title,b.title):by==='added'?b.added.localeCompare(a.added):c(a.title,b.title));
 if(view==='artists')return items.sort((a,b)=>by==='albums'?b.albums.length-a.albums.length||c(a.name,b.name):c(a.name,b.name));
 return items.sort((a,b)=>by==='artist'?c(a.artist,b.artist):by==='album'?c(a.album,b.album)||(a.track_number??999)-(b.track_number??999):by==='duration'?(b.duration||0)-(a.duration||0):by==='added'?(b.added_at||'').localeCompare(a.added_at||''):c(a.title,b.title));
}

/* ---------- Covers ---------- */
function cover(track,label,round){
 const box=el('div','cover music-cover cover--'+(label.length%6));
 const init=el('div','cover-initial',(label.trim()[0]||'♪').toUpperCase());init.setAttribute('aria-hidden','true');
 box.append(el('div','cover-top'),init,el('div','cover-title',round?'':label));
 if(track){const img=new Image();img.loading='lazy';img.alt='';img.decoding='async';img.src=artUrl(track);img.onerror=()=>img.remove();box.append(img)}
 return box;
}
function playOverlay(handler,label){
 const b=el('button','cover-play');b.type='button';b.setAttribute('aria-label',label);b.append(svg(ICON_PLAY));
 b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();handler()});return b;
}

/* ---------- Browse rendering ---------- */
function renderBrowse(){
 const list=filtered(),items=$('items'),songs=$('song-list');
 items.replaceChildren();songs.replaceChildren();
 const albums=albumsOf(list),artists=artistsOf(list);
 const total=list.reduce((s,t)=>s+(t.duration||0),0);
 $('library-subtitle').textContent=tracks.length?artistsOf(tracks).length+' artists · '+albumsOf(tracks).length+' albums · '+tracks.length+' songs · '+longFmt(tracks.reduce((s,t)=>s+(t.duration||0),0)):'';
 for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-selected',String(b.dataset.view===view));
 renderSortMenu();
 $('status').textContent='';
 if(!tracks.length){$('status').textContent='No music found. Add a Music library in Settings and scan its folders.';$('alpha-nav').hidden=true;$('results-count').textContent='';return}
 if(!list.length){$('status').textContent='Nothing matches “'+query+'”.';$('alpha-nav').hidden=true;$('results-count').textContent='';return}
 const letters=new Map();
 if(view==='albums'){
  $('results-count').textContent=albums.length+' albums';
  for(const a of sortList(albums)){
   const tile=el('article','tile');const link=el('a','tile-button');link.href='?album='+encodeURIComponent(a.key);
   link.setAttribute('aria-label',a.title+' by '+a.artist);link.addEventListener('click',e=>{e.preventDefault();go({album:a.key})});
   const c=cover(a.tracks[0],a.title);c.append(playOverlay(()=>playList(a.tracks,0),'Play '+a.title));
   link.append(c,el('h3','',a.title),el('div','tile-meta',[a.artist,a.year].filter(Boolean).join(' · ')));
   tile.title=a.title;tile.append(link);items.append(tile);
   if(sortKey==='title'&&!letters.has(initial(a.title)))letters.set(initial(a.title),tile);
   if(sortKey==='artist'&&!letters.has(initial(a.artist)))letters.set(initial(a.artist),tile);
  }
 }else if(view==='artists'){
  $('results-count').textContent=artists.length+' artists';
  for(const r of sortList(artists)){
   const tile=el('article','tile artist-tile');const link=el('a','tile-button');link.href='?artist='+encodeURIComponent(r.name);
   link.addEventListener('click',e=>{e.preventDefault();go({artist:r.name})});
   const c=cover(r.tracks[0],r.name,true);c.append(playOverlay(()=>playList(r.tracks,0,true),'Shuffle '+r.name));
   link.append(c,el('h3','',r.name),el('div','tile-meta',r.albums.length+' album'+(r.albums.length===1?'':'s')+' · '+r.tracks.length+' songs'));
   tile.append(link);items.append(tile);
   if(sortKey==='title'&&!letters.has(initial(r.name)))letters.set(initial(r.name),tile);
  }
 }else{
  $('results-count').textContent=list.length+' songs · '+longFmt(total);
  const sorted=sortList([...list]);
  songs.append(trackTable(sorted,{album:true,artist:true,thumb:true}));
 }
 buildAlpha(letters);
}
function buildAlpha(letters){
 const nav=$('alpha-nav');nav.replaceChildren();
 if(!letters.size||letters.size<4){nav.hidden=true;return}
 for(const L of ['#',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ']){
  const b=el('button','',L);b.type='button';b.disabled=!letters.has(L);
  b.addEventListener('click',()=>letters.get(L)?.scrollIntoView({behavior:'smooth',block:'start'}));nav.append(b);
 }
 nav.hidden=false;
}
function renderSortMenu(){
 const menu=$('sort-menu');menu.replaceChildren(el('h4','','Sort '+view));
 const opts=SORTS[view];if(!opts.some(o=>o[0]===sortKey))sortKey=opts[0][0];
 for(const [k,label] of opts){const b=el('button','',label);b.type='button';b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',String(k===sortKey));
  b.addEventListener('click',()=>{sortKey=k;store.set('sort.'+view,k);closeMenus();renderBrowse()});menu.append(b)}
}

/* ---------- Track table ---------- */
let tableRows=[];
function trackTable(list,opts={}){
 const table=el('table','tracks'),head=el('tr');
 head.append(el('th','num','#'),el('th','','Title'));
 if(opts.album)head.append(el('th','hide-sm','Album'));
 head.append(el('th','dur','⏱'));
 const thead=el('thead');thead.append(head);const body=el('tbody');
 const discs=new Set(list.map(t=>t.disc_number||1));
 let lastDisc=null;
 list.forEach((t,i)=>{
  if(opts.discs&&discs.size>1&&(t.disc_number||1)!==lastDisc){lastDisc=t.disc_number||1;const dr=el('tr','disc-row'),td=el('td','','Disc '+lastDisc);td.colSpan=4;dr.append(td);body.append(dr)}
  const tr=el('tr','row');tr.tabIndex=0;tr.dataset.id=t.id;
  const num=el('td','num');num.append(el('span','n',String(opts.album?i+1:(t.track_number||i+1))));const pi=el('span','play-ico');pi.append(svg('<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'));num.append(pi);
  const cell=el('div','t-cell');
  if(opts.thumb){const img=new Image();img.className='t-thumb';img.loading='lazy';img.alt='';img.src=artUrl(t);img.onerror=()=>{img.style.visibility='hidden'};cell.append(img)}
  const txt=el('div','clip');txt.append(el('span','t-title',t.title));
  if(opts.artist||t.artist!==opts.albumArtist)txt.append(el('span','t-sub clip',t.artist));
  cell.append(txt);const tdT=el('td');tdT.append(cell);
  tr.append(num,tdT);
  if(opts.album){const td=el('td','secondary hide-sm clip',t.album);td.style.maxWidth='280px';tr.append(td)}
  tr.append(el('td','dur',fmt(t.duration)));
  const start=()=>playList(list,i);
  tr.addEventListener('click',start);
  tr.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();start()}});
  body.append(tr);
 });
 table.append(thead,body);
 markPlaying();
 return table;
}
function markPlaying(){
 const cur=queue[order[pos]];
 for(const tr of document.querySelectorAll('.tracks tr.row')){
  const on=!!cur&&tr.dataset.id===String(cur.id);tr.classList.toggle('playing',on);tr.classList.toggle('paused',on&&audio.paused);
  const num=tr.querySelector('.num');const eq=num.querySelector('.eq');
  if(on&&!eq){const e=el('span','eq');e.append(el('i'),el('i'),el('i'));num.querySelector('.n').hidden=true;num.prepend(e)}
  if(!on&&eq){eq.remove();num.querySelector('.n').hidden=false}
 }
}

/* ---------- Detail views ---------- */
function detailHeader({art,round,eyebrow,title,meta,actions}){
 const wrap=el('section','detail');
 if(art){const bg=el('div','detail-bg');bg.style.backgroundImage='url("'+artUrl(art)+'")';wrap.append(bg)}
 const top=el('div','detail-top'),pic=el('div','detail-art'+(round?' round':''));pic.textContent='♪';
 if(art){const img=new Image();img.alt='';img.src=artUrl(art);img.onload=()=>{pic.textContent='';pic.append(img)};}
 const info=el('div','detail-info');info.append(el('p','eyebrow',eyebrow),el('h1','',title),meta);
 const act=el('div','detail-actions');act.append(...actions);info.append(act);
 top.append(pic,info);wrap.append(top);return wrap;
}
function button(cls,icon,label,handler){const b=el('button',cls);b.type='button';b.append(svg(icon),document.createTextNode(label));b.addEventListener('click',handler);return b}
function backButton(){const b=el('button','back-link');b.type='button';b.append(svg('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>'),document.createTextNode('Back'));
 b.addEventListener('click',()=>history.length>1?history.back():go({}));return b}
function artistLink(name){const a=el('a','',name);a.href='?artist='+encodeURIComponent(name);a.addEventListener('click',e=>{e.preventDefault();go({artist:name})});return a}
function renderAlbum(key){
 const a=albumsOf(tracks).find(x=>x.key===key);const out=$('detail-view');out.replaceChildren(backButton());
 if(!a){out.append(el('p','status-line','Album not found.'));return}
 document.title=a.title+' · Yarr Media';
 const total=a.tracks.reduce((s,t)=>s+(t.duration||0),0),genre=a.tracks.find(t=>t.genre)?.genre;
 const meta=el('p','detail-meta');meta.append(artistLink(a.artist),document.createTextNode(' · '+[a.year,genre,a.tracks.length+' songs',longFmt(total)].filter(Boolean).join(' · ')));
 out.append(detailHeader({art:a.tracks[0],eyebrow:'Album',title:a.title,meta,actions:[
  button('btn-play',ICON_PLAY,'Play',()=>playList(a.tracks,0)),
  button('btn-ghost',ICON_SHUFFLE,'Shuffle',()=>playList(a.tracks,0,true))]}));
 out.append(trackTable(a.tracks,{discs:true,albumArtist:a.artist}));
 const more=albumsOf(tracks).filter(x=>x.artist===a.artist&&x.key!==a.key);
 if(more.length){out.append(el('h2','sub-heading','More by '+a.artist),miniGrid(more))}
}
function renderArtist(name){
 const r=artistsOf(tracks).find(x=>x.name===name);const out=$('detail-view');out.replaceChildren(backButton());
 if(!r){out.append(el('p','status-line','Artist not found.'));return}
 document.title=r.name+' · Yarr Media';
 const meta=el('p','detail-meta',r.albums.length+' albums · '+r.tracks.length+' songs · '+longFmt(r.tracks.reduce((s,t)=>s+(t.duration||0),0)));
 out.append(detailHeader({art:r.tracks[0],round:true,eyebrow:'Artist',title:r.name,meta,actions:[
  button('btn-play',ICON_SHUFFLE,'Shuffle play',()=>playList(r.tracks,0,true)),
  button('btn-ghost',ICON_PLAY,'Play all',()=>playList(r.tracks,0))]}));
 out.append(el('h2','sub-heading','Albums'),miniGrid(r.albums.sort((x,y)=>(y.year||0)-(x.year||0))));
}
function miniGrid(albums){
 const grid=el('div');grid.id='';grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,165px),1fr));gap:22px 16px';
 for(const a of albums){const tile=el('article','tile');const link=el('a','tile-button');link.href='?album='+encodeURIComponent(a.key);
  link.addEventListener('click',e=>{e.preventDefault();go({album:a.key})});
  const c=cover(a.tracks[0],a.title);c.append(playOverlay(()=>playList(a.tracks,0),'Play '+a.title));
  link.append(c,el('h3','',a.title),el('div','tile-meta',[a.year,a.tracks.length+' songs'].filter(Boolean).join(' · ')));tile.append(link);grid.append(tile)}
 return grid;
}

/* ---------- Routing ---------- */
function go(params,replace){
 const sp=new URLSearchParams();if(libraryFilter)sp.set('library_id',libraryFilter);
 for(const [k,v] of Object.entries(params))sp.set(k,v);
 const url=location.pathname+(sp.toString()?'?'+sp:'');
 replace?history.replaceState(null,'',url):history.pushState(null,'',url);route();window.scrollTo({top:0});
}
function route(){
 const sp=new URLSearchParams(location.search);const album=sp.get('album'),artist=sp.get('artist');
 const inDetail=!!(album||artist);
 $('browse').hidden=inDetail;$('detail-view').hidden=!inDetail;$('library-masthead').hidden=inDetail;
 if(inDetail)$('alpha-nav').hidden=true;
 if(album)renderAlbum(album);else if(artist)renderArtist(artist);else{document.title='Yarr Media · Music';renderBrowse()}
}
window.addEventListener('popstate',route);

/* ---------- Player ---------- */
function playList(list,index,shuffled){
 if(!list.length)return;
 queue=[...list];shuffle=!!shuffled||shuffle&&shuffled!==false;
 buildOrder(shuffled?null:index);pos=shuffled?0:order.indexOf(index);
 load(true);
}
function buildOrder(first){
 order=queue.map((_,i)=>i);
 if(shuffle){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  if(first!=null){order.splice(order.indexOf(first),1);order.unshift(first)}}
 updateModeButtons();
}
function load(autoplay){
 const t=queue[order[pos]];if(!t)return;
 audio.src='/api/music/tracks/'+t.id+'/stream';
 $('now-title').textContent=t.title;$('now-sub').textContent=t.artist+' — '+t.album;$('now-sub').onclick=()=>go({album:t.artist+'\u0000'+t.album});
 const holder=$('now-art');holder.replaceChildren();const img=new Image();img.alt='';img.src=artUrl(t);img.onerror=()=>img.replaceWith(el('span','ph'));holder.append(img);
 $('player').hidden=false;
 if(autoplay)audio.play().catch(()=>{});
 if('mediaSession' in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album,artwork:[{src:artUrl(t),sizes:'512x512'}]});
 }
 store.set('last',JSON.stringify({ids:queue.map(x=>x.id),order,pos,shuffle}));
 markPlaying();
}
function next(auto){
 if(!queue.length)return;
 if(auto&&repeat==='one'){audio.currentTime=0;audio.play();return}
 if(pos<order.length-1)pos++;else if(repeat==='all'||!auto){pos=0;if(shuffle)buildOrder()}else{audio.pause();audio.currentTime=0;return}
 load(true);
}
function prev(){if(audio.currentTime>3||pos===0){audio.currentTime=0;return}pos--;load(true)}
function togglePlay(){if(!audio.src)return;audio.paused?audio.play().catch(()=>{}):audio.pause()}
function updatePlayButton(){$('play-pause').replaceChildren(svg(audio.paused?ICON_PLAY:ICON_PAUSE));$('play-pause').setAttribute('aria-label',audio.paused?'Play':'Pause');markPlaying()}
function updateModeButtons(){
 $('shuffle').classList.toggle('on',shuffle);$('shuffle').setAttribute('aria-pressed',String(shuffle));
 $('repeat').classList.toggle('on',repeat!=='off');$('repeat-one').hidden=repeat!=='one';$('repeat').setAttribute('aria-label','Repeat: '+repeat);
}
function setBar(input,value){input.style.setProperty('--p',value+'%')}
$('play-pause').onclick=togglePlay;$('next').onclick=()=>next(false);$('previous').onclick=prev;
$('shuffle').onclick=()=>{shuffle=!shuffle;const cur=order[pos];buildOrder(cur);pos=shuffle?0:cur};
$('repeat').onclick=()=>{repeat={off:'all',all:'one',one:'off'}[repeat];store.set('repeat',repeat);updateModeButtons()};
let seeking=false;
$('seek').addEventListener('input',()=>{seeking=true;setBar($('seek'),$('seek').value/10);$('elapsed').textContent=fmt(audio.duration*$('seek').value/1000)});
$('seek').addEventListener('change',()=>{if(audio.duration)audio.currentTime=audio.duration*$('seek').value/1000;seeking=false});
$('volume').addEventListener('input',()=>{audio.volume=$('volume').value/100;audio.muted=false;store.set('volume',$('volume').value);setBar($('volume'),$('volume').value);volIcon()});
$('mute').onclick=()=>{audio.muted=!audio.muted;volIcon()};
function volIcon(){$('vol-waves').style.display=audio.muted||audio.volume===0?'none':'';$('mute').setAttribute('aria-label',audio.muted?'Unmute':'Mute')}
audio.addEventListener('play',updatePlayButton);audio.addEventListener('pause',updatePlayButton);
audio.addEventListener('ended',()=>next(true));
audio.addEventListener('timeupdate',()=>{if(seeking)return;const p=audio.duration?audio.currentTime/audio.duration*1000:0;$('seek').value=p;setBar($('seek'),p/10);$('elapsed').textContent=fmt(audio.currentTime);$('total').textContent=fmt(audio.duration)});
audio.addEventListener('loadedmetadata',()=>{$('total').textContent=fmt(audio.duration)});
if('mediaSession' in navigator){
 navigator.mediaSession.setActionHandler('play',()=>audio.play());navigator.mediaSession.setActionHandler('pause',()=>audio.pause());
 navigator.mediaSession.setActionHandler('nexttrack',()=>next(false));navigator.mediaSession.setActionHandler('previoustrack',prev);
}
document.addEventListener('keydown',e=>{
 if(e.target.closest('input,textarea,select,[contenteditable]'))return;
 if(e.code==='Space'&&!e.target.closest('button,a,tr')&&audio.src){e.preventDefault();togglePlay()}
 if(e.key==='Escape')closeMenus();
});

/* ---------- Menus & controls ---------- */
function closeMenus(){for(const id of ['sort','library']){$(id+'-menu').hidden=true;$(id+'-toggle').setAttribute('aria-expanded','false')}}
for(const id of ['sort','library'])$(id+'-toggle').addEventListener('click',e=>{e.stopPropagation();const m=$(id+'-menu'),open=m.hidden;closeMenus();m.hidden=!open;$(id+'-toggle').setAttribute('aria-expanded',String(open));if(open)m.querySelector('button')?.focus()});
document.addEventListener('click',e=>{if(!e.target.closest('.menu-anchor'))closeMenus()});
for(const b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>{view=b.dataset.view;store.set('view',view);sortKey=store.get('sort.'+view,SORTS[view][0][0]);renderBrowse()});
let searchTimer;$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=$('search').value.trim();renderBrowse()},120)});
$('scan').onclick=async()=>{
 const libs=libraries.filter(l=>!libraryFilter||String(l.id)===libraryFilter);if(!libs.length)return;
 $('scan').disabled=true;$('status').textContent='Scanning music folders…';
 try{for(const l of libs)await fetch('/api/libraries/'+encodeURIComponent(l.id)+'/scan',{method:'POST'});await loadCatalog();$('status').textContent='Scan complete.'}
 catch{$('status').textContent='Scan failed.'}finally{$('scan').disabled=false}
};
function buildLibraryMenu(){
 if(libraries.length<2)return;
 const menu=$('library-menu');menu.replaceChildren(el('h4','','Music library'));
 for(const [id,name] of [['','All music libraries'],...libraries.map(l=>[String(l.id),l.name])]){
  const b=el('button','',name);b.type='button';b.setAttribute('role','menuitemradio');b.setAttribute('aria-checked',String(id===libraryFilter));
  b.addEventListener('click',()=>{libraryFilter=id;closeMenus();buildLibraryMenu();go({},true)});menu.append(b)}
 $('library-anchor').hidden=false;
}
function applyAppearance(lib){
 const look=window.WillieLibraryAppearance,icon=$('library-title-icon');
 try{
  if(lib?.icon_image_url){const img=new Image();img.src=lib.icon_image_url;img.alt='';icon.replaceChildren(img)}
  else if(look)icon.replaceChildren(look.iconTheme()!=='pirate'?look.createThemeIcon(lib?.icon||'music',60):look.createIcon(lib?.icon||'music',76));
  if(look&&lib?.font)$('page-title').className='library-font--'+(look.fonts[lib.font]?lib.font:'default');
 }catch{}
 const m=$('library-masthead');
 m.style.setProperty('--masthead-x',(lib?.header_x??75)+'%');m.style.setProperty('--masthead-y',(lib?.header_y??50)+'%');
 m.style.setProperty('--masthead-scale',(lib?.header_scale??100)/100);m.style.setProperty('--masthead-opacity',(lib?.header_opacity??60)/100);
 $('library-header-art').src=lib?.header_image_url||'/assets/library-header-music.png';
 if(lib?.name&&libraries.length===1)$('page-title').textContent=lib.name;
}
async function loadCatalog(){
 const r=await fetch('/api/music/catalog',{cache:'no-store'});if(!r.ok)throw Error('Music catalog unavailable');
 tracks=(await r.json()).tracks||[];route();
}
async function boot(){
 libraryFilter=new URLSearchParams(location.search).get('library_id')||'';
 view=store.get('view','albums');if(!SORTS[view])view='albums';sortKey=store.get('sort.'+view,'title');
 repeat=store.get('repeat','off');const vol=Number(store.get('volume','100'));audio.volume=vol/100;$('volume').value=vol;setBar($('volume'),vol);
 updatePlayButton();updateModeButtons();applyAppearance(null);
 try{
  const libs=await fetch('/api/libraries',{cache:'no-store'}).then(r=>r.ok?r.json():[]).catch(()=>[]);
  libraries=(Array.isArray(libs)?libs:[]).filter(l=>l.kind==='music');
  applyAppearance(libraries.find(l=>String(l.id)===libraryFilter)||libraries[0]||null);buildLibraryMenu();
  await loadCatalog();
  // Restore the last queue (paused) so the player survives reloads.
  try{const last=JSON.parse(store.get('last','null'));if(last?.ids?.length){const byId=new Map(tracks.map(t=>[t.id,t]));const q=last.ids.map(i=>byId.get(i)).filter(Boolean);
   if(q.length===last.ids.length){queue=q;order=last.order;pos=last.pos;shuffle=!!last.shuffle;updateModeButtons();load(false)}}}catch{}
 }catch(error){$('library-subtitle').textContent='Unable to load music: '+error.message}
}
// Align the player with the content column, whatever width the sidebar has.
function alignPlayer(){const w=document.querySelector('.workspace');if(w&&innerWidth>900)$('player').style.left=Math.max(0,w.getBoundingClientRect().left)+'px';else $('player').style.left=''}
addEventListener('resize',alignPlayer);new ResizeObserver(alignPlayer).observe(document.querySelector('.workspace'));
boot();
</script></body></html>
