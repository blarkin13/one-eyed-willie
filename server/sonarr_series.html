<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Series episodes · Yarr Media</title>
<link rel="icon" type="image/png" sizes="128x128" href="/assets/favicon.png?v=5">
<link rel="stylesheet" href="/assets/ui.css?v=wordmark-1">
<script defer src="/assets/shell.js?v=profiles-1"></script>
<style>
.sonarr-series-page{max-width:1420px}
.series-breadcrumb{display:flex;align-items:center;gap:9px;margin:7px 0 25px;font-size:.92rem;color:#a9bed4}
.series-breadcrumb a{color:#b7d8f4;text-decoration:none}
.series-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
.series-heading h1{font-size:clamp(1.8rem,4vw,3.4rem);line-height:1.12;margin:6px 0}
.series-heading p{margin:6px 0;color:#acbfd4;line-height:1.6}
.series-heading button,.series-button{border:1px solid #56728e;background:#253d58;color:#edf6ff;border-radius:9px;padding:11px 15px;font-size:.86rem;font-weight:650;cursor:pointer;min-height:42px}
.series-button:hover,.series-heading button:hover,.series-button:focus-visible{background:#365878}
.series-button:disabled{opacity:.48;cursor:default}
.series-overview{max-width:1000px;line-height:1.75;color:#b9cbdd;margin:15px 0 27px}
.series-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin:20px 0 25px}
.series-stat{padding:18px 20px;border:1px solid #344b64;border-radius:12px;background:#142437}
.series-stat strong{display:block;font-size:1.7rem}
.series-stat span{display:block;color:#adbed1;font-size:.84rem;margin-top:3px}
.series-selection{position:sticky;top:0;z-index:10;padding:15px 18px;margin:22px 0 18px;background:#14253bef;border:1px solid #41607d;border-radius:13px;backdrop-filter:blur(14px);box-shadow:0 12px 34px #0005}
.series-selection-summary{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.series-selection-actions,.series-select-tools{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.series-select-tools{margin:16px 0 18px}
.series-selected-count{font-size:.98rem;font-weight:700}
.series-season{border:1px solid #364c66;border-radius:14px;background:#111e2f;margin:14px 0;overflow:hidden}
.series-season>summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px;cursor:pointer;list-style:none}
.series-season>summary::-webkit-details-marker{display:none}
.series-season>summary::after{content:"⌄";font-size:1.5rem;color:#b5cfe8;transition:transform .2s;flex:0 0 auto}
.series-season[open]>summary::after{transform:rotate(180deg)}
.series-season-title{display:block;font-size:1.14rem;font-weight:760}
.series-season-meta{display:block;font-size:.82rem;color:#b0c4d8;margin-top:5px}
.series-season-body{padding:0 18px 15px}
.series-season-controls{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid #2f465e;padding:15px 0}
.series-episode{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;border-top:1px solid #304358;padding:15px 0}
.series-episode:first-of-type{border-top:0}
.series-episode input[type=checkbox]{width:21px;height:21px;accent-color:#b5dafa;cursor:pointer;margin:0}
.series-episode strong{font-size:.96rem;display:block;line-height:1.4}
.series-episode small{font-size:.81rem;display:block;color:#aec0d4;line-height:1.5;margin-top:4px}
.series-episode p{font-size:.84rem;color:#a7b9ce;margin:6px 0 0;line-height:1.5}
.series-episode .series-buttons{display:flex;flex-wrap:wrap;gap:7px}
.series-buttons button{border:1px solid #4d6885;border-radius:8px;background:#1f3852;color:#e8f3fc;padding:9px 11px;min-height:38px;cursor:pointer;font-size:.79rem;font-weight:650}
.series-buttons button:hover,.series-buttons button:focus-visible{background:#345779}
.series-buttons button:disabled{opacity:.45}
.series-episode.selected{background:#1b3147}
.series-info{min-height:24px;color:#c3d5e8;margin:8px 0}
.series-info.error{color:#ffb6b6}
.series-empty{padding:25px 12px;color:#b1c5d7}
.series-manual-dialog{width:min(880px,calc(100vw - 24px));max-width:none;max-height:88vh;overflow-y:auto;border-radius:14px;border:1px solid #4a6989;background:#111d2b;color:#eaf4ff;padding:23px}
.series-manual-dialog::backdrop{background:#030910d9}
.series-manual-header{display:flex;justify-content:space-between;gap:12px;align-items:center}
.series-manual-header h2{margin:0;font-size:1.3rem}
.series-manual-header button{background:#263d56;color:white;border:0;border-radius:8px;min-width:40px;min-height:40px;font-size:1.5rem}
.series-manual-item{padding:14px 0;border-top:1px solid #344b63;display:flex;justify-content:space-between;gap:13px;align-items:center}
.series-manual-item small{display:block;color:#b3c8da;margin-top:6px}
@media(max-width:950px){.series-episode{grid-template-columns:auto 1fr}.series-episode .series-buttons{grid-column:2}}
@media(max-width:650px){.series-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.series-stat{padding:12px}.series-stat strong{font-size:1.35rem}.series-season>summary{padding:16px}.series-season-body{padding:0 12px 14px}.series-selection{padding:12px}.series-episode{gap:11px}.series-episode .series-buttons{gap:6px}.series-buttons button{font-size:.75rem}.series-manual-item{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:reduce){.series-season>summary::after{transition:none}}
.series-file-state{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:7px;padding:5px 9px;font-size:.77rem;font-weight:750;line-height:1.25;white-space:nowrap}
.series-file-state.downloaded{color:#b6f0d1;background:#153a30;border-color:#386a58}
.series-file-state.missing{color:#ffd9ac;background:#36281c;border-color:#74543a}
.series-episode-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.series-file-details{font-size:.81rem;color:#b7cfdf;margin:5px 0 0;overflow-wrap:anywhere}
.series-season-downloads{color:#b6f0d1}
.series-file-state::before{content:"✓";font-size:.85rem}
.series-file-state.missing::before{content:"—"}
</style></head>
<body data-page="sonarr"><div class="app-shell"><aside class="sidebar" id="app-nav" aria-label="Sidebar"></aside>
<div class="workspace"><main class="content sonarr-series-page">
<nav class="series-breadcrumb" aria-label="Breadcrumb"><a href="/sonarr">Sonarr</a><span aria-hidden="true">/</span><span id="breadcrumb-title">Series</span></nav>
<header class="series-heading"><div><p class="eyebrow">SONARR · SERIES</p><h1 id="series-title">Loading series…</h1>
<p id="series-meta"></p></div>
<button type="button" id="series-refresh">Refresh episodes</button></header>
<p class="series-overview" id="series-overview"></p>
<p class="series-info" id="series-status" role="status">Loading seasons and episodes…</p>
<div id="series-body" hidden>
<div class="series-stats">
<div class="series-stat"><strong id="stat-seasons">0</strong><span>Seasons</span></div>
<div class="series-stat"><strong id="stat-episodes">0</strong><span>Episodes</span></div>
<div class="series-stat"><strong id="stat-monitored">0</strong><span>Monitored</span></div>
<div class="series-stat"><strong id="stat-downloaded">0</strong><span>Downloaded</span></div>
<div class="series-stat"><strong id="stat-missing">0</strong><span>Not downloaded</span></div>
</div>
<div class="series-selection" aria-label="Selected episode actions">
<div class="series-selection-summary"><span class="series-selected-count" id="series-count" aria-live="polite">0 episodes selected</span>
<div class="series-selection-actions">
<button type="button" class="series-button" id="bulk-monitor" disabled>Monitor selected</button>
<button type="button" class="series-button" id="bulk-unmonitor" disabled>Unmonitor selected</button>
<button type="button" class="series-button" id="bulk-search" disabled>Search selected</button></div></div>
<div class="series-select-tools">
<button class="series-button" type="button" id="select-unfiled">Select not downloaded</button>
<button class="series-button" type="button" id="select-downloaded">Select downloaded</button>
<button class="series-button" type="button" id="select-monitored">Select monitored</button>
<button class="series-button" type="button" id="select-all">Select all</button>
<button class="series-button" type="button" id="select-clear">Clear selection</button></div>
</div>
<div id="series-seasons"></div></div>
<dialog class="series-manual-dialog" id="manual-dialog" aria-labelledby="manual-title">
<div class="series-manual-header"><h2 id="manual-title">Manual episode search</h2>
<button type="button" aria-label="Close manual search" id="manual-close">×</button></div>
<p class="series-info" id="manual-status" role="status"></p><div id="manual-results"></div></dialog>
</main></div></div>
<script>
const $=id=>document.getElementById(id);
const match=location.pathname.match(/^\/sonarr\/series\/([1-9]\d*)\/?$/);
const seriesId=match?Number(match[1]):0;
let data=null,busy=false,initialized=false;
const selected=new Set(),expanded=new Set();
const apiBase='/api/managers/sonarr';
function status(message,error=false){$('series-status').textContent=message;$('series-status').classList.toggle('error',error)}
async function api(url,options){
 const response=await fetch(url,options);
 const payload=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(typeof payload.detail==='string'?payload.detail:'The Sonarr request failed.');
 return payload;
}
function textEl(tag,text,className){
 const el=document.createElement(tag);el.textContent=String(text??'');
 if(className)el.className=className;
 return el;
}
function button(text,click,disabled=false){
 const node=document.createElement('button');node.type='button';node.textContent=text;node.disabled=disabled;
 node.addEventListener('click',click);return node;
}
function formatFileSize(size){
 if(typeof size!=='number'||!Number.isFinite(size)||size<0)return '';
 const units=['B','KB','MB','GB','TB'];
 let n=size,index=0;
 while(n>=1024&&index<units.length-1){n/=1024;index++}
 return n.toFixed(index===0?0:1)+' '+units[index];
}
function labels(episode){
 const season=String(episode.season??0).padStart(2,'0');
 const number=String(episode.episode??0).padStart(2,'0');
 return 'S'+season+'E'+number;
}
function rememberExpanded(){
 for(const el of $('series-seasons').querySelectorAll('details[data-season]')){
  const number=Number(el.dataset.season);
  if(el.open)expanded.add(number);else expanded.delete(number);
 }
}
function updateSelected(){
 for(const id of Array.from(selected)){
  if(!data.episodes.some(ep=>ep.id===id))selected.delete(id);
 }
 $('series-count').textContent=selected.size+' episode'+(selected.size===1?'':'s')+' selected';
 for(const key of ['bulk-monitor','bulk-unmonitor','bulk-search'])$(key).disabled=!selected.size||busy;
 for(const checkbox of $('series-seasons').querySelectorAll('input[data-episode-id]')){
  checkbox.checked=selected.has(Number(checkbox.dataset.episodeId));
  checkbox.closest('.series-episode')?.classList.toggle('selected',checkbox.checked);
 }
}
async function command(action,ids,description){
 if(busy)return;
 const unique=[...new Set(ids)].filter(Number.isInteger);
 if(!unique.length){status('Select at least one episode first.',true);return}
 if(action==='search'&&!confirm('Search indexers for '+unique.length+' episode'+(unique.length===1?'':'s')+'?'))return;
 busy=true;updateSelected();status(description+'…');
 try{
  for(let start=0;start<unique.length;start+=400){
   const group=unique.slice(start,start+400);
   await api(apiBase+'/series/'+seriesId+'/episodes/bulk',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,episode_ids:group})
   });
  }
  if(action!=='search'){
   await refresh({preserveSelection:false});
   status(unique.length+' episode'+(unique.length===1?'':'s')+' updated in Sonarr.');
  }else status('Search queued for '+unique.length+' episode'+(unique.length===1?'':'s')+'.');
 }catch(error){status(error.message,true);if(action!=='search')await refresh({preserveSelection:true})}
 finally{busy=false;updateSelected()}
}
function render(){
 if(!data)return;
 $('series-title').textContent=data.title||'Unnamed series';
 $('breadcrumb-title').textContent=data.title||'Series';
 document.title=(data.title||'Series')+' · Sonarr · Yarr Media';
 $('series-meta').textContent=[data.year,data.status,data.network,data.series_type].filter(Boolean).join(' · ');
 $('series-overview').textContent=data.overview||'';
 $('stat-seasons').textContent=String(data.seasons.length);
 $('stat-episodes').textContent=String(data.episodes.length);
 $('stat-monitored').textContent=String(data.episodes.filter(ep=>ep.monitored).length);
 $('stat-downloaded').textContent=String(data.episodes.filter(ep=>ep.has_file).length);
 $('stat-missing').textContent=String(data.episodes.filter(ep=>!ep.has_file).length);
 const destination=$('series-seasons');destination.replaceChildren();
 const seasons=data.seasons.length?data.seasons:
  [...new Set(data.episodes.map(ep=>ep.season))].filter(Number.isInteger).sort((a,b)=>a-b).map(number=>({number}));
 for(const season of seasons){
  const entries=data.episodes.filter(ep=>ep.season===season.number);
  const details=document.createElement('details');details.className='series-season';details.dataset.season=String(season.number);
  details.open=expanded.has(season.number);
  const summary=document.createElement('summary');
  const info=document.createElement('span');
  info.append(textEl('span',season.number===0?'Specials':'Season '+season.number,'series-season-title'));
  info.append(textEl('span',entries.filter(ep=>ep.has_file).length+' of '+entries.length+' downloaded · '+
   entries.filter(ep=>ep.monitored).length+' monitored','series-season-meta'));
  summary.append(info);details.append(summary);
  details.addEventListener('toggle',()=>{
    if(details.open)expanded.add(season.number);else expanded.delete(season.number);
  });
  const body=document.createElement('div');body.className='series-season-body';
  const controls=document.createElement('div');controls.className='series-season-controls';
  controls.append(button('Select season',()=>{
   for(const ep of entries)if(ep.id)selected.add(ep.id);
   updateSelected();
  },!entries.length));
  controls.append(button('Monitor season',async()=>{
   await command('monitor',entries.map(ep=>ep.id),'Monitoring season');
  },!entries.length));
  controls.append(button('Unmonitor season',async()=>{
   await command('unmonitor',entries.map(ep=>ep.id),'Unmonitoring season');
  },!entries.length));
  controls.append(button('Search season',async()=>{
   if(busy)return;
   if(!confirm('Search indexers for Season '+season.number+'?'))return;
   busy=true;updateSelected();status('Starting season search…');
   try{
    await api(apiBase+'/extended-command',{
     method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({action:'season',series_id:seriesId,season:season.number})
    });
    status('Season '+season.number+' search queued in Sonarr.');
   }catch(error){status(error.message,true)}
   finally{busy=false;updateSelected()}
  },!entries.length));
  body.append(controls);
  for(const ep of entries){
   const row=document.createElement('article');row.className='series-episode';
   const checkbox=document.createElement('input');checkbox.type='checkbox';
   checkbox.dataset.episodeId=String(ep.id);
   checkbox.checked=selected.has(ep.id);checkbox.disabled=!ep.id;
   checkbox.setAttribute('aria-label','Select '+labels(ep)+' '+(ep.title||''));
   checkbox.addEventListener('change',()=>{
    if(checkbox.checked)selected.add(ep.id);else selected.delete(ep.id);
    updateSelected();
   });
   const info=document.createElement('div');
   const headline=document.createElement('div');headline.className='series-episode-heading';
   headline.append(textEl('strong',labels(ep)+' · '+(ep.title||'Untitled episode')));
   const fileBadge=textEl('span',ep.has_file?'Downloaded':'Not downloaded',
     'series-file-state '+(ep.has_file?'downloaded':'missing'));
   fileBadge.setAttribute('aria-label',ep.has_file?'Downloaded file available':'No downloaded file in Sonarr');
   headline.append(fileBadge);info.append(headline);
   info.append(textEl('small',[ep.air_date,
     ep.monitored?'Monitored':'Not monitored'].filter(Boolean).join(' · ')));
   if(ep.has_file){
    const details=[ep.file_quality,formatFileSize(ep.file_size),ep.file_name].filter(Boolean);
    if(details.length)info.append(textEl('div',details.join(' · '),'series-file-details'));
   }
   if(ep.overview)info.append(textEl('p',ep.overview.slice(0,320)));
   const actions=document.createElement('div');actions.className='series-buttons';
   actions.append(button(ep.monitored?'Unmonitor':'Monitor',()=>{
    command(ep.monitored?'unmonitor':'monitor',[ep.id],ep.monitored?'Unmonitoring episode':'Monitoring episode');
   },!ep.id||busy));
   actions.append(button('Search',()=>command('search',[ep.id],'Searching for episode'),!ep.id||busy));
   actions.append(button('Manual search',()=>manualSearch(ep),!ep.id||busy));
   row.append(checkbox,info,actions);body.append(row);
  }
  if(!entries.length)body.append(textEl('p','No episode information available for this season.','series-empty'));
  details.append(body);destination.append(details);
 }
 $('series-body').hidden=false;updateSelected();
}
async function refresh(options={}){
 if(!seriesId){status('Invalid series. Return to Sonarr and select a series.',true);return}
 if(initialized)rememberExpanded();
 status('Loading episodes…');
 $('series-refresh').disabled=true;
 try{
  const result=await api(apiBase+'/details/'+seriesId,{cache:'no-store'});
  if(!Array.isArray(result.episodes)||!Array.isArray(result.seasons))throw Error('Sonarr did not return season and episode data.');
  data=result;
  if(!initialized){
   const first=data.seasons.find(x=>x.number===1)||data.seasons.find(x=>x.number!==0)||data.seasons[0];
   if(first)expanded.add(first.number);
  }
  initialized=true;
  if(!options.preserveSelection)selected.clear();
  render();
  status('Select episodes or use the controls beside each one.');
 }catch(error){status(error.message+' Check your Sonarr connection.',true)}
 finally{$('series-refresh').disabled=false}
}
$('series-refresh').onclick=()=>refresh({preserveSelection:true});
$('bulk-monitor').onclick=()=>command('monitor',[...selected],'Monitoring selected episodes');
$('bulk-unmonitor').onclick=()=>command('unmonitor',[...selected],'Unmonitoring selected episodes');
$('bulk-search').onclick=()=>command('search',[...selected],'Searching selected episodes');
$('select-unfiled').onclick=()=>{
 if(!data)return;
 selected.clear();data.episodes.filter(ep=>ep.id&&!ep.has_file).forEach(ep=>selected.add(ep.id));
 updateSelected();
};
$('select-downloaded').onclick=()=>{
 if(!data)return;
 selected.clear();data.episodes.filter(ep=>ep.id&&ep.has_file).forEach(ep=>selected.add(ep.id));
 updateSelected();
};
$('select-monitored').onclick=()=>{
 if(!data)return;
 selected.clear();data.episodes.filter(ep=>ep.id&&ep.monitored).forEach(ep=>selected.add(ep.id));
 updateSelected();
};
$('select-all').onclick=()=>{
 if(!data)return;
 data.episodes.filter(ep=>ep.id).forEach(ep=>selected.add(ep.id));updateSelected();
};
$('select-clear').onclick=()=>{selected.clear();updateSelected()};
const dialog=$('manual-dialog');
$('manual-close').onclick=()=>dialog.close();
dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
async function manualSearch(ep){
 const title=labels(ep)+' · '+(ep.title||'Episode');
 $('manual-title').textContent='Manual search: '+title;
 const resultArea=$('manual-results');resultArea.replaceChildren();
 $('manual-status').textContent='Loading available releases…';
 dialog.showModal();
 try{
  const q=new URLSearchParams({item_id:String(seriesId),episode_id:String(ep.id)});
  const response=await api(apiBase+'/releases?'+q,{cache:'no-store'});
  if(!dialog.open)return;
  $('manual-status').textContent=(response.items||[]).length+' releases found.';
  for(const release of response.items||[]){
   const row=document.createElement('div');row.className='series-manual-item';
   const info=document.createElement('div');info.append(textEl('strong',release.title));
   info.append(textEl('small',[release.indexer,release.quality,release.protocol,
    release.age!=null?release.age+' days old':null].filter(Boolean).join(' · ')));
   if(release.rejections?.length)info.append(textEl('small',release.rejections.join(' · ')));
   const grab=button('Grab release',async()=>{
    if(!confirm('Grab '+release.title+' through Sonarr?'))return;
    grab.disabled=true;$('manual-status').textContent='Sending release to Sonarr…';
    try{
     await api(apiBase+'/releases/grab',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({item_id:seriesId,episode_id:ep.id,guid:release.guid,indexer_id:release.indexer_id})});
     $('manual-status').textContent='Release added to Sonarr.';
    }catch(error){$('manual-status').textContent=error.message;grab.disabled=false}
   },!release.guid||!release.indexer_id);
   row.append(info,grab);resultArea.append(row);
  }
  if(!resultArea.children.length)resultArea.append(textEl('p','No releases available from your indexers.','series-empty'));
 }catch(error){$('manual-status').textContent=error.message}
}
refresh();
</script></body></html>
