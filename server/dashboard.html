<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>One-Eyed Willie · Home</title>
<link rel="icon" type="image/png" sizes="128x128" href="/assets/favicon.png?v=5">
<link rel="stylesheet" href="/assets/ui.css?v=appearance-1">
<script defer src="/assets/shell.js?v=appearance-1"></script>
<script defer src="/assets/player.js?v=continue-next-1"></script>
<style>
.shelf{margin-top:36px}.shelf:first-of-type{margin-top:0}
.shelf-title{font-size:1.24rem;letter-spacing:-.025em;margin:0}.shelf-desc{color:var(--muted);font-size:.82rem;margin:4px 0 0}
.shelf-track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,193px);gap:18px;overflow-x:auto;padding:4px 2px 18px;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;scrollbar-color:#40516b transparent}
/* Shelves remain single-row horizontal carousels, never vertically scrollable. */
.shelf-track{
 grid-template-rows:minmax(0,1fr);
 grid-auto-rows:0;
 align-items:start;
 overflow-x:auto;
 overflow-y:hidden;
 overscroll-behavior-x:contain;
 overscroll-behavior-y:auto;
 max-height:none;
 scrollbar-width:thin;
}
.shelf-track>.tile{min-width:0;min-height:0}
.shelf-track .tile{scroll-snap-align:start}.shelf-track .tile h3{margin-top:10px}
.shelf-empty{margin-top:13px;min-height:156px;padding:24px 28px;border:1px dashed #35465a;border-radius:14px;background:linear-gradient(130deg,#161c26,#11161e);display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.shelf-empty h3{font-size:1.03rem;margin:0 0 5px}.shelf-empty p{margin:0;color:var(--muted);max-width:570px;font-size:.89rem}
.progress-time{font-size:.75rem;color:#b8d4ee;margin-top:9px;font-weight:650}
.next-episode-badge{display:inline-block;margin-top:8px;color:#b8d6f4;font-size:.75rem;font-weight:700;letter-spacing:.02em}
.progress-track{height:4px;border-radius:4px;background:#2c394b;margin-top:9px;overflow:hidden}.progress-fill{height:100%;background:#a3d4ff;border-radius:4px}
.shelf-action{font-size:.84rem;color:#b4d6ff;font-weight:650}.page-lead{max-width:650px;color:#9aa9bc}
@media(max-width:620px){.shelf{margin-top:31px}.shelf-track{grid-auto-columns:minmax(145px,42%);gap:12px}.shelf-empty{padding:19px}.shelf-title{font-size:1.1rem}}

/* Cinematic Home selection: information belongs to the focused poster, never
   a permanently fixed banner. The whole hero scrolls away with the first row. */
.home-feature{height:clamp(235px,31vh,355px);min-height:235px;position:relative;
 display:flex;align-items:flex-end;margin:0 0 18px;padding:20px clamp(18px,3.2vw,46px);
 overflow:hidden;isolation:isolate;border-radius:12px;
 background:linear-gradient(115deg,#111c2c,#0b1424);color:#edf6ff}
.home-feature::after{content:"";position:absolute;inset:0;z-index:-1;
 background:linear-gradient(90deg,#090f1af5 0%,#090f1ad5 40%,#090f1a42 100%),
 linear-gradient(0deg,#09111c9a,transparent 65%);pointer-events:none}
.home-feature-art{position:absolute;inset:0;z-index:-2;width:100%;height:100%;
 object-fit:cover;object-position:center 34%;opacity:0;transform:scale(1.035);
 transition:opacity .32s ease,transform .62s ease}
.home-feature-art.is-visible{opacity:1;transform:scale(1)}
.home-feature-copy{width:min(660px,90%);max-height:100%;overflow:hidden}
.home-feature-eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;
 color:#b9d3ee;font-weight:750;margin:0 0 4px}
.home-feature-title{font-size:clamp(1.65rem,3.2vw,3.3rem);font-weight:800;
 line-height:1.1;letter-spacing:-.045em;margin:0 0 7px;
 display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.home-feature-meta{display:flex;gap:8px 15px;align-items:center;flex-wrap:wrap;
 font-size:.83rem;font-weight:650;color:#cadcf0;margin:0 0 8px}
.home-feature-meta:empty{display:none}
.home-feature-summary{font-size:clamp(.82rem,1.1vw,.96rem);line-height:1.5;
 max-width:620px;margin:0;color:#d3dfeb;
 display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.home-feature-copy.is-changing{animation:home-feature-enter .26s ease both}
@keyframes home-feature-enter{from{opacity:.25;transform:translateY(7px)}
 to{opacity:1;transform:translateY(0)}}
body[data-page=home] .shelf{scroll-margin-top:16px}
@media(max-width:700px){.home-feature{height:235px;padding:16px 20px;margin-bottom:12px}
 .home-feature-title{font-size:1.7rem}.home-feature-summary{-webkit-line-clamp:2}
 .home-feature-copy{width:95%}}
@media(prefers-reduced-motion:reduce){.home-feature-art{transition:none;transform:none}
 .home-feature-copy.is-changing{animation:none}}
</style></head>
<body data-page="home">
<div class="app-shell">
  <aside id="app-nav" class="sidebar" aria-label="Sidebar"></aside>
  <div class="workspace">
    <main class="content">
      <h1 class="sr-only">Home</h1>
      <section class="home-feature" id="home-feature" aria-label="Selected media details">
        <img class="home-feature-art" id="home-feature-art" alt="" aria-hidden="true">
        <div class="home-feature-copy" id="home-feature-copy">
          <p class="home-feature-eyebrow" id="home-feature-type">YOUR LIBRARY</p>
          <h2 class="home-feature-title" id="home-feature-title">Select a title</h2>
          <div class="home-feature-meta" id="home-feature-meta"></div>
          <p class="home-feature-summary" id="home-feature-summary">Choose a movie or show to see its details.</p>
        </div>
      </section>
      <p id="status" class="status-line" role="status">Loading…</p>
      <section class="shelf" aria-labelledby="continue-heading">
        <div class="section-heading"><div><h2 id="continue-heading" class="shelf-title">Continue Watching</h2></div></div>
        <div id="continue-watching"></div>
      </section>
      <section class="shelf" aria-labelledby="movies-heading">
        <div class="section-heading"><div><h2 id="movies-heading" class="shelf-title">Recently Added Movies</h2></div><a href="/movies" class="shelf-action" title="All movies" aria-label="All movies"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
        <div id="recent-movies"></div>
      </section>
      <section class="shelf" aria-labelledby="tv-heading">
        <div class="section-heading"><div><h2 id="tv-heading" class="shelf-title">Recently Added TV Shows</h2></div><a href="/tv" class="shelf-action" title="All TV shows" aria-label="All TV shows"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
        <div id="recent-tv"></div>
      </section>
      
    </main>
  </div>
</div>
<script>
const byId=id=>document.getElementById(id);
const homeFeatureCache=new Map();
const homeItems=new WeakMap();
let homeFeatureSerial=0,homeFeatureArtworkSerial=0;
const homeArt=byId('home-feature-art'),homeCopy=byId('home-feature-copy');
function displayHomeFeature(link){
 const item=homeItems.get(link);if(!item)return;
 const serial=++homeFeatureSerial;
 const meta=byId('home-feature-meta'),summary=byId('home-feature-summary');
 // Fill immediately from the shelf model; metadata request enriches it later.
 byId('home-feature-type').textContent=item.kind==='movies'?'MOVIE':'TV SERIES';
 byId('home-feature-title').textContent=item.title||'Untitled';
 meta.textContent=[item.year,item.subtitle].filter(Boolean).join(' · ');
 summary.textContent=item.play_state==='resume'?'Continue watching where you left off.':
   item.play_state==='next'?'Your next episode is ready.':'';
 homeCopy.classList.remove('is-changing');void homeCopy.offsetWidth;
 homeCopy.classList.add('is-changing');
 const identity=item.kind+'|'+item.library_id+'|'+item.key;
 if(!homeFeatureCache.has(identity)){
   const query=new URLSearchParams({library_id:String(item.library_id),key:item.key});
   const url=(item.kind==='tv'?'/api/tv/show?':'/api/movies/details?')+query;
   homeFeatureCache.set(identity,fetch(url,{cache:'force-cache'}).then(r=>{
     if(!r.ok)throw Error('Metadata unavailable');return r.json();
   }).catch(()=>null));
   if(homeFeatureCache.size>100)homeFeatureCache.delete(homeFeatureCache.keys().next().value);
 }
 homeFeatureCache.get(identity).then(details=>{
   if(serial!==homeFeatureSerial||!link.isConnected||!details)return;
   const facts=[item.year||details.year,
     details.runtime?details.runtime+' min':null,
     details.content_rating||null,
     Number(details.rating)>0?(Number(details.rating).toFixed(1)+'/10'):null,
     ...(Array.isArray(details.genres)?details.genres.slice(0,2):[])].filter(Boolean);
   meta.textContent=[...new Set(facts.map(String))].join(' · ');
   summary.textContent=details.overview||summary.textContent;
   const artwork=details.backdrop_url;
   if(typeof artwork==='string'&&
       (artwork.startsWith('/api/artwork/')||artwork.startsWith('https://image.tmdb.org/t/p/'))){
     const artSerial=++homeFeatureArtworkSerial;
     const img=new Image();
     img.onload=()=>{
       if(serial!==homeFeatureSerial||artSerial!==homeFeatureArtworkSerial)return;
       homeArt.classList.remove('is-visible');
       homeArt.src=artwork;
       requestAnimationFrame(()=>homeArt.classList.add('is-visible'));
     };
     img.src=artwork;
   }else{
     ++homeFeatureArtworkSerial;
     homeArt.classList.remove('is-visible');homeArt.removeAttribute('src');
   }
 });
}
document.addEventListener('focusin',event=>{
 const link=event.target.closest?.('.shelf-track .tile-button');
 if(link)displayHomeFeature(link);
});
document.addEventListener('pointerover',event=>{
 const link=event.target.closest?.('.shelf-track .tile-button');
 if(link&&link!==document.activeElement)displayHomeFeature(link);
});

const moviePosterJobs=[];
const movieDetailQueue=[];
let movieDetailActive=0;
const movieDetailObserver='IntersectionObserver' in window
  ?new IntersectionObserver(entries=>{
     for(const entry of entries){
       if(!entry.isIntersecting)continue;
       movieDetailObserver.unobserve(entry.target);
       entry.target._loadMovieDetailPoster?.();
     }
   },{rootMargin:'240px'}):null;

function appendMoviePoster(cover,item,src,fromDetails=false){
  if(!cover?.isConnected||!src?.startsWith('/api/artwork/'))return false;
  const current=cover.querySelector('.poster-image');
  if(current)current.remove();
  const img=document.createElement('img');
  img.className='poster-image';img.alt=item.title+' poster';
  img.loading='lazy';img.decoding='async';
  const original=src.startsWith('/api/artwork/thumb/')
    ?src.replace('/api/artwork/thumb/','/api/artwork/'):null;
  let retried=false;
  img.onerror=()=>{
    if(original&&!retried){
      retried=true;img.src=original;return;
    }
    img.remove();
    if(!fromDetails)queueMovieDetailPoster(cover,item);
  };
  cover.append(img);img.src=src;
  return true;
}
function queueMovieDetailPoster(cover,item){
  if(cover.dataset.movieDetailRequested||!item.library_id||!item.key)return;
  cover.dataset.movieDetailRequested='1';
  const card=cover.closest('.tile');
  const enqueue=()=>{movieDetailQueue.push({cover,item});runMovieDetailQueue()};
  if(movieDetailObserver&&card){
    card._loadMovieDetailPoster=enqueue;
    movieDetailObserver.observe(card);
  }else enqueue();
}
function runMovieDetailQueue(){
  while(movieDetailActive<2&&movieDetailQueue.length){
    const {cover,item}=movieDetailQueue.shift();
    if(!cover.isConnected)continue;
    movieDetailActive++;
    const query=new URLSearchParams({library_id:String(item.library_id),key:item.key});
    fetch('/api/movies/details?'+query,{cache:'no-store'})
      .then(r=>r.ok?r.json():null)
      .then(data=>{
        if(data?.poster_url?.startsWith('/api/artwork/'))
          appendMoviePoster(cover,item,data.poster_url,true);
      }).catch(()=>{}).finally(()=>{movieDetailActive--;runMovieDetailQueue()});
  }
}
function fetchMoviePosters(){
  const jobs=moviePosterJobs.splice(0);
  if(!jobs.length)return;
  // Keep each request bounded; missing matches resolve lazily from the
  // authoritative details route rather than leaving a blank poster forever.
  const groups=[];
  for(let i=0;i<jobs.length;i+=50)groups.push(jobs.slice(i,i+50));
  Promise.all(groups.map(part=>fetch('/api/movies/posters',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({items:part.map(job=>({
      library_id:job.item.library_id,key:job.item.key
    }))})
  }).then(response=>response.ok?response.json():null)
    .then(data=>{
      const byKey=new Map((data?.items||[])
        .map(entry=>[entry.library_id+'|'+entry.key,entry.poster_url]));
      for(const {cover,item} of part){
        if(!cover.isConnected)continue;
        const src=byKey.get(item.library_id+'|'+item.key);
        if(!src?.startsWith('/api/artwork/'))
          queueMovieDetailPoster(cover,item);
        else appendMoviePoster(cover,item,src);
      }
    }).catch(()=>{for(const {cover,item} of part)queueMovieDetailPoster(cover,item)})));
}
const posterJobs=[];let activePosters=0;
function loadPoster(cover,item){
  posterJobs.push({cover,item});nextPoster();
}
function nextPoster(){
  while(activePosters<3&&posterJobs.length){
    const {cover,item}=posterJobs.shift();activePosters++;
    const query=new URLSearchParams({library_id:String(item.library_id),key:item.key});
    fetch('/api/tv/poster?'+query,{cache:'no-store'})
      .then(response=>response.ok?response.json():null)
      .then(data=>{
        if(!(data?.poster_url?.startsWith('/api/artwork/')))return;
        if(!cover.isConnected)return;
        const img=document.createElement('img');img.className='poster-image';img.alt=item.title+' poster';
        img.src=data.poster_url;img.loading='lazy';img.referrerPolicy='no-referrer';cover.append(img);
      }).catch(()=>{}).finally(()=>{activePosters--;nextPoster()});
  }
}
function tile(item, watching=false){
  const nextEpisode=watching&&item.play_state==='next';
  const article=document.createElement('article');article.className='tile';
  const link=document.createElement('a');link.className='tile-button';
  link.href=item.kind==='tv'&&item.library_id&&item.key
    ?'/tv/show?'+new URLSearchParams({library_id:String(item.library_id),key:item.key})
    :'/movie?'+new URLSearchParams({library_id:String(item.library_id),key:item.key});
  homeItems.set(link,item);
  link.setAttribute('aria-label',watching
    ?(nextEpisode?'Play next episode of ':'Resume ')+item.title+' · '+(item.subtitle||'')
    :'Browse '+item.title);
  if(item.library_id&&item.key){
    link.dataset.hoverKind=item.kind==='movies'?'movies':'tv';
    link.dataset.hoverLibraryId=String(item.library_id);link.dataset.hoverKey=item.key;
  }
  if(watching && item.media_id){
    link.href='/watch/'+item.media_id;
    link.addEventListener('click',event=>{
      if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
      event.preventDefault();
      WilliePlayer.open(item.media_id,item.title+' · '+(item.subtitle||''),{restart:nextEpisode});
    });
  }
  const cover=document.createElement('div');
  let hash=0;for(const ch of item.title)hash=(hash*31+ch.charCodeAt(0))>>>0;
  cover.className='cover cover--'+(hash%6);
  const top=document.createElement('div');top.className='cover-top';
  const type=document.createElement('span');type.className='media-type';type.textContent=item.kind==='movies'?'MOVIE':'SERIES';top.appendChild(type);
  const initial=document.createElement('div');initial.className='cover-initial';initial.setAttribute('aria-hidden','true');initial.textContent=item.title.trim().slice(0,1).toUpperCase()||'W';
  const coverTitle=document.createElement('div');coverTitle.className='cover-title';coverTitle.textContent=item.title;
  cover.append(top,initial,coverTitle);
  const title=document.createElement('h3');title.textContent=item.title;title.title=item.title;
  const meta=document.createElement('div');meta.className='tile-meta';
  meta.textContent=(nextEpisode?'Up next · ':'')+
    (item.year?item.year+' · ':'')+(item.subtitle||'');
  link.append(cover,title,meta);
  if(item.watched){
    const indicator=document.createElement('span');indicator.className='watched-badge';
    indicator.setAttribute('aria-label','Watched');indicator.title='Watched';
    indicator.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"/><path d="M12 22V8M5 12H2a10 10 0 0 0 20 0h-3"/></svg>';
    article.append(indicator);
  }
  if(item.poster_url?.startsWith('/api/artwork/')){
    // This card is not connected yet: append the indexed image now and
    // check any failed thumbnail after the card enters the document.
    const img=document.createElement('img');img.className='poster-image';img.alt=item.title+' poster';
    img.loading='lazy';img.decoding='async';
    const src=item.poster_url;
    const original=src.startsWith('/api/artwork/thumb/')
      ?src.replace('/api/artwork/thumb/','/api/artwork/'):null;
    let retried=false;
    img.onerror=()=>{
      if(original&&!retried){retried=true;img.src=original;return;}
      img.remove();queueMovieDetailPoster(cover,item);
    };
    img.src=src;cover.append(img);
  }else if(item.kind==='tv'&&item.library_id&&item.key)loadPoster(cover,item);
  else if(item.kind==='movies'&&item.library_id&&item.key)moviePosterJobs.push({cover,item});
  if(watching&&!nextEpisode){
    const position=Number(item.position_seconds)||0;
    const duration=Number(item.duration_seconds)||0;
    if(duration>0){
      const bar=document.createElement('div');bar.className='progress-track';bar.setAttribute('role','progressbar');
      const percent=Math.max(0,Math.min(100,Number(item.progress_percent)||0));
      bar.setAttribute('aria-label','Watched progress');bar.setAttribute('aria-valuemin','0');bar.setAttribute('aria-valuemax','100');bar.setAttribute('aria-valuenow',String(percent));
      const fill=document.createElement('div');fill.className='progress-fill';fill.style.width=percent+'%';bar.appendChild(fill);link.append(bar);
    }else{
      const watched=document.createElement('div');watched.className='progress-time';
      const minutes=Math.max(1,Math.floor(position/60));
      watched.textContent=minutes+' min watched';
      watched.setAttribute('aria-label','Resume from '+minutes+' minutes');
      link.append(watched);
    }
  }
  if(nextEpisode){
    const marker=document.createElement('span');marker.className='next-episode-badge';
    marker.textContent='Next episode';
    link.append(marker);
  }
  article.appendChild(link);return article;
}
function shelf(id,items,emptyTitle,emptyDescription,watching=false){
 const target=byId(id);target.replaceChildren();
 if(!Array.isArray(items)||!items.length){
  const empty=document.createElement('div');empty.className='shelf-empty';
  const title=document.createElement('h3');title.textContent=emptyTitle;
  const info=document.createElement('p');info.textContent=emptyDescription;
  empty.append(title,info);target.appendChild(empty);return;
 }
 const track=document.createElement('div');track.className='shelf-track';
 for(const item of items)track.appendChild(tile(item,watching));target.appendChild(track);
}
async function load(){
  try{
    const response=await fetch('/api/home',{cache:'no-store'});
    if(!response.ok)throw Error('Server returned '+response.status);
    const data=await response.json();

    shelf('continue-watching',data.continue_watching,'Nothing in progress yet','',true);
    shelf('recent-movies',data.recent_movies,'No movies yet','');
    shelf('recent-tv',data.recent_tv,'No TV shows yet','');
    fetchMoviePosters();
    byId('status').textContent='';
    const focus=document.activeElement?.closest?.('.shelf-track .tile-button');
    const initial=focus||document.querySelector('.shelf-track .tile-button');
    if(initial)displayHomeFeature(initial);
  }catch(error){byId('status').textContent='Unable to load the home library: '+error.message;}
}
document.addEventListener('willie:watch-updated',load);
// Refresh when returning from a different playback tab or browser page.
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
window.addEventListener('pageshow',event=>{if(event.persisted)load()});
load();
</script></body></html>
