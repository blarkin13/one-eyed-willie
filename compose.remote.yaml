# Opt-in secure remote mode; use INSTEAD of compose.yaml, not alongside it.
# Required environment: WILLIE_HOSTNAME, WILLIE_USERNAME, WILLIE_PASSWORD_HASH
services:
  one-eyed-willie:
    build: .
    image: one-eyed-willie:local
    container_name: one-eyed-willie
    restart: unless-stopped
    user: "1000:1000"
    environment:
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_TOKEN: ${OPENSUBTITLES_TOKEN:-}
      MEDIA_ROOT: /media
      DATABASE_PATH: /data/library.sqlite3
      # Forward only authenticated ICE diagnostic offers to the host-network sidecar.
      YARR_ICE_PROBE_USE_HOST_NETWORK: "1"
      # Off by default: never route real media over experimental WebRTC implicitly.
      YARR_DIRECT_PEER_ENABLED: ${YARR_DIRECT_PEER_ENABLED:-0}
      # Temporary, account-gated direct MP4 test; regular playback remains off.
      YARR_DIRECT_TEST_ENABLED: ${YARR_DIRECT_TEST_ENABLED:-1}
    # Preserve existing home-network access; never forward 8787 on the router.
    ports:
      - "8787:8787"
    volumes:
      - /media/brian/My Book:/media:ro
      - /opt/one-eyed-willie/data:/data
      - /opt/one-eyed-willie/config:/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  # Synthetic-data WebRTC diagnostic only. Does NOT replace the media service,
  # the paired Cloudflare tunnel, or the Caddy HTTPS gateway.
  yarr-ice-diagnostic:
    image: one-eyed-willie:local
    container_name: yarr-ice-diagnostic
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    command: ["uvicorn", "server.yarr_ice_host:app", "--host", "0.0.0.0", "--port", "18799"]
    environment:
      YARR_ICE_PROBE_MODE: host
      YARR_DIRECT_PEER_ENABLED: ${YARR_DIRECT_PEER_ENABLED:-0}
      # Temporary, account-gated direct MP4 test; regular playback remains off.
      YARR_DIRECT_TEST_ENABLED: ${YARR_DIRECT_TEST_ENABLED:-1}
    volumes:
      - /opt/one-eyed-willie/data:/data:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      one-eyed-willie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18799/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  https:
    image: caddy:2
    container_name: one-eyed-willie-https
    restart: unless-stopped
    depends_on:
      one-eyed-willie:
        condition: service_healthy
    ports:
      # Only port 443 is published; the NUC already uses host port 80.
      - "443:443"
      - "443:443/udp"
    environment:
      WILLIE_HOSTNAME: ${WILLIE_HOSTNAME:?Set WILLIE_HOSTNAME}
      WILLIE_USERNAME: ${WILLIE_USERNAME:?Set WILLIE_USERNAME}
      WILLIE_PASSWORD_HASH: ${WILLIE_PASSWORD_HASH:?Set WILLIE_PASSWORD_HASH}
    volumes:
      - ./deploy/Caddyfile.remote:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
