# Yarr account/control-plane Worker.
#
#   Development:  npx wrangler deploy --env dev     -> Worker "yarr-dev", database yarr-accounts-dev
#   Production:   npx wrangler deploy               -> Worker "yarr",     database yarr-accounts
#
# Use ./deploy.sh (it runs `wrangler deploy --keep-vars`). The bindings, custom
# domains and workers.dev setting below match the live Worker as of 2026-11-19;
# --keep-vars keeps the plain-text variables set in the dashboard
# (GOOGLE_CLIENT_ID, YARR_PRIVATE_SERVER_ID, STRIPE_PRO_PRICE_ID, ...). Secrets
# are never touched by a deploy and never stored in this file; set them with
# `npx wrangler secret put NAME` (add `--env dev` for the dev Worker).
#
# Secrets used:
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   Google sign-in
#   PASS_SIGNING_KEY                         Ed25519 private JWK for remote-access passes
#                                            (generate: node cloudflare/yarr/tools/new-pass-key.mjs)
#   PASS_PREVIOUS_PUBLIC_JWK                 optional, the old public key during a rotation
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET Stripe (Pro stays unavailable until both are set)
#   YARR_PILOT_TUNNEL_TOKEN                  existing single-server pilot

name = "yarr"
main = "worker.js"
compatibility_date = "2026-11-18"
workers_dev = true
preview_urls = false
routes = [
  { pattern = "yarr.media", custom_domain = true },
  { pattern = "www.yarr.media", custom_domain = true },
  { pattern = "app.yarr.media", custom_domain = true },
  { pattern = "accounts.yarr.media", custom_domain = true },
]

[[d1_databases]]
binding = "ACCOUNTS"
database_name = "yarr-accounts"
database_id = "db4a0ec1-ab0b-49db-b95c-e84d8cef2bf0"

[[vpc_services]]
binding = "YARR_PRIVATE_API"
service_id = "01a1edf8-3ad1-7803-8e7b-dbb44af621ea"

# No [vars] here on purpose: plain-text variables live in the dashboard and
# survive deploys because deploy.sh passes --keep-vars.

[triggers]
# Daily cleanup of expired sessions, sign-in codes and rate-limit rows.
crons = ["17 9 * * *"]

[env.dev]
name = "yarr-dev"
workers_dev = true
routes = []

[[env.dev.d1_databases]]
binding = "ACCOUNTS"
database_name = "yarr-accounts-dev"
database_id = "c8bfaaf7-c7b9-40fa-aac0-21edb134b77f"

[env.dev.triggers]
crons = ["17 9 * * *"]
