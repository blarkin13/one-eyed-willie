services:
  one-eyed-willie:
    build: .
    image: one-eyed-willie:local
    container_name: one-eyed-willie
    restart: unless-stopped
    user: "1000:1000"
    environment:
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_TOKEN: ${OPENSUBTITLES_TOKEN:-}
      MEDIA_ROOT: /media
      DATABASE_PATH: /data/library.sqlite3
      # Authenticated SDP only; actual test UDP comes from the host-network sidecar.
      YARR_ICE_PROBE_USE_HOST_NETWORK: "1"
    ports:
      - "8787:8787"
    volumes:
      - /media/brian/My Book:/media:ro
      - /opt/one-eyed-willie/data:/data
      - /opt/one-eyed-willie/config:/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Small, independently restartable WebRTC transport diagnostic.
  # Does not run the media server, cloudflared, or FFmpeg; no media volume.
  # Its high UDP source ports are allocated on the Ubuntu host, avoiding
  # Docker bridge double-NAT. There is no router port-forward configured.
  yarr-ice-diagnostic:
    image: one-eyed-willie:local
    container_name: yarr-ice-diagnostic
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    command: ["uvicorn", "server.yarr_ice_host:app", "--host", "0.0.0.0", "--port", "18799"]
    volumes:
      - /opt/one-eyed-willie/data:/data:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      one-eyed-willie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18799/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
