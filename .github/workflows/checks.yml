name: Checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python -m compileall -q server
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test catalog parsing
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build -t one-eyed-willie:ci .
  google-tv-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Google TV debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: google-tv-debug-apk
          path: google-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
