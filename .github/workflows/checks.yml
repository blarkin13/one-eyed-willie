name: Checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python -m compileall -q server
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        # The transcoding tests run the real encoder (the server expects /usr/bin/ffmpeg).
        run: |
          if [ ! -x /usr/bin/ffmpeg ]; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          /usr/bin/ffmpeg -version | head -1
      - name: Install browser test dependencies
        # The Google TV navigation tests drive the runner's preinstalled Chrome.
        run: python -m pip install playwright
      - name: Test catalog parsing
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build -t one-eyed-willie:ci .
