name: Checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python -m compileall -q server
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Yarr Media display branding and legacy identity
        run: python -m unittest discover -s tests -p 'test_yarr_media_branding.py' -v
      - name: Test TV color persistence and configured sidebar links
        run: python -m unittest discover -s tests -p 'test_tv_selection_and_music_sidebar.py' -v
      - name: Install FFmpeg
        # Real transcoding tests require both binaries at their server paths.
        # Bound package manager operations so CI cannot hang indefinitely.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if [ ! -x /usr/bin/ffmpeg ] || [ ! -x /usr/bin/ffprobe ]; then
            echo "FFmpeg tools are missing; installing using bounded apt operations."
            # The runner's Ubuntu mirrors sometimes stall for minutes. If apt
            # cannot finish, fall back to a static build from GitHub, which
            # the runner can always reach.
            if ! { sudo timeout --signal=TERM --kill-after=5s 60s apt-get \
                     -o Acquire::Retries=1 -o Acquire::http::Timeout=15 \
                     -o Acquire::https::Timeout=15 update -qq &&
                   sudo timeout --signal=TERM --kill-after=5s 100s apt-get \
                     install -y -qq --no-install-recommends ffmpeg; }; then
              echo "apt did not finish; downloading a static FFmpeg build instead."
              work="$(mktemp -d)"
              curl -fsSL --retry 3 --retry-delay 5 --max-time 180 -o "$work/ffmpeg.tar.xz" \
                https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
              tar -xf "$work/ffmpeg.tar.xz" -C "$work" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
              sudo install -m 0755 "$work/ffmpeg" "$work/ffprobe" /usr/bin/
            fi
          fi
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          timeout 15s /usr/bin/ffmpeg -version | head -1
          timeout 15s /usr/bin/ffprobe -version | head -1
      - name: Install browser test dependencies
        # The Google TV navigation tests drive the runner's preinstalled Chrome.
        # tests/test_yarr_direct_host.py is written for pytest (async tests).
        run: python -m pip install playwright pytest pytest-asyncio
      - name: Check first Home poster focus at left edge
        run: PYTHONPATH=tests python -m unittest test_google_tv_home_fit_browser.TvHomeFitTests.test_first_selected_poster_is_not_clipped_at_left_edge -v
      - name: Set up Node for the account Worker tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test account Worker (yarr.media)
        run: node --test --no-warnings cloudflare/yarr/test/*.test.mjs
      - name: Test Stripe one-time Checkout and signature validation
        run: node --test tests/test_yarr_stripe_checkout.mjs
      - name: Test catalog parsing
        run: python -m unittest discover -s tests -v
      - name: Test Yarr Direct host bridge (pytest)
        run: python -m pytest tests/test_yarr_direct_host.py -q
      - name: Build Docker image
        run: docker build -t one-eyed-willie:ci .
