name: Yarr Media Google TV APK
run-name: Yarr Media Google TV APK build · ${{ github.sha }}
on:
  pull_request:
    paths:
      - 'google-tv/**'
      - '.github/workflows/google-tv.yml'
  push:
    branches: [main]
    paths:
      - 'google-tv/**'
      - '.github/workflows/google-tv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yarr-media-google-tv-debug-apk
          path: google-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
