name: Yarr remote network diagnostic
on:
  pull_request:
    paths:
      - "compose.yaml"
      - "compose.remote.yaml"
      - "server/yarr_ice_host.py"
      - "server/yarr_ice_fixed_port.py"
      - "cloudflare/yarr/worker.js"
      - "server/yarr_ice_probe.py"
      - "server/main.py"
      - "requirements.txt"
      - "tests/test_yarr_ice_probe.py"
      - ".github/workflows/yarr-ice-diagnostic.yml"
  push:
    branches: ["feature/yarr-remote-wifi-diagnostic"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connectivity-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile probe and tests
        run: python -m compileall -q server/yarr_ice_probe.py server/yarr_ice_fixed_port.py server/yarr_ice_host.py tests/test_yarr_ice_probe.py
      - name: Verify authentication, bounded transfer and real ICE connection
        run: python -m pytest -q tests/test_yarr_ice_probe.py
      - name: Validate Worker and diagnostic browser script
        run: |
          node --input-type=module --check < cloudflare/yarr/worker.js
          node - <<'NODE'
          const fs = require('fs'), vm = require('vm');
          const source = fs.readFileSync('cloudflare/yarr/worker.js', 'utf8');
          const prefix = 'const YARR_TEST_PAGE=';
          const start = source.indexOf(prefix) + prefix.length;
          const end = source.indexOf(';' + String.fromCharCode(10) + 'async function yarrWifiOffer', start);
          if (start < prefix.length || end < 0) throw Error('Diagnostic page missing');
          const html = JSON.parse(source.slice(start, end));
          const jsStart = html.indexOf('<script>') + 8;
          const jsEnd = html.indexOf('</script>', jsStart);
          if (jsStart < 8 || jsEnd < 0) throw Error('Diagnostic browser script missing');
          new vm.Script(html.slice(jsStart, jsEnd));
          console.log('Yarr diagnostic Worker and embedded browser script parse correctly');
          NODE
      - name: Validate primary service and host-network diagnostic compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml config --format json > /tmp/yarr-compose-check.json
          python - <<'PY'
          import json
          doc=json.load(open('/tmp/yarr-compose-check.json'))
          primary=doc['services']['one-eyed-willie']
          host=doc['services']['yarr-ice-diagnostic']
          assert primary.get('network_mode') != 'host', 'Must preserve existing server tunnel network'
          assert host['network_mode'] == 'host', 'Diagnostic must bypass Docker bridge NAT'
          assert host.get('read_only') is True
          assert all('/media' not in str(v) for v in host.get('volumes', [])), 'No media mounts'
          assert primary['environment']['YARR_ICE_PROBE_USE_HOST_NETWORK'] == '1'
          print('Primary Yarr network preserved; diagnostic has isolated host ICE networking')
          PY
          WILLIE_HOSTNAME=yarr-test.example WILLIE_USERNAME=test WILLIE_PASSWORD_HASH=test \
            docker compose -f compose.remote.yaml config --format json > /tmp/yarr-remote-compose-check.json
          python - <<'PY'
          import json
          local=json.load(open('/tmp/yarr-compose-check.json'))['services']
          remote=json.load(open('/tmp/yarr-remote-compose-check.json'))['services']
          for group in (local,remote):
              main=group['one-eyed-willie']
              probe=group['yarr-ice-diagnostic']
              assert main.get('network_mode') != 'host'
              assert main['environment']['YARR_ICE_PROBE_USE_HOST_NETWORK'] == '1'
              assert probe['network_mode'] == 'host'
              assert probe.get('read_only') is True
              assert probe['environment']['YARR_ICE_PROBE_MODE'] == 'host'
              assert all('/media' not in str(v) for v in probe.get('volumes', []))
          assert remote['https']['ports'], 'Retain remote Caddy listener'
          print('Both deployment modes include same diagnostic, retain existing bridge and HTTPS service')
          PY
      - name: Build production container with WebRTC dependency
        run: docker build -t yarr-ice-diagnostic:ci .
