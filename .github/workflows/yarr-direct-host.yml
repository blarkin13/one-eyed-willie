name: Yarr host-network direct media pilot
on:
  pull_request:
    paths:
      - "server/yarr_direct_peer.py"
      - "server/yarr_direct_gateway.py"
      - "server/yarr_ice_host.py"
      - "server/main.py"
      - "requirements.txt"
      - "tests/test_yarr_direct_host.py"
      - ".github/workflows/yarr-direct-host.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Compile Python transport and gateway
        run: python -m compileall -q server/yarr_direct_peer.py server/yarr_direct_gateway.py server/yarr_ice_host.py server/main.py tests/test_yarr_direct_host.py
      - name: Validate credential gates, media allowlist, and HTTP 206 byte integrity
        run: python -m pytest -q tests/test_yarr_direct_host.py tests/test_yarr_ice_probe.py
      - name: Build production container with pilot media modules
        run: docker build -t yarr-direct-host:ci .
