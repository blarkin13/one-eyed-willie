name: Release
# main            -> server image ghcr.io/blarkin13/yarr-media:edge
# tag vX.Y.Z      -> server image :X.Y.Z and :stable, plus a GitHub Release with
#                    the Google TV APK, the installer and the .deb package.
# Actions tab -> Release -> Run workflow with a version (e.g. 0.15.0) does the
#                    same as pushing the tag; the workflow creates the tag.
# The installer (yarr.media/install.sh) uses :stable unless told otherwise.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/release.yml'
    tags: ['v*.*.*']
  # Pull requests build both architectures without publishing anything.
  pull_request:
    paths:
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.15.0 (empty = just rebuild edge)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "${INPUT:-}" ]]; then v="${INPUT#v}"; fi
          if [[ -n "$v" && ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Version must look like 1.2.3" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/blarkin13/yarr-media
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && needs.version.outputs.version == '' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.version != '' }}
            type=raw,value=stable,enable=${{ needs.version.outputs.version != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: needs.version.outputs.version != ''
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Created once with deploy/deb/create-apt-key.sh. Without it the apt
      # repository is simply not updated; everything else still releases.
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Google TV and Android phone APKs
        working-directory: google-tv
        run: gradle --no-daemon :app:assembleLean :phone:assembleLean
      - name: Build .deb package
        run: bash deploy/deb/build.sh "${{ needs.version.outputs.version }}" dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          cp google-tv/app/build/outputs/apk/lean/app-lean.apk dist/yarr-media-google-tv.apk
          cp google-tv/phone/build/outputs/apk/lean/phone-lean.apk dist/yarr-media-android.apk
          cp deploy/install.sh dist/install.sh
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Made by hand in the GitHub UI: just attach (or replace) the files.
            gh release upload "$TAG" --clobber dist/yarr-media-google-tv.apk dist/yarr-media-android.apk dist/install.sh dist/*.deb
          else
            # Creates the tag at this commit if it does not exist yet.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Yarr Media $TAG" --generate-notes \
              dist/yarr-media-google-tv.apk dist/yarr-media-android.apk dist/install.sh dist/*.deb
          fi
      - name: Publish apt repository (yarr.media/apt)
        if: env.APT_SIGNING_KEY != ''
        run: |
          sudo apt-get install -y -qq apt-utils >/dev/null
          if git ls-remote --exit-code --heads origin apt-repo >/dev/null; then
            git fetch --depth 1 origin apt-repo
            git worktree add ../apt FETCH_HEAD
            git -C ../apt checkout -B apt-repo
          else
            git worktree add --detach ../apt
            git -C ../apt checkout --orphan apt-repo
            git -C ../apt rm -rfq .
          fi
          bash deploy/deb/publish-apt.sh ../apt dist/*.deb
          cd ../apt
          git add -A
          git -c user.name="Yarr Media release" -c user.email="release@yarr.media" commit -qm "apt: v${{ needs.version.outputs.version }}"
          git push origin HEAD:apt-repo
